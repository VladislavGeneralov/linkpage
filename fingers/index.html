<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Повтори пальцами</title>
<style>
  :root {
    --glass: rgba(14,14,16,.72);
    --line: rgba(255,255,255,.12);
    --dim: rgba(255,255,255,.55);
    --ok: #3ccf6e;
    --bad: #ff5d5d;
    --accent: #fff;
  }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  #wrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  video { display: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .glass { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 14px; }

  #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: var(--dim); }
  #loader.hidden { display: none; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,.15); border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Панель модулей: каждая строка — кнопка подключения своей роли */
  #conn { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 4px; padding: 10px; min-width: 210px; }
  #conn .title { font-size: 12px; color: var(--dim); padding: 0 6px 4px; text-transform: uppercase; letter-spacing: .08em; }
  .role { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border: 0; border-radius: 9px; background: transparent; text-align: left; font-size: 14px; }
  .role:not(:disabled):hover { background: rgba(255,255,255,.08); }
  .role .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex: none; transition: background .2s; }
  .role.busy .dot { background: #e8b84a; animation: pulse 1s ease-in-out infinite; }
  .role.ok .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .role.bad .dot { background: var(--bad); }
  .role.bad .label { color: var(--bad); }
  @keyframes pulse { 50% { opacity: .35; } }
  #connAll { margin-top: 6px; padding: 8px 12px; border: 0; border-radius: 9px; background: #fff; color: #000; font-weight: 600; }
  #connAll:disabled { background: rgba(255,255,255,.1); color: var(--dim); font-weight: 400; }

  /* Центральная панель: старт / ход игры / результат */
  #panel { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; width: max-content; max-width: calc(100vw - 32px); }
  .card { padding: 16px 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .big { font-size: 18px; font-weight: 600; padding: 13px 34px; border-radius: 12px; border: 0; background: #fff; color: #000; transition: transform .1s; }
  .big:not(:disabled):active { transform: scale(.97); }
  .big:disabled { opacity: .3; }
  .ghost { border: 1px solid var(--line); background: transparent; padding: 8px 16px; border-radius: 10px; color: var(--dim); }
  .hint { font-size: 13px; color: var(--dim); }
  kbd { font: 12px system-ui; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .steps { display: flex; gap: 8px; }
  .steps i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); transition: all .15s; }
  .steps i.on { background: #fff; border-color: #fff; }
  .steps i.now { border-color: #fff; transform: scale(1.3); }
  .stage { font-size: 17px; font-weight: 600; }
  .got { font-size: 14px; color: var(--dim); min-height: 1.3em; }
  #result .grid { display: grid; grid-template-columns: auto repeat(var(--n), 36px); gap: 6px; align-items: center; }
  #result .rowname { font-size: 12px; color: var(--dim); text-align: right; padding-right: 6px; }
  #result .cell { height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: rgba(255,255,255,.1); font-weight: 600; }
  #result .cell.hit { background: #23843f; }
  #result .cell.miss { background: #a23333; }
  #result .verdict { font-size: 18px; font-weight: 600; }

  /* Подсказка «рука не видна» */
  #handHint { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 14px; transition: opacity .3s; }
  #handHint.hidden { opacity: 0; pointer-events: none; }

  /* Инструменты: калибровка и отладочные углы */
  #tools { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
  #tools button { padding: 8px 12px; border-radius: 10px; font-size: 13px; }
  #tools button.flash { background: var(--ok); color: #000; }
  #info { position: absolute; top: 12px; left: 12px; white-space: pre; padding: 8px 10px; font: 11px monospace; }
  #info[hidden] { display: none; }

  @media (max-width: 600px) {
    #conn { min-width: 0; top: 8px; right: 8px; padding: 6px; }
    .role { font-size: 12px; padding: 5px 6px; }
    #info { font-size: 9px; }
    #handHint { top: auto; bottom: 34%; }
  }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="loader"><div class="spinner"></div><div id="status">загрузка модели…</div></div>

  <div id="conn" class="glass">
    <div class="title">модули</div>
    <button class="role" data-role="thumb"><span class="dot"></span><span class="label">большой · F1</span></button>
    <button class="role" data-role="index"><span class="dot"></span><span class="label">указательный · F2</span></button>
    <button class="role" data-role="middle"><span class="dot"></span><span class="label">средний · F3</span></button>
    <button class="role" data-role="ring"><span class="dot"></span><span class="label">безымянный · F4</span></button>
    <button class="role" data-role="pinky"><span class="dot"></span><span class="label">мизинец · F5</span></button>
    <button id="connAll">подключить</button>
  </div>

  <div id="handHint" class="glass hidden">покажите руку в камеру</div>
  <div id="panel"></div>
  <div id="info" class="glass" hidden></div>
  <div id="tools">
    <button id="zero" class="ghost glass" title="Расслабьте руку, выпрямите пальцы и нажмите — загибы считаются от этого положения">калибровка</button>
    <button id="anglesBtn" class="ghost glass" title="Показать углы суставов">углы</button>
  </div>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "./mp/vision_bundle.mjs";   // @mediapipe/tasks-vision 0.10.14

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const loader = document.getElementById("loader");
const status = document.getElementById("status");
const panel = document.getElementById("panel");

// Индексы точек MediaPipe: 0 = запястье, дальше по 4 на палец (основание → кончик)
const FINGERS = [
  { name: "большой",   role: "thumb",  ids: [1, 2, 3, 4] },
  { name: "указат.",   role: "index",  ids: [5, 6, 7, 8] },
  { name: "средний",   role: "middle", ids: [9, 10, 11, 12] },
  { name: "безымян.",  role: "ring",   ids: [13, 14, 15, 16] },
  { name: "мизинец",   role: "pinky",  ids: [17, 18, 19, 20] },
];
const PALM = [[0, 1], [0, 5], [5, 9], [9, 13], [13, 17], [0, 17]];
const ROLES = ["thumb", "index", "middle", "ring", "pinky"];
const ROLE_LABEL = { thumb: "большой", index: "указательный", middle: "средний", ring: "безымянный", pinky: "мизинец" };

const THRESHOLD = 10; // градусов от начального положения — с этого палец начинает краснеть
const FULL_BEND = 150; // градусов от начального положения — полный красный

// Загиб распознаётся по движению, а не по абсолютному углу: засчитывается подъём на RISE градусов
// от последнего минимума, «отпускается» после спада на DROP от пика. Дрейф «нуля» не мешает,
// и между двумя загибами не нужно разгибать палец до конца.
const RISE = [25, 35, 35, 35, 35];  // большой палец гнётся меньше остальных
const DROP = [15, 20, 20, 20, 20];
const EXT_LEAK = 15;          // °/с — минимум/пик медленно следуют за позой, медленный дрейф не засчитывается
const BEND_DEAD_MS = 400;     // один и тот же палец не чаще — дрожание даёт ложные повторы
const CROSS_MS = 250;         // после засчитанного пальца другие молчат: средний тянет за собой указательный
const WARMUP_MS = 500;        // рука только что появилась — точки ещё скачут, ничего не засчитываем
const LOST_MS = 300;          // рука пропала дольше — при возвращении снова разогрев
const ACTIVE_LOST_MS = 1500;  // «считающаяся» рука пропала дольше — считаться начнёт та, что в кадре

// ---------------- Bluetooth: одно подключение к главному модулю (хабу) ----------------
// Прошивка fingers_zephyr: один из XIAO (F1–F3) сам становится главным при включении, держит связь
// со страницей и пересылает команды остальным пальцам (XIAO и ESP32-C3). Браузер видит одно
// устройство с сервисом хаба — один диалог выбора на все пальцы.
// CMD (запись): [1, палец 1–5 (0 = все), импульсов] — сразу;
//               [2, паузаLo, паузаHi, маска шага 1, маска шага 2, …] — секвенция, время отсчитывает хаб;
//               маска: бит 0 = F1 … бит 4 = F5; [3] — стоп.
// STATUS (notify): [маска пальцев на связи, номер главного, текущий шаг или 255 = не играет].
const HUB_SERVICE = "6e5f0010-7b3a-4c2d-9e1f-a0b1c2d3e4f5";
const HUB_CMD     = "6e5f0011-7b3a-4c2d-9e1f-a0b1c2d3e4f5";
const HUB_STATUS  = "6e5f0012-7b3a-4c2d-9e1f-a0b1c2d3e4f5";
const HUB_NAME    = "Haptics";

const sleep = ms => new Promise(r => setTimeout(r, ms));

// F1 = большой, F2 = указательный, F3 = средний, F4 = безымянный, F5 = мизинец (F4/F5 — ESP32-C3).
const ROLE_DEVICE = { thumb: "F1", index: "F2", middle: "F3", ring: "F4", pinky: "F5" };
const ROLE_NUM = { thumb: 1, index: 2, middle: 3, ring: 4, pinky: 5 };
const roleBit = role => 1 << (ROLE_NUM[role] - 1);

// hub.state: idle → connecting → ready → lost → (реклама / клик) → connecting …
const hub = { state: "idle", device: null, cmd: null, mask: 0, hubId: 0, pending: null, watch: null,
              note: "", writeQ: Promise.resolve(), onStep: null };
// conn[role].state === "ready" — палец на связи у хаба (этим пользуется панель игры)
const conn = {};
for (const role of ROLES) conn[role] = { state: "idle" };

const connAllBtn = document.getElementById("connAll");

function roleEl(role) { return document.querySelector(`.role[data-role="${role}"]`); }

function renderAll() {
  const up = hub.state === "ready";
  for (const role of ROLES) {
    const ok = up && (hub.mask & roleBit(role)) !== 0;
    conn[role].state = ok ? "ready" : up ? "lost" : "idle";
    const main = up && hub.hubId === ROLE_NUM[role] ? ", главный" : "";
    const el = roleEl(role);
    el.querySelector(".label").textContent =
      `${ok ? "✓ " : ""}${ROLE_LABEL[role]} · ${ROLE_DEVICE[role]}${main}${up && !ok ? " (нет связи)" : ""}`;
    el.classList.toggle("ok", ok);
    el.classList.toggle("bad", up && !ok);
    el.classList.toggle("busy", false);
    // во время секвенции хаб одиночные импульсы игнорирует (сбили бы ритм) — кнопки выключены
    el.disabled = !ok || gameState === "playing";
    el.title = ok ? (gameState === "playing" ? "идёт секвенция" : "нажмите — один импульс") : "";
  }
  updateConnBtn();
  updateStartEnabled();
}

// Пальцы на связи у хаба. Играть можно любым набором (хоть одним модулем) — секвенция из них.
function readyRoles() { return ROLES.filter(r => conn[r].state === "ready"); }

function updateConnBtn() {
  if (!navigator.bluetooth) {
    connAllBtn.textContent = "нет Web Bluetooth (нужен Chrome / Edge / Bluefy)";
    connAllBtn.disabled = true;
    return;
  }
  const n = ROLES.filter(r => conn[r].state === "ready").length;
  const note = hub.note ? ` (${hub.note})` : "";
  connAllBtn.textContent = {
    idle: `подключить${note}`,
    connecting: `подключаюсь…${note}`,
    ready: `подключено ✓ ${n} из ${ROLES.length}`,
    lost: `нет связи — подключить снова${hub.watch ? ", жду появления" : ""}${note}`,
  }[hub.state];
  connAllBtn.disabled = hub.state === "connecting" || hub.state === "ready";
}

function onStatus(dv) {
  hub.mask = dv.getUint8(0);
  hub.hubId = dv.getUint8(1);
  const step = dv.getUint8(2);
  renderAll();
  if (hub.onStep) hub.onStep(step);
}

// requestDevice() и getDevices() могут вернуть разные JS-объекты для одного модуля: события
// от устаревших объектов игнорируются (проверка hub.device === device).
const boundDevices = new WeakSet();
function adopt(device) {
  stopWatch();
  hub.device = device;
  if (boundDevices.has(device)) return;
  boundDevices.add(device);
  device.addEventListener("gattserverdisconnected", () => {
    // Во время connecting разрывы — это наши же disconnect() между повторами, не потеря связи
    if (hub.device !== device || hub.state !== "ready") return;
    hub.cmd = null;
    hub.mask = 0;
    hub.state = "lost";
    if (hub.onStep) hub.onStep(-1);
    startWatch();
    renderAll();
  });
}

function connectHub(device) {
  if (hub.pending) return hub.pending;
  if (device && device !== hub.device) adopt(device);
  if (hub.state === "ready") return Promise.resolve(true);
  if (!hub.device) return Promise.resolve(false);
  stopWatch();
  hub.state = "connecting";
  hub.note = "";
  hub.pending = connectWithRetry().finally(() => { hub.pending = null; renderAll(); });
  renderAll();
  return hub.pending;
}

// Поиск сервиса сразу после GATT-подключения на Windows иногда отваливается с «Unreachable»
// (видели вживую, помогал обычный повтор) — до 3 попыток, с полным сбросом соединения между ними.
async function connectWithRetry() {
  const device = hub.device;
  let stage;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      stage = "подключение";
      const server = await device.gatt.connect();
      stage = "поиск сервиса";
      const service = await server.getPrimaryService(HUB_SERVICE);
      stage = "поиск характеристик";
      const cmd = await service.getCharacteristic(HUB_CMD);
      const status = await service.getCharacteristic(HUB_STATUS);
      status.oncharacteristicvaluechanged = e => onStatus(e.target.value);
      await status.startNotifications();
      hub.cmd = cmd;
      hub.state = "ready";
      onStatus(await status.readValue());
      send([1, 0, 1]);                                   // все, кто на связи, — по одному импульсу
      return true;
    } catch (e) {
      console.error("хаб", stage, `попытка ${attempt}`, e);
      try { device.gatt.disconnect(); } catch {}
      if (attempt < 3) {
        hub.note = `повтор ${attempt}/3`;
        renderAll();
        await sleep(1500);
      }
    }
  }
  hub.cmd = null;
  hub.state = "lost";
  hub.note = "";
  startWatch();
  return false;
}

// Ждём, пока хаб снова появится в эфире, и подключаемся сами, без диалога. watchAdvertisements
// есть только в Chrome с экспериментальным флагом — без него остаётся ручная кнопка.
// Если главным стал другой модуль, это другое устройство — нужен клик и диалог выбора.
function startWatch(device = hub.device) {
  if (hub.watch || !device || !device.watchAdvertisements) return;
  const ac = new AbortController();
  hub.watch = ac;
  device.addEventListener("advertisementreceived", e => {
    if (hub.watch === ac && isHubAd(e)) connectHub(device);   // connectHub() сам остановит слежение
  }, { signal: ac.signal });
  device.watchAdvertisements({ signal: ac.signal }).catch(e => {
    if (hub.watch !== ac) return;                       // остановили сами — это не ошибка
    console.error("слежение", e);
    hub.watch = null;
    renderAll();
  });
}

// Модуль, который был главным, теперь может быть ведомым: подключаемся, только если он рекламирует хаб.
// Данные производителя 0xFFFF в рекламе хаба: ['H', номер, 1 = к нему уже подключён браузер].
// Занятый хаб рекламирует себя не подключаемым — попытки бессмысленны, ждём, пока освободится.
// (Данные видны, только если разрешение выдано с optionalManufacturerData — см. requestDevice;
// у старых разрешений их нет, тогда пробуем как раньше.)
const HUB_MFR = 0xFFFF, HUB_MARK = 0x48;
const isHubAd = e => {
  if (!(e.uuids || []).map(u => u.toLowerCase()).includes(HUB_SERVICE)) return false;
  const m = e.manufacturerData && e.manufacturerData.get(HUB_MFR);
  return !(m && m.byteLength >= 3 && m.getUint8(0) === HUB_MARK && m.getUint8(2) === 1);
};

function stopWatch() {
  if (hub.watch) { hub.watch.abort(); hub.watch = null; }
}

// Диалог выбора нужен один раз: дальше браузер помнит разрешённые устройства (getDevices,
// в Chrome тоже пока за флагом). Главным в прошлый раз мог быть другой модуль — следим за всеми.
async function autoConnectGranted() {
  if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;
  const granted = (await navigator.bluetooth.getDevices()).filter(d => d.name === HUB_NAME);
  for (const device of granted) {
    if (!device.watchAdvertisements) break;
    const ac = new AbortController();
    device.addEventListener("advertisementreceived", e => {
      if (!isHubAd(e)) return;
      ac.abort();
      if (hub.state !== "ready" && !hub.pending) connectHub(device);
    }, { signal: ac.signal });
    device.watchAdvertisements({ signal: ac.signal }).catch(() => {});
  }
}

// Один клик = один диалог: в списке только модуль, который сейчас главный.
connAllBtn.onclick = () => {
  if (!navigator.bluetooth || hub.state === "ready" || hub.pending) return;
  navigator.bluetooth.requestDevice({ filters: [{ services: [HUB_SERVICE] }], optionalManufacturerData: [HUB_MFR] })
    .then(device => connectHub(device))
    .catch(e => {
      console.error("выбор устройства", e);
      hub.note = e.name === "NotFoundError" ? "не выбран" : `ошибка выбора: ${e.message || e}`;
      renderAll();
    });
};
for (const role of ROLES) roleEl(role).onclick = () => { if (gameState !== "playing") buzz(role); };   // проверка пальца: один импульс

// Записи по одной: параллельная запись в GATT падает с ошибкой.
function send(bytes) {
  hub.writeQ = hub.writeQ
    .then(() => {
      const ch = hub.cmd;
      if (!ch || hub.state !== "ready") return;
      const v = Uint8Array.from(bytes);
      // Метод «без ответа» есть не везде
      return ch.properties.writeWithoutResponse && ch.writeValueWithoutResponse
        ? ch.writeValueWithoutResponse(v)
        : ch.writeValue(v);
    })
    .catch(e => console.error("отправка", e));
  return hub.writeQ;
}

// Один импульс на конкретном пальце
function buzz(role) { return send([1, ROLE_NUM[role], 1]); }

// ---------------- Игра: старт → секвенция играется на моторах → повтор в камеру → результат ----------------
const STEP_GAP = 650;      // мс между вибро-импульсами при воспроизведении секвенции
const SEQ_MIN = 3, SEQ_MAX = 5;
const ROLE_LETTER = { thumb: "Б", index: "У", middle: "С", ring: "Бз", pinky: "М" };

let gameState = "idle";   // idle | playing | recording | result
let sequence = [];        // секвенция для этого раунда, напр. ["thumb","index","thumb","middle"]
let attempt = [];         // что реально распознано в камере
let playIdx = -1;         // какой шаг сейчас вибрирует (для точек прогресса)
let round = 0;            // номер раунда: отменённое проигрывание видит, что раунд сменился, и замолкает

function randomSequence(roles) {
  // Повтор одного пальца подряд допустим по заданию — отличать такие шаги
  // помогает BEND_DEAD_MS (не форма секвенции).
  const len = SEQ_MIN + Math.floor(Math.random() * (SEQ_MAX - SEQ_MIN + 1));
  const seq = [];
  for (let i = 0; i < len; i++) seq.push(roles[Math.floor(Math.random() * roles.length)]);
  return seq;
}

// Вся секвенция уходит хабу одной записью, шаги по времени отсчитывает он сам (таймер модуля,
// а не setTimeout и не задержки записи по BLE) — интервалы между импульсами ровные.
// Прогресс (точки) — по уведомлениям хаба о текущем шаге.
async function playSequence(seq, r) {
  await sleep(500);                                   // пауза, чтобы успеть убрать руку от кнопки
  if (r !== round) return false;
  const done = new Promise(resolve => {
    let started = false;
    const finish = ok => { if (hub.onStep === onStep) hub.onStep = null; clearTimeout(timer); resolve(ok); };
    const onStep = step => {
      if (step === -1 || r !== round) return finish(false);   // связь пропала / раунд отменён
      if (step === 255) { if (started) finish(true); return; }
      started = true;
      playIdx = step;
      renderPanel();
    };
    // страховка, если уведомления потерялись: по времени
    const timer = setTimeout(() => finish(r === round), 1000 + seq.length * STEP_GAP);
    hub.onStep = onStep;
  });
  await send([2, STEP_GAP & 255, STEP_GAP >> 8, ...seq.map(roleBit)]);
  return (await done) && r === round;
}

function updateStartEnabled() {
  if (gameState === "idle") renderPanel();
}

async function startRound() {
  const active = readyRoles();
  if (!active.length) { cancelRound(); return; }   // никого на связи — назад к экрану подключения
  const r = ++round;
  sequence = randomSequence(active);
  attempt = [];
  playIdx = -1;
  gameState = "playing";
  renderPanel();
  renderAll();                                      // кнопки пальцев — выключить на время секвенции
  if (!await playSequence(sequence, r)) {
    if (r === round) cancelRound();                 // связь пропала посреди секвенции — не висеть на «запоминайте»
    return;
  }
  gameState = "recording";
  renderPanel();
  renderAll();
}

function cancelRound() {
  round++;
  if (gameState === "playing") send([3]);             // остановить секвенцию на хабе
  if (hub.onStep) hub.onStep(-1);
  gameState = "idle";
  renderPanel();
  renderAll();
}

function onFingerBend(role) {
  if (gameState !== "recording") return;
  attempt.push(role);
  if (attempt.length >= sequence.length) {
    gameState = "result";
  }
  renderPanel();
}

const dots = (n, cls) => `<div class="steps">${Array.from({ length: n }, (_, i) => `<i class="${cls(i)}"></i>`).join("")}</div>`;
const cancelBtn = `<button class="ghost" data-act="cancel">отменить <kbd>Esc</kbd></button>`;

function renderPanel() {
  if (gameState === "idle") {
    const n = readyRoles().length;
    const ready = n > 0;
    panel.innerHTML = `
      <div class="card glass">
        <div class="hint">почувствуйте серию вибраций и повторите её загибами пальцев</div>
        <button class="big" data-act="start" ${ready ? "" : "disabled"}>старт</button>
        <div class="hint">${!ready ? "подключите модули справа"
          : n < ROLES.length ? `играем ${n} из ${ROLES.length} пальцев · <kbd>Пробел</kbd>` : "или <kbd>Пробел</kbd>"}</div>
      </div>`;
  } else if (gameState === "playing") {
    panel.innerHTML = `
      <div class="card glass">
        <div class="stage">запоминайте…</div>
        ${dots(sequence.length, i => i < playIdx ? "on" : i === playIdx ? "on now" : "")}
        ${cancelBtn}
      </div>`;
  } else if (gameState === "recording") {
    const last = attempt[attempt.length - 1];
    panel.innerHTML = `
      <div class="card glass">
        <div class="stage">повторите · шаг ${attempt.length + 1} из ${sequence.length}</div>
        ${dots(sequence.length, i => i < attempt.length ? "on" : i === attempt.length ? "now" : "")}
        <div class="got">${last ? `засчитан: ${ROLE_LABEL[last]}` : "загибайте пальцы по очереди"}</div>
        ${cancelBtn}
      </div>`;
  } else if (gameState === "result") {
    const correct = sequence.filter((w, i) => attempt[i] === w).length;
    const verdict = correct === sequence.length ? "точно повторено ✓" : `совпало ${correct} из ${sequence.length}`;
    const want = sequence.map(w => `<div class="cell">${ROLE_LETTER[w]}</div>`).join("");
    const got = sequence.map((w, i) => `<div class="cell ${attempt[i] === w ? "hit" : "miss"}">${ROLE_LETTER[attempt[i]] || "–"}</div>`).join("");
    panel.innerHTML = `
      <div id="result" class="card glass">
        <div class="verdict">${verdict}</div>
        <div class="grid" style="--n:${sequence.length}">
          <div class="rowname">было</div>${want}
          <div class="rowname">вы</div>${got}
        </div>
        <div class="hint">${ROLES.map(w => `${ROLE_LETTER[w]} — ${ROLE_LABEL[w]}`).join(" · ")}</div>
        <button class="big" data-act="start">ещё раз</button>
        <div class="hint"><kbd>Пробел</kbd> — новый раунд</div>
      </div>`;
  }
}

panel.onclick = e => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "start") startRound();
  else if (act === "cancel") cancelRound();
};

addEventListener("keydown", e => {
  if (e.target.closest("button") && (e.key === " " || e.key === "Enter")) return;   // фокус на кнопке — пусть нажмётся она сама
  if (e.key === " " && (gameState === "idle" || gameState === "result")) { e.preventDefault(); startRound(); }
  else if (e.key === "Escape" && (gameState === "playing" || gameState === "recording")) cancelRound();
});

renderPanel();
renderAll();
autoConnectGranted().catch(e => console.error("автоподключение", e));

// Если модель или камера не поднялись — показать причину, а не крутить лоадер вечно
// (ошибка top-level await в модуле приходит как "error", а не как "unhandledrejection")
const showLoadError = err => {
  if (!loader.classList.contains("hidden")) status.textContent = `ошибка: ${err?.message || err}`;
};
addEventListener("unhandledrejection", e => showLoadError(e.reason));
addEventListener("error", e => showLoadError(e.error || e.message));

// ---------------- Камера и трекинг руки ----------------
// Движок и модель лежат рядом со страницей (mp/), а не на чужих CDN: те из России отвечают
// то мгновенно, то минутами. Камеру запрашиваем сразу, параллельно с загрузкой модели.
const camera = navigator.mediaDevices.getUserMedia({
  video: { width: 1280, height: 720, facingMode: "user" },
  audio: false,
});
camera.catch(() => {});                                // ошибку покажем ниже, когда дойдём до await

// Модель качаем сами — так виден прогресс, и при откате GPU → CPU она не скачивается второй раз
async function fetchWithProgress(url, label) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${label}: HTTP ${res.status}`);
  const total = +res.headers.get("content-length") || 0;
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    got += value.length;
    status.textContent = total ? `${label} · ${Math.round(got / total * 100)}%` : `${label} · ${(got / 1e6).toFixed(1)} МБ`;
  }
  const buf = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  return buf;
}

status.textContent = "загрузка движка…";
const [vision, model] = await Promise.all([
  FilesetResolver.forVisionTasks(new URL("mp/wasm", location.href).href),
  fetchWithProgress("mp/hand_landmarker.task", "загрузка модели"),
]);
status.textContent = "запуск модели…";
const make = delegate => HandLandmarker.createFromOptions(vision, {
  baseOptions: { modelAssetBuffer: model, delegate },
  runningMode: "VIDEO",
  numHands: 2,
});
// На некоторых телефонах (iOS Safari) GPU-делегат не стартует — падаем на CPU
let landmarker;
try { landmarker = await make("GPU"); } catch {
  status.textContent = "запуск модели (без видеокарты)…";
  landmarker = await make("CPU");
}

status.textContent = "жду разрешения на камеру…";
video.srcObject = await camera;
await video.play();
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;
loader.classList.add("hidden");

// Угол в суставе b между отрезками a→b и b→c (0° = прямо)
function jointAngle(a, b, c) {
  const u = [b.x - a.x, b.y - a.y, b.z - a.z];
  const v = [c.x - b.x, c.y - b.y, c.z - b.z];
  const cos = (u[0] * v[0] + u[1] * v[1] + u[2] * v[2]) / (Math.hypot(...u) * Math.hypot(...v));
  return Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
}

// Сгиб пальца = сумма углов трёх суставов (от запястья до кончика), в 3D-координатах руки
function bendAngle(wl, f) {
  const chain = [0, ...f.ids];
  let sum = 0;
  for (let k = 1; k < 4; k++) sum += jointAngle(wl[chain[k - 1]], wl[chain[k]], wl[chain[k + 1]]);
  return sum;
}

// Цвет по силе сгиба: ниже порога — белый, дальше от зелёного к красному
function bendColor(delta) {
  if (delta < THRESHOLD) return "rgba(255,255,255,.8)";
  const t = Math.min(1, (delta - THRESHOLD) / (FULL_BEND - THRESHOLD));
  return `hsl(${120 * (1 - t)}, 100%, 50%)`;
}

// Начальное положение для цвета пальцев: снимается автоматически, когда рука успокоилась после
// появления в кадре, кнопкой «калибровка» — заново. На распознавание загибов не влияет.
const baseline = {}; // side -> [5 углов]

// Состояние распознавания на руку: side -> { smooth, since, lastSeen, bent[5], ext[5], firedAt[5] }
// ext — последний минимум угла (палец прямой) или пик (палец согнут), от него меряются RISE/DROP.
const hands = {};
let activeSide = null;       // засчитываем загибы только одной руки — той, что первой появилась в кадре
let lastFireAt = -Infinity;  // для CROSS_MS

const zeroBtn = document.getElementById("zero");
zeroBtn.onclick = () => {
  for (const side in hands) baseline[side] = hands[side].smooth.slice();
  zeroBtn.textContent = "откалибровано ✓";
  zeroBtn.classList.add("flash");
  setTimeout(() => { zeroBtn.textContent = "калибровка"; zeroBtn.classList.remove("flash"); }, 1200);
};
document.getElementById("anglesBtn").onclick = () => { info.hidden = !info.hidden; };

// «Рука не видна» — только после короткой паузы, чтобы не мигало на единичных потерянных кадрах
const handHint = document.getElementById("handHint");
let lastHandAt = performance.now();

let lastTime = -1, fps = 0, lastFrame = performance.now();

// Обновляет распознавание одной руки; возвращает кандидатов на «загиб засчитан» в этом кадре
function trackBends(st, dt, now) {
  const warm = now - st.since < WARMUP_MS;
  const found = [];
  st.smooth.forEach((v, i) => {
    if (warm) { st.ext[i] = v; st.bent[i] = false; return; }
    const leak = EXT_LEAK * dt / 1000;
    if (!st.bent[i]) {
      st.ext[i] = Math.min(v, st.ext[i] + leak);       // минимум медленно подтягивается за дрейфом позы
      if (v - st.ext[i] >= RISE[i]) {
        found.push({ i, rise: v - st.ext[i] });
        st.bent[i] = true;
        st.ext[i] = v;
      }
    } else {
      st.ext[i] = Math.max(v, st.ext[i] - leak);
      if (st.ext[i] - v >= DROP[i]) { st.bent[i] = false; st.ext[i] = v; }
    }
  });
  return found;
}

function loop() {
  if (video.currentTime !== lastTime) {
    lastTime = video.currentTime;
    const now = performance.now();
    const dt = Math.min(100, now - lastFrame);
    const res = landmarker.detectForVideo(video, now);
    fps = fps * 0.9 + (1000 / (now - lastFrame)) * 0.1;
    lastFrame = now;

    const W = canvas.width, H = canvas.height;
    // Зеркальное видео, координаты точек зеркалим вручную, чтобы текст не переворачивался
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, W, H);
    ctx.restore();
    const px = p => [(1 - p.x) * W, p.y * H];
    const line = (a, b) => { ctx.beginPath(); ctx.moveTo(...px(a)); ctx.lineTo(...px(b)); ctx.stroke(); };

    let text = `fps ${fps.toFixed(0)}  рук: ${res.landmarks.length}  режим: ${gameState}\n`;

    if (activeSide && !(hands[activeSide] && now - hands[activeSide].lastSeen < ACTIVE_LOST_MS)) activeSide = null;

    // MediaPipe изредка называет обе руки в кадре одной стороной — тогда их углы смешались бы
    // в одном состоянии. Из двух рук «одной стороны» берём ту, в которой модель увереннее.
    const sideOf = h => res.handedness[h][0].categoryName === "Left" ? "правая" : "левая";
    const bestOf = {};
    res.landmarks.forEach((_, h) => {
      const s = sideOf(h);
      if (bestOf[s] === undefined || res.handedness[h][0].score > res.handedness[bestOf[s]][0].score) bestOf[s] = h;
    });

    res.landmarks.forEach((lm, h) => {
      const side = sideOf(h);
      if (bestOf[side] !== h) return;
      const wl = res.worldLandmarks[h];
      const raw = FINGERS.map(f => bendAngle(wl, f));

      // Рука только появилась (или вернулась) — состояние с нуля и разогрев без засчитывания
      let st = hands[side];
      if (!st || now - st.lastSeen > LOST_MS) {
        st = hands[side] = { smooth: raw, since: now, lastSeen: now, bent: raw.map(() => false), ext: raw.slice(), firedAt: raw.map(() => -Infinity) };
      } else {
        st.smooth = st.smooth.map((v, i) => v * 0.5 + raw[i] * 0.5);
        st.lastSeen = now;
      }
      activeSide ??= side;
      if (!baseline[side] && now - st.since >= WARMUP_MS) baseline[side] = st.smooth.slice();
      const deltas = st.smooth.map((v, i) => baseline[side] ? v - baseline[side][i] : 0);

      // Из пальцев, засчитанных в одном кадре, берём один — с самым резким подъёмом
      const found = trackBends(st, dt, now).filter(c => FINGERS[c.i].role);
      if (found.length && side === activeSide && gameState === "recording" && now - lastFireAt >= CROSS_MS) {
        const best = found.reduce((a, b) => b.rise > a.rise ? b : a);
        if (now - st.firedAt[best.i] >= BEND_DEAD_MS) {
          st.firedAt[best.i] = lastFireAt = now;
          onFingerBend(FINGERS[best.i].role);
        }
      }

      ctx.lineCap = "round";
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(255,255,255,.5)";
      for (const [a, b] of PALM) line(lm[a], lm[b]);

      // Согнутый (по мнению распознавания) палец — толще: видно, что именно засчитает игра
      FINGERS.forEach((f, i) => {
        ctx.lineWidth = st.bent[i] ? 12 : 8;
        ctx.strokeStyle = bendColor(deltas[i]);
        for (let k = 1; k < 4; k++) line(lm[f.ids[k - 1]], lm[f.ids[k]]);
      });

      ctx.fillStyle = "#fff";
      for (const p of lm) { ctx.beginPath(); ctx.arc(...px(p), 4, 0, Math.PI * 2); ctx.fill(); }

      // Вспышка на кончике засчитанного пальца
      FINGERS.forEach((f, i) => {
        const age = now - st.firedAt[i];
        if (age > 400) return;
        ctx.strokeStyle = `rgba(60,207,110,${1 - age / 400})`;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(...px(lm[f.ids[3]]), 14 + age / 20, 0, Math.PI * 2); ctx.stroke();
      });

      text += `\n${side}${side === activeSide ? " (считается)" : ""}:   угол    Δ   от ext\n`;
      FINGERS.forEach((f, i) => {
        text += `  ${f.name.padEnd(9)} ${st.bent[i] ? "●" : "·"}${st.smooth[i].toFixed(0).padStart(4)}° ${deltas[i].toFixed(0).padStart(4)}° ${(st.smooth[i] - st.ext[i]).toFixed(0).padStart(4)}°\n`;
      });
    });

    if (res.landmarks.length) lastHandAt = now;
    handHint.classList.toggle("hidden", now - lastHandAt < 800);
    if (!info.hidden) info.textContent = text;
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
