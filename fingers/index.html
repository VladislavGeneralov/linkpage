<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Track</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 14px monospace; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  video { display: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #info { position: absolute; top: 8px; left: 8px; white-space: pre; background: rgba(0,0,0,.6); padding: 6px 8px; }
  #zero { position: absolute; right: 8px; bottom: 8px; font: 16px monospace; padding: 12px 18px; }
  #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  #loader.hidden { display: none; }
  .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 600px) { #info { font-size: 10px; } }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="info"></div>
  <div id="loader"><div class="spinner"></div><div id="status">загрузка модели…</div></div>
  <button id="zero">ноль</button>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const loader = document.getElementById("loader");
const status = document.getElementById("status");

// Индексы точек MediaPipe: 0 = запястье, дальше по 4 на палец (основание → кончик)
const FINGERS = [
  { name: "большой",   ids: [1, 2, 3, 4] },
  { name: "указат.",   ids: [5, 6, 7, 8] },
  { name: "средний",   ids: [9, 10, 11, 12] },
  { name: "безымян.",  ids: [13, 14, 15, 16] },
  { name: "мизинец",   ids: [17, 18, 19, 20] },
];
const PALM = [[0, 1], [0, 5], [5, 9], [9, 13], [13, 17], [0, 17]];

const THRESHOLD = 10; // градусов от начального положения — с этого палец считается согнутым
const FULL_BEND = 150; // градусов от начального положения — полный красный

const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
);
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const make = delegate => HandLandmarker.createFromOptions(vision, {
  baseOptions: { modelAssetPath: MODEL, delegate },
  runningMode: "VIDEO",
  numHands: 2,
});
// На некоторых телефонах (iOS Safari) GPU-делегат не стартует — падаем на CPU
let landmarker;
try { landmarker = await make("GPU"); } catch { landmarker = await make("CPU"); }

status.textContent = "запрос камеры…";
video.srcObject = await navigator.mediaDevices.getUserMedia({
  video: { width: 1280, height: 720, facingMode: "user" },
  audio: false,
});
await video.play();
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;
loader.classList.add("hidden");

// Угол в суставе b между отрезками a→b и b→c (0° = прямо)
function jointAngle(a, b, c) {
  const u = [b.x - a.x, b.y - a.y, b.z - a.z];
  const v = [c.x - b.x, c.y - b.y, c.z - b.z];
  const cos = (u[0] * v[0] + u[1] * v[1] + u[2] * v[2]) / (Math.hypot(...u) * Math.hypot(...v));
  return Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
}

// Сгиб пальца = сумма углов трёх суставов (от запястья до кончика), в 3D-координатах руки
function bendAngle(wl, f) {
  const chain = [0, ...f.ids];
  let sum = 0;
  for (let k = 1; k < 4; k++) sum += jointAngle(wl[chain[k - 1]], wl[chain[k]], wl[chain[k + 1]]);
  return sum;
}

// Цвет по силе сгиба: ниже порога — белый, дальше от зелёного к красному
function bendColor(delta) {
  if (delta < THRESHOLD) return "rgba(255,255,255,.8)";
  const t = Math.min(1, (delta - THRESHOLD) / (FULL_BEND - THRESHOLD));
  return `hsl(${120 * (1 - t)}, 100%, 50%)`;
}

// Начальное положение: снимается автоматически при первом появлении руки, кнопкой «ноль» — заново
const baseline = {}; // side -> [5 углов]
const smooth = {};   // side -> [5 углов], сглаживание дрожания
document.getElementById("zero").onclick = () => {
  for (const side in smooth) baseline[side] = smooth[side].slice();
};

let lastTime = -1, fps = 0, lastFrame = performance.now();

function loop() {
  if (video.currentTime !== lastTime) {
    lastTime = video.currentTime;
    const now = performance.now();
    const res = landmarker.detectForVideo(video, now);
    fps = fps * 0.9 + (1000 / (now - lastFrame)) * 0.1;
    lastFrame = now;

    const W = canvas.width, H = canvas.height;
    // Зеркальное видео, координаты точек зеркалим вручную, чтобы текст не переворачивался
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, W, H);
    ctx.restore();
    const px = p => [(1 - p.x) * W, p.y * H];
    const line = (a, b) => { ctx.beginPath(); ctx.moveTo(...px(a)); ctx.lineTo(...px(b)); ctx.stroke(); };

    let text = `fps ${fps.toFixed(0)}  рук: ${res.landmarks.length}\n`;

    res.landmarks.forEach((lm, h) => {
      const side = res.handedness[h][0].categoryName === "Left" ? "правая" : "левая";
      const wl = res.worldLandmarks[h];

      const raw = FINGERS.map(f => bendAngle(wl, f));
      smooth[side] = smooth[side] ? smooth[side].map((v, i) => v * 0.6 + raw[i] * 0.4) : raw;
      if (!baseline[side]) baseline[side] = smooth[side].slice();
      const deltas = smooth[side].map((v, i) => v - baseline[side][i]);

      ctx.lineCap = "round";
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(255,255,255,.5)";
      for (const [a, b] of PALM) line(lm[a], lm[b]);

      ctx.lineWidth = 8;
      FINGERS.forEach((f, i) => {
        ctx.strokeStyle = bendColor(deltas[i]);
        for (let k = 1; k < 4; k++) line(lm[f.ids[k - 1]], lm[f.ids[k]]);
      });

      ctx.fillStyle = "#fff";
      for (const p of lm) { ctx.beginPath(); ctx.arc(...px(p), 4, 0, Math.PI * 2); ctx.fill(); }

      text += `\n${side}:          угол    Δ\n`;
      FINGERS.forEach((f, i) => {
        const bent = deltas[i] >= THRESHOLD;
        text += `  ${f.name.padEnd(9)} ${bent ? "●" : "·"} ${smooth[side][i].toFixed(0).padStart(4)}° ${deltas[i].toFixed(0).padStart(4)}°\n`;
      });
    });

    info.textContent = text;
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
