<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Track</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 14px monospace; }
  #wrap { position: relative; width: 100vw; height: 100vh; }
  video { display: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #info { position: absolute; top: 8px; left: 8px; white-space: pre; background: rgba(0,0,0,.6); padding: 6px 8px; font-size: 11px; }
  #zero { position: absolute; right: 8px; bottom: 8px; font: 14px monospace; padding: 10px 14px; }
  #loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  #loader.hidden { display: none; }
  .spinner { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Панель подключения трёх модулей */
  #conn { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; background: rgba(0,0,0,.6); padding: 8px; border-radius: 8px; }
  .role { display: flex; align-items: center; gap: 8px; font: 13px monospace; }
  .role .dot { width: 10px; height: 10px; border-radius: 50%; background: #666; flex: none; }
  .role.ok .dot { background: #3c3; }
  .role.bad .label { color: #f55; }
  .role .label { width: 86px; }
  .role button { font: 12px monospace; padding: 5px 9px; }

  /* Центральная панель: старт / ход игры / результат */
  #panel { position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%); text-align: center; }
  #panel button { font: 18px monospace; padding: 14px 28px; border-radius: 10px; border: none; background: #fff; color: #000; }
  #panel button:disabled { opacity: .35; }
  #progress { font: 20px monospace; background: rgba(0,0,0,.6); padding: 10px 18px; border-radius: 8px; letter-spacing: 2px; }
  #result { background: rgba(0,0,0,.75); padding: 14px 20px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #result .row { display: flex; gap: 10px; font-size: 22px; }
  #result .cell { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #333; }
  #result .cell.hit { background: #2a2; }
  #result .cell.miss { background: #a22; }
  #result .verdict { font-size: 16px; }
  .hint { font-size: 12px; opacity: .7; margin-top: 4px; }

  @media (max-width: 600px) {
    #info { font-size: 9px; }
    .role .label { width: 70px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div id="info"></div>
  <div id="loader"><div class="spinner"></div><div id="status">загрузка модели…</div></div>

  <div id="conn">
    <div class="role" data-role="thumb"><span class="dot"></span><span class="label">большой · F1</span></div>
    <div class="role" data-role="index"><span class="dot"></span><span class="label">указат. · F2</span></div>
    <div class="role" data-role="middle"><span class="dot"></span><span class="label">средний · F3</span></div>
    <button id="connAll">подключить все 3</button>
  </div>

  <div id="panel"></div>
  <button id="zero">ноль</button>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const loader = document.getElementById("loader");
const status = document.getElementById("status");
const panel = document.getElementById("panel");

// Индексы точек MediaPipe: 0 = запястье, дальше по 4 на палец (основание → кончик)
const FINGERS = [
  { name: "большой",   role: "thumb",  ids: [1, 2, 3, 4] },
  { name: "указат.",   role: "index",  ids: [5, 6, 7, 8] },
  { name: "средний",   role: "middle", ids: [9, 10, 11, 12] },
  { name: "безымян.",  role: null,     ids: [13, 14, 15, 16] },
  { name: "мизинец",   role: null,     ids: [17, 18, 19, 20] },
];
const PALM = [[0, 1], [0, 5], [5, 9], [9, 13], [13, 17], [0, 17]];
const ROLES = ["thumb", "index", "middle"];        // участвуют только эти три пальца
const ROLE_LABEL = { thumb: "большой", index: "указательный", middle: "средний" };

const THRESHOLD = 10; // градусов от начального положения — с этого палец начинает краснеть
const FULL_BEND = 150; // градусов от начального положения — полный красный
const BEND_ON = 40;    // загиб засчитывается с этого угла
const BEND_OFF = 20;   // палец снова прямой ниже этого — гистерезис, чтобы не дребезжало
const BEND_DEAD_MS = 700; // мёртвое время: гасит дребезг камеры, не мешает настоящему повтору того же пальца

// ---------------- Bluetooth: три независимых модуля, по одному на палец ----------------
// Каждый модуль (XIAO nRF54L15, прошивка fingers_ble_N) понимает одну команду: записать
// число 1–5 в характеристику — столько коротких импульсов вибрации. Нам нужен один импульс,
// поэтому всегда пишем 1; какой физический модуль надет на какой палец, выбирает человек
// в диалоге выбора Bluetooth-устройства при подключении.
const BT_SERVICE = "6e5f0001-7b3a-4c2d-9e1f-a0b1c2d3e4f5";
const BT_COUNT   = "6e5f0002-7b3a-4c2d-9e1f-a0b1c2d3e4f5";

const sleep = ms => new Promise(r => setTimeout(r, ms));

const conn = {}; // role -> { char, queue }
for (const role of ROLES) conn[role] = { char: null, device: null, queue: Promise.resolve() };

// Модули пронумерованы физически и зашиты в прошивке под постоянными BLE-именами:
// F1 = большой, F2 = указательный, F3 = средний.
const ROLE_DEVICE = { thumb: "F1", index: "F2", middle: "F3" };

function roleEl(role) { return document.querySelector(`.role[data-role="${role}"]`); }

function labelEl(role) { return roleEl(role).querySelector(".label"); }
function setRoleStatus(role, text, bad) {
  const el = roleEl(role);
  labelEl(role).textContent = text;
  el.classList.toggle("bad", !!bad);
}

// Привязывает роль к уже выбранному устройству: GATT-подключение, поиск сервиса/характеристики,
// статус на экране. Общий код для первого ручного выбора и для тихого автоподключения.
async function bindDevice(role, device) {
  const el = roleEl(role);
  const dup = ROLES.find(r => r !== role && conn[r].device && conn[r].device.id === device.id);
  if (dup) {
    setRoleStatus(role, `❌ ${device.name || "устройство"} уже подключён как «${ROLE_LABEL[dup]}»`, true);
    return false;
  }
  if (!device.gattserverdisconnectedBound) {
    device.gattserverdisconnectedBound = true;
    device.addEventListener("gattserverdisconnected", () => {
      conn[role].char = null;
      el.classList.remove("ok");
      setRoleStatus(role, `${ROLE_LABEL[role]} · ${ROLE_DEVICE[role]} (отключён, ищу…)`);
      updateStartEnabled();
      watchForDevice(role, device);               // сам переподключится, когда модуль снова рядом
    });
  }

  // Поиск сервиса/характеристики сразу после GATT-подключения на Windows иногда отваливается
  // с «Unreachable» (видели это на модуле 3 вживую — помогал обычный повтор). Пробуем до 3 раз,
  // не дёргая весь gatt.connect() заново — только то, что реально упало.
  let stage = "подключение";
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const server = await device.gatt.connect();
      stage = "поиск сервиса";
      const service = await server.getPrimaryService(BT_SERVICE);
      stage = "поиск характеристики";
      conn[role].char = await service.getCharacteristic(BT_COUNT);
      conn[role].device = device;
      el.classList.remove("bad");
      el.classList.add("ok");
      setRoleStatus(role, `✓ ${ROLE_LABEL[role]} · ${device.name}`);
      updateStartEnabled();
      return true;
    } catch (e) {
      console.error(role, stage, `попытка ${attempt}`, e);
      if (attempt < 3) {
        setRoleStatus(role, `${ROLE_LABEL[role]} · ${ROLE_DEVICE[role]} (повтор ${attempt}/3…)`);
        // Половинчатое соединение мешает устройству переподключиться само — сбрасываем перед повтором
        try { device.gatt.disconnect(); } catch {}
        await sleep(1500);
      }
    }
  }
  setRoleStatus(role, `${ROLE_LABEL[role]} · ${ROLE_DEVICE[role]} (не подключился, жду появления)`, true);
  try { device.gatt.disconnect(); } catch {}
  updateStartEnabled();
  watchForDevice(role, device);
  return false;
}

// Ждём, пока устройство снова появится в эфире (ушло из радиуса / было выключено), и подключаемся
// сами, без диалога — разрешение на доступ уже получено один раз раньше.
const watching = {}; // role -> true, чтобы не плодить несколько слушателей на одно устройство
async function watchForDevice(role, device) {
  if (watching[role] || !device.watchAdvertisements) return;  // Bluefy и Safari это не умеют — молча пропускаем
  watching[role] = true;
  const onAdv = async () => {
    if (conn[role].char) return;                      // уже подключились другим путём
    device.removeEventListener("advertisementreceived", onAdv);
    watching[role] = false;
    await bindDevice(role, device);
  };
  device.addEventListener("advertisementreceived", onAdv);
  try { await device.watchAdvertisements(); }
  catch (e) { console.error("слежение", role, e); watching[role] = false; }
}

// Диалог выбора нужен только один раз: дальше браузер помнит разрешённые устройства
// (navigator.bluetooth.getDevices), и страница подключается к ним сама при каждой загрузке.
async function autoConnectGranted() {
  if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return;   // Safari/старый браузер — только ручная кнопка
  const granted = await navigator.bluetooth.getDevices();
  for (const role of ROLES) {
    if (conn[role].char) continue;
    const device = granted.find(d => d.name === ROLE_DEVICE[role]);
    if (!device) continue;                              // этот модуль ещё ни разу не подключали вручную
    setRoleStatus(role, `${ROLE_LABEL[role]} · ${ROLE_DEVICE[role]} (подключаюсь…)`);
    bindDevice(role, device);
  }
}

function allConnected() { return ROLES.every(r => conn[r].char); }

// Для ролей, которых нет среди уже разрешённых устройств (первый раз на этом браузере),
// нужен один обычный диалог выбора — дальше за них отвечает autoConnectGranted/watchForDevice.
async function connectRole(role) {
  try {
    const device = await navigator.bluetooth.requestDevice({ filters: [{ name: ROLE_DEVICE[role] }] });
    return await bindDevice(role, device);
  } catch (e) {
    console.error(role, "выбор устройства", e);
    setRoleStatus(role, `❌ ошибка выбора: ${e.message || e}`, true);
    updateStartEnabled();
    return false;
  }
}

// Диалог не считается завершённым, пока не подключены все 3: уже подключённые роли на повторном
// клике не переспрашиваются, а кнопка явно показывает, чего не хватает.
const connAllBtn = document.getElementById("connAll");
connAllBtn.onclick = async () => {
  if (!navigator.bluetooth) {
    connAllBtn.textContent = "нет Web Bluetooth (нужен Chrome / Edge / Bluefy)";
    return;
  }
  connAllBtn.disabled = true;
  for (const role of ROLES) {
    if (conn[role].char) continue;
    connAllBtn.textContent = `выбери ${ROLE_DEVICE[role]}…`;
    const ok = await connectRole(role);
    // Один клик = одно разрешение браузера показать диалог выбора устройства. Если эта попытка
    // не удалась (отменил, не нашёл), у СЛЕДУЮЩЕГО requestDevice() в этом же клике разрешения уже
    // нет — браузер откажет с «Must be handling a user gesture» для всех оставшихся ролей подряд.
    // Поэтому останавливаемся сразу, а не долбим дальше: следующий клик даст новое разрешение.
    if (!ok) break;
  }
  if (allConnected()) {
    connAllBtn.textContent = "подключено ✓";
    connAllBtn.disabled = true;
  } else {
    const missing = ROLES.filter(r => !conn[r].char).map(r => ROLE_DEVICE[r]).join(", ");
    connAllBtn.textContent = `не хватает: ${missing} — нажми ещё раз`;
    connAllBtn.disabled = false;
  }
};

autoConnectGranted();

// Один импульс на конкретном пальце. Записи по одной: параллельная запись в GATT падает с ошибкой.
function buzz(role) {
  const c = conn[role];
  if (!c.char) return Promise.resolve();
  c.queue = c.queue
    .then(() => c.char && (c.char.writeValueWithoutResponse
      ? c.char.writeValueWithoutResponse(Uint8Array.of(1))
      : c.char.writeValue(Uint8Array.of(1))))
    .catch(e => console.error("отправка", role, e));
  return c.queue;
}

// ---------------- Игра: старт → секвенция играется на моторах → повтор в камеру → результат ----------------
const STEP_GAP = 650;      // мс между вибро-импульсами при воспроизведении секвенции
const SEQ_MIN = 3, SEQ_MAX = 5;

let gameState = "idle";   // idle | playing | recording | result
let sequence = [];        // секвенция для этого раунда, напр. ["thumb","index","thumb","middle"]
let attempt = [];         // что реально распознано в камере

function randomSequence() {
  // Повтор одного пальца подряд допустим по заданию — отличать такие шаги
  // помогает BEND_DEAD_MS (не форма секвенции).
  const len = SEQ_MIN + Math.floor(Math.random() * (SEQ_MAX - SEQ_MIN + 1));
  const seq = [];
  for (let i = 0; i < len; i++) seq.push(ROLES[Math.floor(Math.random() * ROLES.length)]);
  return seq;
}

async function playSequence(seq) {
  for (const role of seq) {
    await buzz(role);
    await sleep(STEP_GAP);
  }
}

function updateStartEnabled() {
  if (gameState === "idle") renderPanel();
}

async function startRound() {
  sequence = randomSequence();
  attempt = [];
  gameState = "playing";
  renderPanel();
  await playSequence(sequence);
  gameState = "recording";
  renderPanel();
}

function onFingerBend(role) {
  if (gameState !== "recording") return;
  attempt.push(role);
  if (attempt.length >= sequence.length) {
    gameState = "result";
  }
  renderPanel();
}

function renderPanel() {
  if (gameState === "idle") {
    panel.innerHTML = "";
    const btn = document.createElement("button");
    btn.textContent = "старт";
    btn.disabled = !allConnected();
    btn.onclick = startRound;
    panel.appendChild(btn);
    if (!allConnected()) {
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "подключите все 3 модуля справа";
      panel.appendChild(hint);
    }
  } else if (gameState === "playing") {
    panel.innerHTML = `<div id="progress">запоминайте…</div>`;
  } else if (gameState === "recording") {
    panel.innerHTML = `<div id="progress">повторите · шаг ${attempt.length + 1} из ${sequence.length}</div>`;
  } else if (gameState === "result") {
    const rows = sequence.map((want, i) => {
      const got = attempt[i];
      const hit = got === want;
      return `<div class="cell ${hit ? "hit" : "miss"}">${ROLE_LABEL[want][0].toUpperCase()}</div>`;
    }).join("");
    const correct = sequence.filter((w, i) => attempt[i] === w).length;
    const verdict = correct === sequence.length ? "точно повторено ✓" : `совпало ${correct} из ${sequence.length}`;
    panel.innerHTML = `
      <div id="result">
        <div class="row">${rows}</div>
        <div class="verdict">${verdict}</div>
        <button id="again">ещё раз</button>
      </div>`;
    document.getElementById("again").onclick = () => { gameState = "idle"; renderPanel(); };
  }
}
renderPanel();

// ---------------- Камера и трекинг руки ----------------
const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
);
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const make = delegate => HandLandmarker.createFromOptions(vision, {
  baseOptions: { modelAssetPath: MODEL, delegate },
  runningMode: "VIDEO",
  numHands: 2,
});
// На некоторых телефонах (iOS Safari) GPU-делегат не стартует — падаем на CPU
let landmarker;
try { landmarker = await make("GPU"); } catch { landmarker = await make("CPU"); }

status.textContent = "запрос камеры…";
video.srcObject = await navigator.mediaDevices.getUserMedia({
  video: { width: 1280, height: 720, facingMode: "user" },
  audio: false,
});
await video.play();
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;
loader.classList.add("hidden");

// Угол в суставе b между отрезками a→b и b→c (0° = прямо)
function jointAngle(a, b, c) {
  const u = [b.x - a.x, b.y - a.y, b.z - a.z];
  const v = [c.x - b.x, c.y - b.y, c.z - b.z];
  const cos = (u[0] * v[0] + u[1] * v[1] + u[2] * v[2]) / (Math.hypot(...u) * Math.hypot(...v));
  return Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
}

// Сгиб пальца = сумма углов трёх суставов (от запястья до кончика), в 3D-координатах руки
function bendAngle(wl, f) {
  const chain = [0, ...f.ids];
  let sum = 0;
  for (let k = 1; k < 4; k++) sum += jointAngle(wl[chain[k - 1]], wl[chain[k]], wl[chain[k + 1]]);
  return sum;
}

// Цвет по силе сгиба: ниже порога — белый, дальше от зелёного к красному
function bendColor(delta) {
  if (delta < THRESHOLD) return "rgba(255,255,255,.8)";
  const t = Math.min(1, (delta - THRESHOLD) / (FULL_BEND - THRESHOLD));
  return `hsl(${120 * (1 - t)}, 100%, 50%)`;
}

// Начальное положение: снимается автоматически при первом появлении руки, кнопкой «ноль» — заново
const baseline = {}; // side -> [5 углов]
const smooth = {};   // side -> [5 углов], сглаживание дрожания
const bent = {};     // side -> [5 bool], состояние загиба с гистерезисом
const lastBendAt = {}; // side -> [5 timestamp], для мёртвого времени BEND_DEAD_MS
document.getElementById("zero").onclick = () => {
  for (const side in smooth) baseline[side] = smooth[side].slice();
};

let lastTime = -1, fps = 0, lastFrame = performance.now();

function loop() {
  if (video.currentTime !== lastTime) {
    lastTime = video.currentTime;
    const now = performance.now();
    const res = landmarker.detectForVideo(video, now);
    fps = fps * 0.9 + (1000 / (now - lastFrame)) * 0.1;
    lastFrame = now;

    const W = canvas.width, H = canvas.height;
    // Зеркальное видео, координаты точек зеркалим вручную, чтобы текст не переворачивался
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, W, H);
    ctx.restore();
    const px = p => [(1 - p.x) * W, p.y * H];
    const line = (a, b) => { ctx.beginPath(); ctx.moveTo(...px(a)); ctx.lineTo(...px(b)); ctx.stroke(); };

    let text = `fps ${fps.toFixed(0)}  рук: ${res.landmarks.length}  режим: ${gameState}\n`;

    res.landmarks.forEach((lm, h) => {
      const side = res.handedness[h][0].categoryName === "Left" ? "правая" : "левая";
      const wl = res.worldLandmarks[h];

      const raw = FINGERS.map(f => bendAngle(wl, f));
      smooth[side] = smooth[side] ? smooth[side].map((v, i) => v * 0.6 + raw[i] * 0.4) : raw;
      if (!baseline[side]) baseline[side] = smooth[side].slice();
      const deltas = smooth[side].map((v, i) => v - baseline[side][i]);

      // Момент загиба (прямой → согнутый): во время записи — шаг попытки; участвуют только 3 пальца
      bent[side] ??= [false, false, false, false, false];
      lastBendAt[side] ??= [-Infinity, -Infinity, -Infinity, -Infinity, -Infinity];
      deltas.forEach((d, i) => {
        if (!bent[side][i] && d >= BEND_ON) {
          bent[side][i] = true;
          // мёртвое время именно для этого пальца: дрожание камеры даёт короткие ложные повторы
          if (now - lastBendAt[side][i] >= BEND_DEAD_MS) {
            lastBendAt[side][i] = now;
            if (FINGERS[i].role) onFingerBend(FINGERS[i].role);
          }
        } else if (bent[side][i] && d < BEND_OFF) {
          bent[side][i] = false;
        }
      });

      ctx.lineCap = "round";
      ctx.lineWidth = 4;
      ctx.strokeStyle = "rgba(255,255,255,.5)";
      for (const [a, b] of PALM) line(lm[a], lm[b]);

      ctx.lineWidth = 8;
      FINGERS.forEach((f, i) => {
        ctx.strokeStyle = bendColor(deltas[i]);
        for (let k = 1; k < 4; k++) line(lm[f.ids[k - 1]], lm[f.ids[k]]);
      });

      ctx.fillStyle = "#fff";
      for (const p of lm) { ctx.beginPath(); ctx.arc(...px(p), 4, 0, Math.PI * 2); ctx.fill(); }

      text += `\n${side}:          угол    Δ\n`;
      FINGERS.forEach((f, i) => {
        text += `  ${f.name.padEnd(9)} ${bent[side][i] ? "●" : "·"}${smooth[side][i].toFixed(0).padStart(4)}° ${deltas[i].toFixed(0).padStart(4)}°\n`;
      });
    });

    info.textContent = text;
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
