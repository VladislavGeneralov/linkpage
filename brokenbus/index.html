<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pixel Bus</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #game, #flare {
    position: absolute; inset: 0; margin: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #flare { pointer-events: none; }
  /* обычный режим: контраст и насыщенность итогового кадра; в режиме Y (синька) — без фильтра */
  :root { --contrast: 1.1; --saturate: 1.2; }
  #view { position: fixed; inset: 0; filter: contrast(var(--contrast)) saturate(var(--saturate)); }
  #view.xray { filter: none; }
</style>
</head>
<body>
<div id="view">
  <canvas id="game"></canvas>
  <canvas id="flare"></canvas>
</div>
<audio id="music" src="track.mp3" loop preload="auto"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="track_data.js"></script>
<script>
// ---------- Настройки ----------
// 4:5 как афиша BROKEN17 (3548×4435). Высота прежняя (270) — пиксель того же размера, на 1080p ровно ×4.
// Для 16:9 было 480×270 и CAM_FOV 55.
// телефон: вертикальный кадр под пропорции экрана; высота 320 пикселей игры, ширина — по экрану
const RES_H = 320;
const RES_W = Math.max(140, Math.min(320, Math.round(RES_H * innerWidth / innerHeight)));
const CAM_FOV = 60;                      // вертикальный угол обзора (чуть шире, чтобы по бокам меньше обрезалось)
const ROAD_WIDTH = 10;                   // асфальт
const SHOULDER = 2.5;                    // обочина с каждой стороны
const MAX_SPEED = 36, MAX_REVERSE = 8;   // м/с (~130 км/ч)
const ACCEL = 5.5, BRAKE = 14, DRAG = 2;
const GAS_PRESS = 0.9, BRAKE_PRESS = 1.8; // 1/с — как быстро педаль доходит до пола
const GAS_RELEASE = 3;                    // 1/с — как быстро педаль отпускается
const HAND_DRAG = 0.8;                    // м/с² — ручник почти не тормозит, зато оставляет следы
// руль тугой, как у настоящего автобуса: колёса поворачиваются с ограниченной скоростью,
// а сам кузов набирает скорость поворота с инерцией
const MAX_STEER = 0.5, WHEELBASE = 5.7;
const STEER_RATE = 0.28;                 // рад/с — как быстро крутятся колёса под рукой
const STEER_RETURN = 0.4;                // рад/с — самовозврат руля, когда отпустил
const YAW_LAG = 0.45;                    // с — инерция кузова по курсу

// качание под музыку (данные из analyze_track.py -> track_data.js)
const AUDIO_LOOKAHEAD = 0.1;             // с — упреждение: задержка звука + кадры отрисовки
const SWAY_ROLL = 0.035;                 // рад — крен влево-вправо на долях
const KICK_HOP = 0.2;                    // м — подпрыгивание кузова на бочке
const BASS_LIFT = 0.05;                  // м — лёгкий подъём от общего баса

// ---------- Рендер ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);     // прозрачная очистка — нужна слою "чётких" объектов

// ---------- Вывод кадра: пиксельный мир + (по выбору) чёткие объекты режима Y + фишай ----------
// Холст — в полном экранном разрешении. Мир рисуется в маленький кадр (2× от RES для фишая),
// а итоговый шейдер берёт его по пиксельной сетке RES_W×RES_H — ступеньки пикселей сохраняются.
// То, что обнажает режим Y, живёт в слое 1: либо дорисовывается в тот же пиксельный кадр,
// либо (галочка "чёткие") рисуется отдельно в полном разрешении с перекрытием сценой.
// Фишай — бочка: углы кадра на месте, центр раздувается; к обоим слоям одинаково.
const FISHEYE = 0.19;                    // сила бочки: 0 — выкл, 0.3 — заметно, 0.6 — сильно
const REVEAL_LAYER = 1;
const XRAY_PIXEL_DIV = 4;                // во сколько раз мельче пиксель мира в режимах Y/U
const lowRT = new THREE.WebGLRenderTarget(RES_W * 2, RES_H * 2,
  { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
const hiRT = new THREE.WebGLRenderTarget(RES_W, RES_H,
  { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
const FISH_ASPECT = RES_W / RES_H;
const outScene = new THREE.Scene(), outCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const outMat = new THREE.ShaderMaterial({
  uniforms: {
    tLow: { value: lowRT.texture }, tHi: { value: hiRT.texture }, useHi: { value: 0 },
    k: { value: FISHEYE }, aspect: { value: FISH_ASPECT }, res: { value: new THREE.Vector2(RES_W, RES_H) },
    hiTexel: { value: new THREE.Vector2(1, 1) }, glowAmount: { value: 0.6 },
  },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tLow, tHi; uniform float useHi, k, aspect, glowAmount;
    uniform vec2 res, hiTexel; varying vec2 vUv;
    vec2 fish(vec2 uv) {
      vec2 p = (uv - 0.5) * vec2(aspect, 1.0);
      float r2 = dot(p, p) / (0.25 * (aspect * aspect + 1.0));   // 1 — в углу кадра
      vec2 q = p * (1.0 + k * (r2 - 1.0));                      // бочка: угол на месте, центр крупнее
      return q / vec2(aspect, 1.0) + 0.5;
    }
    void main() {
      vec2 uvq = (floor(vUv * res) + 0.5) / res;                // пиксельная сетка мира
      vec3 c = texture2D(tLow, fish(uvq)).rgb;
      // чёткий слой очищен прозрачным чёрным, поэтому его цвет уже умножен на прозрачность
      if (useHi > 0.5) {
        vec2 u = fish(vUv);
        vec4 h = texture2D(tHi, u);
        // свечение: средняя непрозрачность слоя на двух кольцах вокруг (3 и 6 px)
        vec3 g = vec3(0.0);                                        // свечение — цвета самой структуры
        for (int i = 0; i < 8; i++) {
          float an = float(i) * 0.785398;
          vec2 d = vec2(cos(an), sin(an)) * hiTexel;
          g += texture2D(tHi, u + d * 3.0).rgb + 0.6 * texture2D(tHi, u + d * 6.0).rgb;
        }
        g /= 12.8;
        c += g * glowAmount * (1.0 - h.a);
        c = c * (1.0 - h.a) + h.rgb;
      }
      gl_FragColor = vec4(c, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});
outScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), outMat));

// ---------- Режим U: Y + ложные цвета по плотности ----------
// Готовый кадр Y рисуется в compRT, затем шейдер перекрашивает нереальное (жилы, лианы, ток) как научный
// снимок в ложных цветах: цвет задаёт не объект, а маска нереального (слой hiRT) и её плотность вокруг.
// Солнце — исключение, у него тоже двойной контур. Реальные объекты (ЛЭП, заборы, автобус) остаются
// как в Y и получают только одинарный тонкий (1 px) янтарный контур.
// Одиночные линии — бледные, близкие к фону, с тонким ободком дополнительного (янтарного) цвета там,
// где линия уходит в фон; густые места и пересечения "вскипают" ступенями от светлого к тёмному,
// вокруг них — неровный ступенчатый ореол. Переходы жёсткие (постеризация), без мягких градиентов.
const compRT = new THREE.WebGLRenderTarget(RES_W, RES_H,
  { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
// маска каркаса автобуса: отдельный класс для "слива на сливу" (чтобы автобус не пересекался сам с собой)
const busIdRT = new THREE.WebGLRenderTarget(RES_W, RES_H,
  { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
// маска: красный канал — каркас автобуса, зелёный — пассажир; без глубины и со сложением,
// чтобы в месте наложения были оба (для "пересечения разных групп")
const BUS_ID_MAT = new THREE.MeshBasicMaterial({ color: 0xff0000, blending: THREE.AdditiveBlending, depthTest: false, transparent: true });
const PAX_ID_MAT = new THREE.MeshBasicMaterial({ color: 0x00ff00, blending: THREE.AdditiveBlending, depthTest: false, transparent: true });
// маска прочего нереального без автобуса (автобус не закрывает жилы за ним — видно пересечения)
const othersRT = new THREE.WebGLRenderTarget(RES_W, RES_H,
  { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
const uScene = new THREE.Scene();
const uMat = new THREE.ShaderMaterial({
  uniforms: {
    tComp: { value: compRT.texture }, tHi: { value: hiRT.texture }, texel: { value: new THREE.Vector2(1, 1) },
    bg: { value: new THREE.Color(0x0a50ff) },          // синий фон режима Y
    k: { value: FISHEYE }, aspect: { value: FISH_ASPECT },
    sunUV: { value: new THREE.Vector3(0, 0, 0) },      // солнце на экране: центр (uv) и радиус с ореолом
    tBus: { value: busIdRT.texture }, tOthers: { value: othersRT.texture },
    overlapEach: { value: 0.55 }, overlapHeat: { value: 0.857 }, uTime: { value: 0 },   // присутствие каждой группы; суммарная ступень   // "слива на сливу": минимум своей плотности у каждой из двух групп
  },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tComp, tHi, tBus, tOthers; uniform vec2 texel; uniform vec3 bg, sunUV; uniform float k, aspect, overlapEach, overlapHeat, uTime;
    varying vec2 vUv;
    float lineness(vec3 c) { return smoothstep(0.12, 0.85, distance(c, bg)); }   // 0 — фон, 1 — что-то нарисовано
    vec2 fish(vec2 uv) {                                   // тот же фишай, что при сведении кадра
      vec2 p = (uv - 0.5) * vec2(aspect, 1.0);
      float r2 = dot(p, p) / (0.25 * (aspect * aspect + 1.0));
      return p * (1.0 + k * (r2 - 1.0)) / vec2(aspect, 1.0) + 0.5;
    }
    // маска: нереальное (слой hiRT) + исключение — солнце с ореолом, у него маска по цвету кадра
    float sunW(vec2 uv) {
      if (sunUV.z <= 0.0) return 0.0;
      float d = length((uv - sunUV.xy) * vec2(aspect, 1.0)) / sunUV.z;
      return 1.0 - smoothstep(0.9, 1.0, d);
    }
    float unreal(vec2 uv) {
      float m = texture2D(tHi, fish(uv)).a;
      float sw = sunW(uv);
      return sw > 0.0 ? max(m, sw * lineness(texture2D(tComp, uv).rgb)) : m;
    }
    // реальный объект: что-то нарисовано, но это не нереальное и не солнце
    bool isReal(vec2 uv) {
      return lineness(texture2D(tComp, uv).rgb) > 0.35 && texture2D(tHi, fish(uv)).a < 0.1 && sunW(uv) <= 0.0;
    }
    bool outlined(vec2 uv) { return isReal(uv); }                 // кого обводим тонкой линией
    // группы: x — каркас автобуса, y — прочее нереальное (жилы, лианы, ток, гравий), z — солнце, w — пассажир
    vec4 classes(vec2 uv) {
      vec2 f = fish(uv);
      vec4 id = texture2D(tBus, f);
      float others = texture2D(tOthers, f).a;
      float sw = sunW(uv);
      float sun = sw > 0.0 ? sw * lineness(texture2D(tComp, uv).rgb) : 0.0;
      return vec4(id.r, others, sun, id.g);
    }
    vec4 ringClasses(vec2 uv, float r) {
      vec4 m = vec4(0.0);
      for (int i = 0; i < 8; i++) {
        float a = float(i) * 0.785398 + r * 0.37;
        m += classes(uv + vec2(cos(a), sin(a)) * texel * r);
      }
      return m / 8.0;
    }
    float ringMask(vec2 uv, float r) {
      float m = 0.0;
      for (int i = 0; i < 8; i++) {
        float a = float(i) * 0.785398 + r * 0.37;
        m += unreal(uv + vec2(cos(a), sin(a)) * texel * r);
      }
      return m / 8.0;
    }
    float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    vec3 hotLUT(float v) {                                 // ступени от светлого к тёмному
      float i = floor(clamp(v, 0.0, 0.999) * 7.0);
      if (i < 1.0) return vec3(0.66, 0.78, 1.00);          // бледно-голубой (близко к фону)
      if (i < 2.0) return vec3(0.86, 0.94, 1.00);          // почти белый
      if (i < 3.0) return vec3(1.00, 0.95, 0.63);          // бледно-жёлтый
      if (i < 4.0) return vec3(1.00, 0.75, 0.23);          // янтарный
      if (i < 5.0) return vec3(1.00, 0.42, 0.16);          // оранжево-красный
      if (i < 6.0) return vec3(0.82, 0.13, 0.29);          // малиновый
      return vec3(0.35, 0.04, 0.31);                       // тёмная слива
    }
    void main() {
      vec3 c = texture2D(tComp, vUv).rgb;
      float m = unreal(vUv);
      if (isReal(vUv)) { gl_FragColor = vec4(c, 1.0); return; }        // реальное — как в Y
      // реальным — одинарный тонкий контур: фон, соседний (1 px) с реальным объектом
      if (m < 0.1 && (outlined(vUv + vec2(texel.x, 0.0)) || outlined(vUv - vec2(texel.x, 0.0)) ||
                      outlined(vUv + vec2(0.0, texel.y)) || outlined(vUv - vec2(0.0, texel.y)))) {
        gl_FragColor = vec4(1.00, 0.62, 0.18, 1.0); return;
      }
      float near = ringMask(vUv, 1.5);                     // для ободка
      vec4 dc = ringClasses(vUv, 4.0) * 0.45 + ringClasses(vUv, 9.0) * 0.35 + ringClasses(vUv, 16.0) * 0.2;
      float dens = dc.x + dc.y + dc.z + dc.w;
      float rag = (hash(floor(vUv / texel / 3.0)) - 0.5) * 0.12;   // неровность ореолов
      // слива на сливу: в точке присутствуют две РАЗНЫЕ группы (пиксель на линии группы или её плотность
      // ≥ overlapEach), и вместе они дошли до сливы -> бело-голубой. Внутри одной группы потолок — слива.
      vec4 hc = max(dc * 1.35, classes(vUv));              // присутствие группы: своя линия или своя плотность
      float groups = step(overlapEach, hc.x) + step(overlapEach, hc.y) + step(overlapEach, hc.z) + step(overlapEach, hc.w);
      if (groups >= 2.0 && dens * 1.35 + rag >= overlapHeat) {
        // кислотный бирюзовый градиент: извилистые полосы 5 неоновых оттенков, медленно текут, ступенями
        vec2 q = vUv * vec2(aspect, 1.0);
        float t = fract(q.x * 7.0 + q.y * 4.0 + sin(q.y * 23.0 + uTime * 0.9) * 0.35 + sin(q.x * 17.0 - uTime * 0.7) * 0.25 + uTime * 0.12);
        float b = floor(t * 5.0);
        vec3 acid = b < 1.0 ? vec3(0.25, 0.94, 1.00)       // #3ff0ff бирюзовый
                  : b < 2.0 ? vec3(0.00, 0.78, 1.00)       // #00c8ff голубой
                  : b < 3.0 ? vec3(0.50, 1.00, 0.83)       // #7fffd4 аквамарин
                  : b < 4.0 ? vec3(0.72, 1.00, 1.00)       // #b8ffff почти белый бирюзовый
                  :           vec3(0.16, 0.55, 1.00);      // #2a8cff синий неон
        gl_FragColor = vec4(acid, 1.0);
        return;
      }
      float heat = min(dens * 1.35 + rag, 0.99);             // сам с собой — максимум слива
      vec3 rim = vec3(1.00, 0.62, 0.18);                   // дополнительный к синему — янтарь
      vec3 col;
      if (m > 0.35) {
        // на линии: тонкая — бледная, в тон фону; густая — вскипает по ступеням
        col = heat < 0.28 ? mix(bg, vec3(1.0), 0.55) : hotLUT(heat + m * 0.1);
      } else if (m > 0.08 || near > 0.18) {
        col = heat < 0.28 ? rim : hotLUT(heat);            // край линии: ободок; у густых — ореол
      } else {
        col = heat > 0.22 ? mix(c, hotLUT(heat), 0.85) : c; // фон: ступенчатый ореол у скоплений
      }
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});
uScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), uMat));
const DEPTH_ONLY = new THREE.MeshBasicMaterial({ colorWrite: false });
let xrayMode = null;                     // активный режим обнажения: 'Y' | 'U' | null
const smoothReveal = () => true;         // объекты режима Y всегда чёткие (пиксельный вариант оставлен в коде: false)
let revealHideForDepth = [];             // что не должно перекрывать чёткий слой (корпус-призрак)

// солнце на экране (с учётом фишая) — для двойного контура в режиме U
const _sp = new THREE.Vector3(), _sp2 = new THREE.Vector3(), _camUp = new THREE.Vector3();
function updateSunUV() {
  const out = uMat.uniforms.sunUV.value;
  _sp.copy(sunGroup.position).project(camera);
  if (_sp.z > 1) { out.set(0, 0, 0); return; }                 // позади камеры
  _camUp.set(0, 1, 0).applyQuaternion(camera.quaternion);
  _sp2.copy(sunGroup.position).addScaledVector(_camUp, SUN_R * 3).project(camera);   // край ореола
  const [u1, v1] = fishForward((_sp.x + 1) / 2, (_sp.y + 1) / 2);
  const [u2, v2] = fishForward((_sp2.x + 1) / 2, (_sp2.y + 1) / 2);
  out.set(u1, v1, Math.hypot((u2 - u1) * FISH_ASPECT, v2 - v1));
}
function renderFrame() {
  // 1) мир (слой 0) в пиксельный кадр; в пиксельном стиле туда же — объекты режима Y (слой 1)
  const hiOn = worldXray && smoothReveal();
  // в режимах Y/U мир в 4 раза мельче по пикселю (сетка RES×4), в обычном — RES (кадр рисуется в 2× для фишая)
  const grid = worldXray ? XRAY_PIXEL_DIV : 1, lw = RES_W * Math.max(2, grid), lh = RES_H * Math.max(2, grid);
  if (lowRT.width !== lw || lowRT.height !== lh) lowRT.setSize(lw, lh);
  outMat.uniforms.res.value.set(RES_W * grid, RES_H * grid);
  renderer.setRenderTarget(lowRT);
  camera.layers.set(0);
  renderer.render(scene, camera);
  const bg = scene.background;
  if (worldXray && !hiOn) {
    camera.layers.set(REVEAL_LAYER);
    renderer.autoClear = false;
    scene.background = null;             // цветной фон заставил бы three.js залить кадр и стереть мир
    renderer.render(scene, camera);      // глубина мира сохранилась — перекрытие верное
    scene.background = bg;
    renderer.autoClear = true;
  }
  // 2) чёткий стиль: глубина мира в полном разрешении (без цвета), затем слой 1 поверх
  if (hiOn) {
    renderer.setRenderTarget(hiRT);
    scene.background = null;             // прозрачный слой: без заливки фоном
    scene.overrideMaterial = DEPTH_ONLY;
    const hidden = revealHideForDepth.filter(o => o.visible);
    for (const o of hidden) o.visible = false;
    camera.layers.set(0);
    renderer.render(scene, camera);
    for (const o of hidden) o.visible = true;
    scene.overrideMaterial = null;
    camera.layers.set(REVEAL_LAYER);
    renderer.autoClear = false;
    renderer.render(scene, camera);
    renderer.autoClear = true;
    scene.background = bg;
  }
  camera.layers.set(0);
  // 3) итог на экран с фишаем
  outMat.uniforms.useHi.value = hiOn ? 1 : 0;
  if (xrayMode === 'U') {                    // U: сначала готовый кадр Y, потом ложные цвета по плотности
    updateSunUV();
    renderer.setRenderTarget(busIdRT);         // маска каркаса автобуса (без корпуса-призрака)
    renderer.clear();
    const saved = [], hull = bus.userData.hull, hullVis = hull.visible;
    hull.visible = false;
    const paxGroup = passengerRig && passengerRig.group;
    bus.traverse(o => {
      if (!o.isMesh) return;
      let isPax = false;
      for (let q = o; q; q = q.parent) if (q === paxGroup) { isPax = true; break; }

function fishForward(u, v) {
  if (FISHEYE <= 0) return [u, v];
  const px = (u - 0.5) * FISH_ASPECT, py = v - 0.5, rs = Math.hypot(px, py);
  if (rs < 1e-6) return [u, v];
  const c2 = 0.25 * (FISH_ASPECT * FISH_ASPECT + 1), k = FISHEYE;
  let r = rs;                                        // решаем r * (1 + k (r²/c2 - 1)) = rs
  for (let i = 0; i < 8; i++) {
    const f = r * (1 + k * (r * r / c2 - 1)) - rs, df = 1 + k * (3 * r * r / c2 - 1);
    r -= f / df;
  }
  const s = r / rs;
  return [px * s / FISH_ASPECT + 0.5, py * s + 0.5];
}

    const hf = y / H;
    const skyC = rampColor(SKY_STOPS, hf), shC = rampColor(CLOUD_SHADOW, hf), litC = rampColor(CLOUD_LIT, hf);
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (y >= H) { put(i, below); continue; }
      const u = x / w;
      let du = Math.abs(u - SUN_U); du = Math.min(du, 1 - du);
      const sunF = Math.exp(-((du / 0.12) ** 2));      // близость к солнцу
      const n = fbm(u, vAt(y), 1);
      const thr = 0.5 - 0.06 * hf;
      if (n < thr) {                                  // чистое небо; у краёв облаков — голубые просветы
        put(i, hf < 0.55 && n > thr - 0.04 ? SKY_GAP : skyC);
        continue;
      }
      // подсветка: ниже и ближе к солнцу — ярче; нижний край облака (дальше вниз его нет) — ярче
      const under = fbm(u, vAt(Math.min(H - 1, y + 2)), 1) < n ? 0.3 : 0;
      let L = hf * 1.1 - 0.3 + 0.6 * sunF + (fbm(u, vAt(y), 7) - 0.5) * 1.2 + under;
      L = Math.round(Math.min(1, Math.max(0, L)) * 3) / 3;   // 4 ступени — пиксельная лесенка
      put(i, shC.clone().lerp(litC, L));
    }
  }
  g.putImageData(img, 0, 0);
});

  maxH * (0.35 + 0.3 * Math.sin(a * 3 + seed) + 0.2 * Math.sin(a * 7 + seed * 2) + 0.15 * Math.sin(a * 17 + seed * 3)));
function hillRing(radius, maxH, colTop, colBottom, seed) {

    pos.push(x, -2, z, x, hillHeight(a, maxH, seed), z);

    if (i < N) { const b = i * 2; idx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2); }

  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, fog: false }));

// ---------- Трасса: стадион, длинные прямые перегоны с редкими плавными изгибами ----------
const STRAIGHT = 3500, TURN_R = 840;
// изгибы на каждой прямой: [начало (доля прямой), длина (м), увод вбок (м)]
const BENDS = [[0.1, 300, 10], [0.3, 250, -8], [0.62, 350, 12], [0.85, 250, -9]];
function stadiumAt(s) {
  const h = STRAIGHT / 2, R = TURN_R, arc = Math.PI * R;
  const L = 2 * STRAIGHT + 2 * arc;
  s = ((s % L) + L) % L;
  let x, z, nx, nz;
  if (s < h) { x = R; z = -s; nx = 1; nz = 0; }
  else if ((s -= h) < arc) { const a = s / R; x = R * Math.cos(a); z = -h - R * Math.sin(a); nx = Math.cos(a); nz = -Math.sin(a); }
  else if ((s -= arc) < STRAIGHT) { x = -R; z = -h + s; nx = -1; nz = 0; }
  else if ((s -= STRAIGHT) < arc) { const a = Math.PI + s / R; x = R * Math.cos(a); z = h - R * Math.sin(a); nx = Math.cos(a); nz = -Math.sin(a); }
  else { s -= arc; x = R; z = h - s; nx = 1; nz = 0; }
  return { x, z, nx, nz, L };
}
// плавные изгибы-"горбы" на прямых (на второй прямой — зеркально), остальное — прямо
function bendOffset(s, L) {
  const starts = [-STRAIGHT / 2, STRAIGHT / 2 + Math.PI * TURN_R];   // начала прямых по s
  for (let k = 0; k < starts.length; k++) {
    const m = (((s - starts[k]) % L) + L) % L;       // метры от начала прямой
    if (m >= STRAIGHT) continue;
    let off = 0;
    for (const [at, len, a] of BENDS) {
      const w = (m - at * STRAIGHT) / len;
      if (w > 0 && w < 1) off += (k ? -a : a) * (1 - Math.cos(2 * Math.PI * w)) / 2;
    }
    return off;
  }
  return 0;
}
function trackPoints() {
  const L = stadiumAt(0).L, pts = [];
  for (let s = 0; s < L; s += 8) {
    const p = stadiumAt(s), off = bendOffset(s, L);
    pts.push(new THREE.Vector3(p.x + p.nx * off, 0, p.z + p.nz * off));
  }
  return pts;
}
const curve = new THREE.CatmullRomCurve3(trackPoints(), true, 'centripetal');
const TRACK_LEN = curve.getLength();
const SEG = 3000;

// кадры вдоль трассы: точка + единичный вектор "вправо"
const frames = [];
for (let i = 0; i <= SEG; i++) {
  const t = i / SEG, p = curve.getPointAt(t), tan = curve.getTangentAt(t);
  frames.push({ p, side: new THREE.Vector3(-tan.z, 0, tan.x).normalize(), dist: t * TRACK_LEN });
}

// горизонтальная лента между смещениями offL..offR
function ribbon(offL, offR, y, material, vLen) {
  const pos = [], uv = [], idx = [];
  frames.forEach(({ p, side, dist }, i) => {
    pos.push(p.x + side.x * offL, y, p.z + side.z * offL, p.x + side.x * offR, y, p.z + side.z * offR);
    uv.push(0, dist / vLen, 1, dist / vLen);
    if (i < SEG) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  });
  return meshFrom(pos, uv, idx, material);
}
// вертикальная лента (отбойник) на смещении off
function wall(off, y0, y1, material) {
  const pos = [], uv = [], idx = [];
  frames.forEach(({ p, side, dist }, i) => {
    const x = p.x + side.x * off, z = p.z + side.z * off;
    pos.push(x, y0, z, x, y1, z);
    uv.push(dist / 4, 0, dist / 4, 1);
    if (i < SEG) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  });
  return meshFrom(pos, uv, idx, material);
}
function meshFrom(pos, uv, idx, material) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, material);
}
// столбики вдоль трассы с шагом step
function posts(off, step, geo, color, y) {
  const count = Math.floor(TRACK_LEN / step);
  const mesh = new THREE.InstancedMesh(geo, lambert({ color }), count);
  const d = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const t = i / count, p = curve.getPointAt(t), tan = curve.getTangentAt(t);
    d.position.set(p.x - tan.z * off, y, p.z + tan.x * off);
    d.rotation.y = Math.atan2(tan.x, tan.z);
    d.updateMatrix();
    mesh.setMatrixAt(i, d.matrix);
  }
  return mesh;
}

// ---------- ЛЭП ----------
// Решётчатая опора в локальных координатах: X — поперёк линии (траверса), Z — вдоль линии.
// Опора собирается из балок; все балки всех опор — один InstancedMesh (один draw call).
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
// Пропорции опоры (в условных единицах до масштаба TOWER_SCALE_Y): длинная сужающаяся пирамида
// до "талии", сверху — расширяющийся "бокал" до траверсы и рожки грозотроса.
// Соотношение частей по высоте: пирамида : бокал : рожки = 65 : 32 : 13.
const TW_PARTS = [65, 32, 13];
const TW_SUM = TW_PARTS[0] + TW_PARTS[1] + TW_PARTS[2];
const TW_TOP = 31;                                     // верх рожков (вся высота)
const TW_WAIST = TW_TOP * TW_PARTS[0] / TW_SUM;        // талия
const TW_ARM = TW_TOP * (TW_PARTS[0] + TW_PARTS[1]) / TW_SUM;   // траверса
const TW_INS = 2.5 * (TW_TOP - TW_WAIST) / 15;               // длина гирлянды изоляторов
function towerBeams() {
  const beams = [];                                   // [a, b, толщина]
  const add = (a, b, t = 0.2) => beams.push([a, b, t]);
  // нижняя пирамида: 4 ноги от базы (±4) к талии (±1.5), 6 ярусов связей
  const LV = 6, half = y => 4 - (2.5 * y) / TW_WAIST;
  const lv = Array.from({ length: LV + 1 }, (_, i) => (TW_WAIST * i) / LV);
  const corners = y => { const s = half(y); return [V3(-s, y, -s), V3(s, y, -s), V3(s, y, s), V3(-s, y, s)]; };
  for (let c = 0; c < 4; c++) add(corners(0)[c], corners(TW_WAIST)[c], 0.4);
  for (let i = 0; i < lv.length - 1; i++) {
    const A = corners(lv[i]), B = corners(lv[i + 1]);
    for (let c = 0; c < 4; c++) {
      const n = (c + 1) % 4;
      add(A[c], A[n]);                                 // пояс
      add(A[c], B[n]); add(A[n], B[c]);                // крест
    }
  }
  // V-образный "бокал": от талии расходится к траверсе
  const W = TW_WAIST, A2 = TW_ARM, MID = (W + A2) / 2;
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) add(V3(sx * 1.5, W, sz * 1.5), V3(sx * 6, A2, sz * 1.2), 0.3);
    add(V3(sx * 1.5, W, -1.5), V3(sx * 6, A2, 1.2)); add(V3(sx * 1.5, W, 1.5), V3(sx * 6, A2, -1.2));
    add(V3(sx * 3.75, MID, -1.35), V3(sx * 3.75, MID, 1.35));
    // рожки для грозотроса
    add(V3(sx * 6, A2, 0), V3(sx * 8, TW_TOP, 0), 0.25);
    add(V3(sx * 10, A2, 0), V3(sx * 8, TW_TOP, 0), 0.15);
    // гирлянды изоляторов
    add(V3(sx * 9, A2, 0), V3(sx * 9, A2 - TW_INS, 0), 0.15);
  }
  add(V3(0, A2, 0), V3(0, A2 - TW_INS, 0), 0.15);
  // траверса: две продольные балки + решётка
  for (const sz of [-1.2, 1.2]) add(V3(-11, A2, sz), V3(11, A2, sz), 0.35);
  for (let x = -11; x < 11; x += 2) add(V3(x, A2, -1.2), V3(x + 2, A2, 1.2), 0.12);
  return beams;
}
// точки подвеса: 3 фазы + 2 грозотроса
const WIRE_POINTS = [V3(-9, TW_ARM - TW_INS, 0), V3(0, TW_ARM - TW_INS, 0), V3(9, TW_ARM - TW_INS, 0),
                     V3(-8, TW_TOP, 0), V3(8, TW_TOP, 0)];

// линия идёт вдоль дороги по внешней стороне кольца
const TOWER_SCALE_Y = 1.82;              // опоры выше в 1.82 раза (1.4 × 1.3; провода подвешены к ним же)
const LINE_OFFSET = 34;                                // от оси дороги (м), + = справа по ходу
const TOWER_STEP = 85;                                 // шаг опор вдоль трассы (м)

const POWER_TOWERS = [];                 // матрицы опор (для жил)
let pulseWires = null;                   // провода с импульсами тока (режим Y)
function buildPowerLines() {
  const beams = towerBeams();
  const list = [], count = Math.round(TRACK_LEN / TOWER_STEP);
  for (let k = 0; k < count; k++) {
    const t = k / count, p = curve.getPointAt(t), tan = curve.getTangentAt(t);
    const q = new THREE.Quaternion().setFromAxisAngle(V3(0, 1, 0), Math.atan2(tan.x, tan.z));
    list.push(new THREE.Matrix4().compose(V3(p.x - tan.z * LINE_OFFSET, 0, p.z + tan.x * LINE_OFFSET), q, V3(1, TOWER_SCALE_Y, 1)));
  }
  list.push(list[0]);                                  // замыкаем провода по кругу
  const towerMats = [list];

  // опоры
  const all = list.slice(0, -1);
  POWER_TOWERS.push(...all);
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), lambert({ color: 0x1e161c }), all.length * beams.length);
  const up = V3(0, 1, 0), m = new THREE.Matrix4();
  let i = 0;
  for (const T of all) for (const [a, b, t] of beams) {
    const dir = b.clone().sub(a), l = dir.length();
    m.compose(a.clone().add(b).multiplyScalar(0.5), new THREE.Quaternion().setFromUnitVectors(up, dir.normalize()), V3(t, l, t));
    mesh.setMatrixAt(i++, m.premultiply(T));
  }
  scene.add(mesh);

  // провода: парабола с провисом между соседними опорами
  const SAG = 4, STEPS = 16, pts = [];
  for (const list of towerMats) for (let k = 0; k < list.length - 1; k++) {
    for (const wp of WIRE_POINTS) {
      const A = wp.clone().applyMatrix4(list[k]), B = wp.clone().applyMatrix4(list[k + 1]);
      for (let j = 0; j < STEPS; j++) {
        for (const u of [j / STEPS, (j + 1) / STEPS]) {
          const p = A.clone().lerp(B, u);
          p.y -= SAG * 4 * u * (1 - u);
          pts.push(p.x, p.y, p.z);
        }
      }
    }
  }
  const wgeo = new THREE.BufferGeometry();
  wgeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const wires = new THREE.LineSegments(wgeo, new THREE.LineBasicMaterial({ color: 0x2a1a22 }));
  scene.add(wires);

  // импульсы тока: те же нити с путём вдоль каждой (aDist); рисуются только бегущие чёрточки
  const dist = [];
  for (let i = 0; i < pts.length; i += 6) {
    const seg = i / 6;                                         // номер отрезка
    const j = seg % STEPS;                                     // отрезок внутри пролёта
    const w = Math.floor(seg / STEPS) % WIRE_POINTS.length;    // номер нити
    const k = Math.floor(seg / STEPS / WIRE_POINTS.length);    // номер пролёта
    const base = (k + j / STEPS) * TOWER_STEP + w * 37;        // сдвиг, чтобы нити мигали вразнобой
    dist.push(base, base + TOWER_STEP / STEPS);
  }
  const pgeo = new THREE.BufferGeometry();
  pgeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  pgeo.setAttribute('aDist', new THREE.Float32BufferAttribute(dist, 1));
  pulseWires = new THREE.LineSegments(pgeo, WIRE_PULSE_MAT);
  pulseWires.visible = false;
  pulseWires.layers.set(REVEAL_LAYER);
  pulseWires.userData.xrSkip = true;
  scene.add(pulseWires);
}
buildPowerLines();

// ---------- Локаторы ----------
// Изредка слева от дороги — огороженная территория: три параболические антенны на
// пирамидальных опорах, дорожки, аппаратная, контейнеры, мачта связи, фонари, ворота и подъезд.
// Координаты объекта: u — вдоль дороги, v — влево от оси дороги (метры).
const RADAR_SITES = [0.08, 0.5];                     // где на трассе (доля круга) — на прямых, вне изгибов
const SITE = { u0: -55, u1: 55, v0: 40, v1: 110, gate: 4 };
const DISHES = [[-30, 62, 40, 35], [4, 90, 160, 55], [34, 60, 280, 25]];   // u, v, азимут°, угол места°

function beam(a, b, t, mat) {            // балка-брусок между двумя точками
  const dir = b.clone().sub(a), m = new THREE.Mesh(new THREE.BoxGeometry(t, dir.length(), t), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(V3(0, 1, 0), dir.normalize());
  return m;
}
function buildRadar(azDeg, elDeg) {
  const R = 8, DEPTH = 2.5, F = R * R / (4 * DEPTH);   // радиус, глубина, фокус параболы
  const white = lambert({ color: 0xe2e0d8, side: THREE.DoubleSide });
  const grey = lambert({ color: 0x9a9a96 });
  const g = new THREE.Group();
  // основание, пирамидальная опора (усечённая, 4 грани), поворотная голова
  g.add(box(7, 1, 7, 0x8a8680, 0, 0.5, 0));
  const ped = new THREE.Mesh(new THREE.CylinderGeometry(1.1 * Math.SQRT2, 2.6 * Math.SQRT2, 8, 4),
    lambert({ color: 0xcac8c0 }));
  ped.rotation.y = Math.PI / 4; ped.position.y = 5;
  g.add(ped);
  g.add(box(1, 1.8, 0.1, 0x5a5a58, 0, 1.9, 2.5));                      // дверца в опоре
  g.add(box(3.2, 1.2, 3.2, 0xb0aea6, 0, 9.6, 0));
  // тарелка: парабола вращения, ось исходно вверх; наклоняется на угол места
  const dish = new THREE.Group();
  const prof = [];
  for (let i = 0; i <= 6; i++) { const r = (R * i) / 6; prof.push(new THREE.Vector2(r, (r * r) / (4 * F))); }
  dish.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 14), white));
  // облучатель в фокусе на трёх растяжках
  for (let k = 0; k < 3; k++) {
    const a = (k / 3) * Math.PI * 2;
    dish.add(beam(V3(Math.cos(a) * R * 0.95, DEPTH * 0.9, Math.sin(a) * R * 0.95), V3(0, F, 0), 0.15, grey));
  }
  dish.add(box(0.8, 1.2, 0.8, 0x6a6a66, 0, F, 0));
  dish.add(box(1.4, 1.4, 1.4, 0x8a8680, 0, -0.6, 0));                   // ступица
  dish.position.y = 10.8;
  dish.rotation.x = THREE.MathUtils.degToRad(90 - elDeg);                 // от вертикали к горизонту
  const head = new THREE.Group();
  head.add(dish);
  head.rotation.y = THREE.MathUtils.degToRad(azDeg);
  g.add(head);
  return g;
}

function buildRadarSite() {
  const g = new THREE.Group();
  const at = (obj, u, y, v) => { obj.position.set(u, y, -v); g.add(obj); return obj; };
  const lbox = (w, h, d, color, u, y, v) => at(box(w, h, d, color, 0, 0, 0), u, y, v);
  // плоская полоса от (u1,v1) до (u2,v2) шириной wid — дорожки, провода забора
  const strip = (u1, v1, u2, v2, wid, h, y, mat) => {
    const du = u2 - u1, dz = -(v2 - v1), len = Math.hypot(du, dz);
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, h, wid), mat);
    m.rotation.y = Math.atan2(-dz, du);
    return at(m, (u1 + u2) / 2, y, (v1 + v2) / 2);
  };
  const { u0, u1, v0, v1, gate } = SITE;

  // площадка (гравий) и подъезд от трассы к воротам
  const padTex = gravelTex.clone(); padTex.needsUpdate = true; padTex.repeat.set((u1 - u0) / 4, (v1 - v0) / 4);
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(u1 - u0, v1 - v0), lambert({ map: padTex }));
  pad.rotation.x = -Math.PI / 2;
  tagFill(at(pad, (u0 + u1) / 2, 0.015, (v0 + v1) / 2), XR_BLUE.shoulder);
  tagFill(strip(0, halfS, 0, v0 + 2, 5, 0.04, 0.03, lambert({ color: 0x6a6c6e })), XR_BLUE.road);

  // бетонные дорожки: ворота -> центр -> к каждой антенне и к аппаратной
  const slab = lambert({ color: 0x9a9890 });
  const hub = [0, 76];
  tagFill(strip(0, v0, hub[0], hub[1], 3, 0.04, 0.035, slab), XR_BLUE.road);
  for (const [u, v] of DISHES) tagFill(strip(hub[0], hub[1], u, v, 2.5, 0.04, 0.035, slab), XR_BLUE.road);
  tagFill(strip(hub[0], hub[1], -26, 92, 2.5, 0.04, 0.035, slab), XR_BLUE.road);

  // забор: столбики через 3 м + три нити сетки; разрыв под ворота
  const postMat = lambert({ color: 0x9a9a96 }), wireMat = lambert({ color: 0xb8b8b4 });
  const sides = [[u0, v0, -gate, v0], [gate, v0, u1, v0], [u1, v0, u1, v1], [u1, v1, u0, v1], [u0, v1, u0, v0]];
  for (const [a1, b1, a2, b2] of sides) {
    const len = Math.hypot(a2 - a1, b2 - b1), n = Math.max(1, Math.round(len / 3));
    for (let i = 0; i <= n; i++) {
      const k = i / n;
      at(new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 0.1), postMat), a1 + (a2 - a1) * k, 1.1, b1 + (b2 - b1) * k);
    }
    for (const y of [0.6, 1.3, 2.0]) strip(a1, b1, a2, b2, 0.04, 0.04, y, wireMat);
  }
  for (const s of [-1, 1]) {
    lbox(0.3, 2.6, 0.3, 0x7a7a76, s * gate, 1.3, v0);                    // столбы ворот
    strip(s * gate, v0, s * (gate - 1.5), v0 + 3.5, 0.06, 1.8, 1.1, wireMat);   // распахнутые створки
  }

  // аппаратная: здание с окнами, дверью, парапетом и кондиционером
  lbox(14, 4, 8, 0xdcd8cc, -32, 2, 97);
  lbox(14.2, 0.3, 8.2, 0xc8c4b8, -32, 4.15, 97);
  lbox(10, 0.9, 0.1, 0x3e4858, -33, 2.6, 92.95);
  lbox(1.2, 2.2, 0.1, 0x4a4a48, -26, 1.1, 92.95);
  lbox(2, 1, 1.5, 0x9a9a96, -36, 4.8, 98);
  // контейнеры
  lbox(6.1, 2.6, 2.44, 0x5a7a5a, 16, 1.3, 101);
  lbox(6.1, 2.6, 2.44, 0x8a8a84, 24, 1.3, 101);
  // решётчатая мачта связи
  const mastMat = lambert({ color: 0x8e9296 });
  const mu = 46, mv = 98, top = 22;
  for (const [x, z] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) g.add(beam(V3(mu + x * 1.5, 0, -mv + z * 1.5), V3(mu + x * 0.3, top, -mv + z * 0.3), 0.15, mastMat));
  for (let y = 4; y < top; y += 4) {
    const w = 1.5 - 1.2 * (y / top);
    lbox(w * 2, 0.1, 0.1, 0x8e9296, mu, y, mv + w); lbox(w * 2, 0.1, 0.1, 0x8e9296, mu, y, mv - w);
    lbox(0.1, 0.1, w * 2, 0x8e9296, mu + w, y, mv); lbox(0.1, 0.1, w * 2, 0x8e9296, mu - w, y, mv);
  }
  lbox(0.2, 3, 0.2, 0x8e9296, mu, top + 1.5, mv);
  lbox(0.6, 1.2, 0.2, 0xcac8c0, mu + 0.5, top - 1, mv);                  // панельные антенны
  lbox(0.2, 1.2, 0.6, 0xcac8c0, mu, top - 1, mv - 0.5);
  // фонари
  for (const [u, v] of [[-12, 70], [20, 82], [-2, 45]]) {
    lbox(0.15, 8, 0.15, 0x8a8a84, u, 4, v);
    lbox(0.9, 0.2, 0.4, 0xd8d6cc, u + 0.4, 8, v);
  }
  // антенны
  for (const [u, v, az, el] of DISHES) at(buildRadar(az, el), u, 0, v);
  return g;
}
for (const site of RADAR_SITES) {
  const p = curve.getPointAt(site), tan = curve.getTangentAt(site);
  const g = buildRadarSite();
  g.position.set(p.x, 0, p.z);
  g.rotation.y = Math.atan2(-tan.z, tan.x);           // локальный X — вдоль дороги, -Z — влево
  scene.add(g);
}

// ---------- Саунд-система (стоит в ангаре аэродрома) ----------
const SOUND_SCALE = 1.584, PLINTH_H = 0.4;          // вся система крупнее исходной в 1.2 × 1.2 × 1.1; высота постамента
let soundSpeakers = null;                            // колонки (без постамента) — подпрыгивают под бочку, как автобус
let soundRoot = null;                                // вся саунд-система — в U обрабатывается как нереальное (как автобус)
const blinders = [];                                 // лампы блайндеров (для экранного слепящего сияния)
const blinderGlowTex = pixelTexture(32, 32, (g) => {
  const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, 'rgba(255,236,190,0.94)'); gr.addColorStop(0.37, 'rgba(255,196,120,0.45)'); gr.addColorStop(1, 'rgba(255,150,70,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
});
const WOOD = '#ad8d60', WOOD_LIGHT = '#cab38c', WOOD_DARK = '#573e2a', CONE = '#17110b', CONE_RING = '#3a3026';
function speakerFace(w, h, draw) {
  return pixelTexture(w, h, (g) => {
    g.fillStyle = WOOD; g.fillRect(0, 0, w, h);
    g.fillStyle = WOOD_LIGHT; g.fillRect(0, 0, w, 1); g.fillRect(0, 0, 1, h);
    g.fillStyle = WOOD_DARK; g.fillRect(0, h - 1, w, 1); g.fillRect(w - 1, 0, 1, h);
    draw(g);
  });
}
function speakerCone(g, cx, cy, r) {                          // динамик: тёмный круг, кольцо подвеса, колпачок
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
    const d = Math.hypot(x, y);
    if (d > r) continue;
    g.fillStyle = d > r - 1.2 ? CONE_RING : d < r * 0.28 ? '#0b0805' : CONE;
    g.fillRect(cx + x, cy + y, 1, 1);
  }
}
const FACE_MIDBASS = speakerFace(26, 18, g => { g.fillStyle = '#1a140e'; g.fillRect(2, 2, 22, 14); speakerCone(g, 13, 9, 7); });   // мидбас: один крупный динамик
const FACE_MID = speakerFace(26, 18, g => { g.fillStyle = '#1a140e'; g.fillRect(2, 2, 22, 14); speakerCone(g, 7, 9, 5); speakerCone(g, 19, 9, 5); });
const FACE_HORN = speakerFace(26, 12, g => {
  g.fillStyle = '#1a140e';
  for (let y = 2; y < 10; y++) { const half = 4 + (y - 2); g.fillRect(13 - half, y, half * 2, 1); }   // рупор
  g.fillStyle = '#0b0805'; g.fillRect(11, 4, 4, 3);
  speakerCone(g, 3, 6, 2); speakerCone(g, 22, 6, 2);                 // твитеры
});
function speakerBox(face, w, h, d) {
  const wood = lambert({ color: WOOD }), side = lambert({ color: WOOD_DARK });
  // грани BoxGeometry: +x, -x, +y, -y, +z (лицо), -z
  return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, wood, side, lambert({ map: face }), side]);
}
// басовый рупор ("совок"): открытая горловина в раме, изогнутая дека от нижнего переднего края к задней стенке,
// наверху — тёмное горло с динамиком
function scoopBin(W, H, D) {
  const g = new THREE.Group(), T = 0.05;
  const wood = lambert({ color: WOOD }), dark = lambert({ color: WOOD_DARK }), inner = lambert({ color: '#2b2016' });
  const plank = (w, h, d, mat, x, y, z, rx = 0) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z); m.rotation.x = rx; g.add(m);
  };
  for (const sx of [-1, 1]) plank(T, H, D, dark, sx * (W - T) / 2, H / 2, 0);   // боковины
  plank(W, T, D, wood, 0, H - T / 2, 0);                                        // крыша
  plank(W, T, D, dark, 0, T / 2, 0);                                            // дно
  plank(W - 2 * T, H, T, inner, 0, H / 2, -D / 2 + T / 2);                      // задняя стенка
  const R = Math.min(D, H) * 0.85, cz = -D / 2 + R, cy = T;                     // дека: 6 досок по дуге
  for (let i = 0; i < 6; i++) {
    const a0 = (i / 6) * Math.PI / 2, a1 = ((i + 1) / 6) * Math.PI / 2, am = (a0 + a1) / 2;
    const len = 2 * R * Math.sin((a1 - a0) / 2) + 0.02;
    plank(W - 2 * T, T, len, i % 2 ? wood : lambert({ color: WOOD_LIGHT }),
      0, cy + R - R * Math.cos(am), cz - R * Math.sin(am), am);   // доска по касательной к дуге
  }
  plank(W - 2 * T, H - R - 2 * T, 0.08, inner, 0, R + T + (H - R - 2 * T) / 2, -D / 2 + 0.15);   // горло
  const c = new THREE.Mesh(new THREE.CircleGeometry(Math.min(0.3, (H - R) * 0.4), 12), lambert({ color: CONE }));
  c.position.set(0, R + T + (H - R - 2 * T) / 2, -D / 2 + 0.2); g.add(c);
  return g;
}
function buildSoundSystem() {
  const g = new THREE.Group(), W = 1.3, GAP = 1.32;
  const put = (m, x, y, z = 0) => { m.position.set(x, y, z); g.add(m); };
  for (let i = 0; i < 6; i++) {
    const x = (i - 2.5) * GAP;
    put(scoopBin(W, 1.3, 1.0), x, 0);                           // басовые рупоры
    put(speakerBox(FACE_MIDBASS, W, 0.9, 1.0), x, 1.75);        // мидбас над сабом
    put(speakerBox(FACE_MID, W, 0.9, 0.9), x, 2.65, -0.05);     // средние
  }
  for (let i = 0; i < 4; i++) put(speakerBox(FACE_HORN, W, 0.6, 0.8), (i - 1.5) * GAP, 3.4, -0.1);   // рупоры
  for (const sx of [-1, 1]) for (let k = 0; k < 2; k++) {       // по две боковые башни с каждой стороны, полукругом
    const tw = new THREE.Group();
    const add = (m, y) => { m.position.y = y; tw.add(m); };
    add(scoopBin(W, 1.3, 1.0), 0);
    add(speakerBox(FACE_MIDBASS, W, 0.9, 1.0), 1.75);           // мидбас над сабом
    add(speakerBox(FACE_MID, W, 0.9, 0.9), 2.65);
    add(speakerBox(FACE_MID, W, 0.9, 0.9), 3.55);
    add(speakerBox(FACE_HORN, W, 0.6, 0.8), 4.3);
    tw.position.set(sx * (5.4 + k * 1.45), 0, 0.6 + k * 0.75);
    tw.rotation.y = -sx * (0.35 + k * 0.22);
    g.add(tw);
  }
  const root = new THREE.Group();                               // постамент, система на нём
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(17.6, PLINTH_H, 3.8), lambert({ color: 0x6f6a60 }));
  plinth.position.set(0, PLINTH_H / 2, 0.4);
  root.add(plinth);
  const lip = new THREE.Mesh(new THREE.BoxGeometry(17.8, 0.06, 4.0), lambert({ color: 0x57524a }));
  lip.position.set(0, PLINTH_H, 0.4);
  root.add(lip);
  g.position.y = PLINTH_H;
  root.add(g);
  root.scale.setScalar(SOUND_SCALE);
  root.userData.speakers = g;
  return root;
}

  return pixelTexture(w, h, (g) => {
    const n = colors.length;
    for (let i = 0; i < (vertical ? w : h); i++) {

}
const DIGITS = {                                      // пиксельный шрифт 3×5

// Ан-2 "кукурузник": биплан, звездообразный мотор с 4-лопастным винтом (крутится на холостых),

// Инверсия цветов обычных материалов (вариант автобуса в режиме U): текстура/цвет -> 1 - c, без освещения
function invertMat(src, invert = true) {
  const map = src.map || null;
  if (map) map.updateMatrix();
  return new THREE.ShaderMaterial({
    uniforms: {
      map: { value: map }, useMap: { value: map ? 1 : 0 }, uvTransform: { value: map ? map.matrix : new THREE.Matrix3() },
      baseColor: { value: (src.color || new THREE.Color(1, 1, 1)).clone() },
    },
    vertexShader: `
      uniform mat3 uvTransform; varying vec2 vUv;
      void main() { vUv = (uvTransform * vec3(uv, 1.0)).xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform sampler2D map; uniform float useMap; uniform vec3 baseColor; varying vec2 vUv;
      void main() {
        vec3 c = useMap > 0.5 ? texture2D(map, vUv).rgb : baseColor;
        gl_FragColor = vec4(1.0 - c, 1.0);
      }`,
  });
}
function buildBus() {
  const bus = new THREE.Group();
  const body = new THREE.Group();                   // качается; колёса остаются на земле
  bus.add(body);

  // порядок граней BoxGeometry: +x, -x, +y, -y, +z (корма), -z (нос)
  const mats = [busRightTex, busLeftTex, null, null, busRearTex, busFrontTex]
    .map((map, i) => lambert(map ? { map } : { color: i === 2 ? 0xe4e4de : 0x202022 }));
  const hull = new THREE.Mesh(new THREE.BoxGeometry(BUS_W, BUS_H, BUS_L), mats);
  hull.position.y = BUS_Y0 + BUS_H / 2;
  body.add(hull);
  const extras = [
    box(BUS_W - 0.3, 0.12, BUS_L - 0.3, 0xe4e4de, 0, BUS_Y0 + BUS_H + 0.06, 0),   // скруглённая крыша
    box(0.12, 0.12, 0.12, 0xd0d0cc, -0.9, BUS_Y0 + BUS_H + 0.15, 5.2),           // маячки на крыше
    box(0.12, 0.12, 0.12, 0xd0d0cc, 0.9, BUS_Y0 + BUS_H + 0.15, 5.2),
  ];
  for (const s of [-1, 1]) extras.push(box(0.08, 0.5, 0.25, DARK, s * 1.45, 2.3, -5.4));   // зеркала
  body.add(...extras);

  // колёса: 8-гранные цилиндры в поворотных шарнирах
  const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.32, 8);
  wheelGeo.rotateZ(Math.PI / 2);
  const wheelMat = lambert({ color: 0x141414 });
  const front = [], hubs = [], tyres = [];
  for (const z of [-3.3, 2.4]) for (const s of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(s * 1.05, 0.5, z);
    const tyre = new THREE.Mesh(wheelGeo, wheelMat);
    pivot.add(tyre); tyres.push(tyre);
    const hub = xrayBox(0.36, 0.5, 0.5, 0, 0, 0, XRAY_MID);                    // обод/ступица на рентгене
    pivot.add(hub); hubs.push(hub);

  bus.userData.setXray = (on) => {
    hull.material = on ? ghost : mats;

    for (const h of hubs) h.visible = on;
    for (const t of tyres) t.material = on ? XRAY_BONE : wheelMat;
    xray.inBody.visible = xray.chassis.visible = on;
  };
  // режим U, вариант "инвертированный": обычный автобус с обратными цветами, без освещения
  const extrasMat = extras.map(m => m.material);

    extras.forEach((m, i) => { m.material = on ? invExtras[i] : extrasMat[i]; });
    for (const t of tyres) t.material = on ? invWheel : wheelMat;
  };

  bus.userData.setLook = (look) => {
    bus.userData.setInvert(false);

  bus.userData.frontWheels = front;
  bus.userData.body = body;

}

function buildBusXray() {
  const g = new THREE.Group();                      // качается вместе с кузовом
  const y0 = BUS_Y0, y1 = BUS_Y0 + BUS_H, hw = BUS_W / 2 - 0.04, T = 0.035;   // толщина брусков каркаса
  // каркас: стойки между окнами, дуги крыши, продольные пояса
  for (let z = -5.4; z <= 5.41; z += 1.2) {
    for (const s of [-1, 1]) g.add(xrayBox(T, BUS_H, T, s * hw, y0 + BUS_H / 2, z));
    g.add(xrayBox(BUS_W - 0.08, T, T, 0, y1 - 0.04, z));
  }
  for (const y of [y0 + 0.04, 1.97, y1 - 0.04]) for (const s of [-1, 1]) g.add(xrayBox(T, T, BUS_L, s * hw, y, 0));
  for (const z of [-BUS_L / 2 + 0.04, BUS_L / 2 - 0.04]) {             // рамки носа и кормы
    g.add(xrayBox(BUS_W - 0.08, T, T, 0, 1.97, z));
    g.add(xrayBox(BUS_W - 0.08, T, T, 0, y0 + 0.04, z));
  }
  // сиденья: по два с каждой стороны прохода, лицом вперёд; справа пропуск у средней двери
  for (let z = -3.6; z <= 4.25; z += 0.8) for (const s of [-1, 1]) {
    if (s > 0 && Math.abs(z) < 0.6) continue;
    for (const x of [0.52, 0.95]) {
      g.add(xrayBox(0.4, 0.1, 0.42, s * x, 0.95, z, XRAY_SOFT));        // сидушка
      g.add(xrayBox(0.4, 0.55, 0.08, s * x, 1.27, z + 0.21, XRAY_SOFT)); // спинка
      g.add(xrayBox(0.025, 0.45, 0.025, s * x, 0.72, z));                // ножка
    }
  }
  // водитель: кресло, руль, торпедо
  g.add(xrayBox(0.45, 0.1, 0.45, -0.7, 0.95, -4.3, XRAY_SOFT));
  g.add(xrayBox(0.45, 0.6, 0.08, -0.7, 1.3, -4.08, XRAY_SOFT));
  const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.018, 4, 12), XRAY_BONE);
  wheel.position.set(-0.7, 1.5, -4.85); wheel.rotation.x = -1.1;
  g.add(wheel, xrayBox(0.025, 0.025, 0.5, -0.7, 1.35, -5.05));
  g.add(xrayBox(BUS_W - 0.2, 0.12, 0.35, 0, 1.3, -5.25));
  // двигатель в корме с головками цилиндров + кардан к заднему мосту
  g.add(xrayBox(1.3, 0.9, 1.0, 0, 1.05, 4.8));
  for (let i = 0; i < 6; i++) g.add(xrayBox(0.16, 0.18, 0.16, -0.45 + i * 0.18, 1.6, 4.8, XRAY_MID));
  g.add(xrayBox(0.05, 0.05, 1.9, 0, 0.6, 3.35));
  // рама
  for (const s of [-1, 1]) g.add(xrayBox(0.06, 0.09, BUS_L - 0.4, s * 0.5, 0.55, 0));

  const chassis = new THREE.Group();                // мосты — на колёсах, не качаются
  for (const z of [-3.3, 2.4]) chassis.add(xrayBox(2.1, 0.06, 0.06, 0, 0.5, z));
  chassis.add(xrayBox(0.4, 0.35, 0.4, 0, 0.5, 2.4));                 // редуктор заднего моста
  if (PASSENGER_ON) g.add(buildPassengerSkeleton());
  return { inBody: g, chassis };
}

function updatePassenger(dt, time) {

  const drop = nod > 0.45 ? 1 : 0;
  const key = drop + '|' + scratch + '|' + rub;

const REAR_WHEELS = [[-1.05, 2.4], [1.05, 2.4]];   // локальные x, z задних колёс
const skidLast = [null, null];
function updateSkids(on) {
  const c = Math.cos(car.heading), s = Math.sin(car.heading);
  REAR_WHEELS.forEach(([lx, lz], w) => {
    if (!on) { skidLast[w] = null; return; }
    const x = car.x + lx * c + lz * s, z = car.z - lx * s + lz * c;
    const prev = skidLast[w];
    if (prev) {
      const dx = x - prev[0], dz = z - prev[1], len = Math.hypot(dx, dz);
      if (len < 0.05) return;
      const nx = (-dz / len) * SKID_W / 2, nz = (dx / len) * SKID_W / 2, y = 0.06;
      skidPos.set([prev[0] - nx, y, prev[1] - nz, prev[0] + nx, y, prev[1] + nz,
                   x - nx, y, z - nz, x + nx, y, z + nz], skidNext * 12);
      skidNext = (skidNext + 1) % SKID_MAX;
      skidGeo.attributes.position.needsUpdate = true;
    }
    skidLast[w] = [x, z];
  });
}

const bassEnv = (() => {
  if (!TD) return null;
  const a = TD.bass.map(v => v / 99), k = 0.25;
  for (let i = 1; i < a.length; i++) a[i] += (a[i - 1] - a[i]) * (1 - k);
  for (let i = a.length - 2; i >= 0; i--) a[i] += (a[i + 1] - a[i]) * (1 - k);
  return a;
})();

// индекс последнего события с временем <= t (бинарный поиск по [[t, сила], ...])
function lastBefore(list, t) {
  let lo = 0, hi = list.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (list[m][0] <= t) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}

// крен/проседание кузова от музыки в момент t
function musicPose(t) {
  const pose = { roll: 0, y: 0, pitch: 0 };
  if (!TD || music.paused) return pose;
  // крен: маятник с крайними точками на долях, сторона чередуется
  const bi = lastBefore(TD.beats, t);
  if (bi >= 0 && bi < TD.beats.length - 1) {
    const [b0, s0] = TD.beats[bi], [b1, s1] = TD.beats[bi + 1];
    const u = (t - b0) / (b1 - b0);
    const s = s0 + (s1 - s0) * u;                    // сила доли, плавно между долями
    pose.roll = SWAY_ROLL * Math.min(1, s) * Math.cos(Math.PI * (bi + u));
  }
  // бочка: кузов подпрыгивает и мягко садится с затухающим отскоком
  for (let i = lastBefore(TD.kicks, t); i >= 0 && t - TD.kicks[i][0] < 0.6; i--) {
    const d = t - TD.kicks[i][0], s = TD.kicks[i][1];
    const r = Math.exp(-d / 0.14) * Math.cos(d * 16);
    pose.y += KICK_HOP * s * r;
    pose.pitch += 0.008 * s * r;                      // нос подлетает чуть выше кормы
  }
  pose.y += BASS_LIFT * (bassEnv[Math.min(bassEnv.length - 1, Math.floor(t * TD.fps))] || 0);
  return pose;
}

// перемотка: Q/E — ±5 с (с Shift ±30 с), 1..9/0 — к 10..90% / в начало, P — пауза
function seekMusic(t) {
  if (!isFinite(music.duration)) return;
  music.currentTime = Math.max(0, Math.min(music.duration - 0.1, t));
}
function musicKeys(e) {
  const step = e.shiftKey ? 30 : 5;
  if (e.code === 'KeyQ') seekMusic(music.currentTime - step);
  else if (e.code === 'KeyE') seekMusic(music.currentTime + step);
  else if (/^Digit\d$/.test(e.code)) seekMusic(music.duration * Number(e.code[5]) / 10);
  else if (e.code === 'KeyP') { music.paused ? music.play().catch(() => {}) : music.pause(); return true; }
  return false;
}

function nearestFrameIdx(x, z) {

    const p = frames[i].p, d = (p.x - x) ** 2 + (p.z - z) ** 2;

}
function seededRandom(seed) {            // mulberry32
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// опоры по кускам трассы (по ближайшему кадру основания)

// вероятность ответвления на шаг: поле, дорога (×4 — у деревьев на асфальте, почти каждая развилка), небо, усики лиан
const BRANCH_P = { field: 0.2, road: 0.18, sky: 0.09, vine: 0.13 };
// острота обоих концов: ширина растёт из нуля в начале ветви и сходит в ноль к кончику (за tip метров)
const pointy = (d, dStart, dEnd, tip) => Math.max(0, Math.min(1, (d - dStart) / tip, (dEnd - d) / tip));
// точки ветви [x, z, ширина, путь] -> полоска на земле с острыми концами
// напольные жилы не строго на полу: высота вдоль ветви плавно волнуется (ниже нуля — "ныряет" под землю)
const FLOOR_LIFT = { field: 3.2, road: 1.4 };    // м — размах подъёма/ныряния (дугами, как корни из грунта)
function liftFn(rnd, amp, d0, y0) {              // y(d), непрерывна в начале ветви (y(d0) = y0)
  const a = amp * (0.4 + rnd() * 0.8), f = 0.08 + rnd() * 0.1, ph = rnd() * 6.28;
  return d => y0 + a * (Math.sin(d * f + ph) - Math.sin(d0 * f + ph));
}
function emitRibbon(out, pts, tip, tipStart = tip) {
  if (pts.length < 2) return;
  const dStart = pts[0][3], dEnd = pts[pts.length - 1][3];
  const wAt = q => q[2] * Math.max(0, Math.min(1, (q[3] - dStart) / tipStart, (dEnd - q[3]) / tip));
  for (let i = 1; i < pts.length; i++) {
    const [x0, z0, , d0, y0] = pts[i - 1], [x1, z1, , d1, y1] = pts[i];
    const w0 = wAt(pts[i - 1]), w1 = wAt(pts[i]);
    const len = Math.hypot(x1 - x0, z1 - z0) || 1, nx = -(z1 - z0) / len, nz = (x1 - x0) / len;
    out.pos.push(
      x0 + nx * w0 / 2, y0, z0 + nz * w0 / 2,  x0 - nx * w0 / 2, y0, z0 - nz * w0 / 2,  x1 + nx * w1 / 2, y1, z1 + nz * w1 / 2,
      x0 - nx * w0 / 2, y0, z0 - nz * w0 / 2,  x1 - nx * w1 / 2, y1, z1 - nz * w1 / 2,  x1 + nx * w1 / 2, y1, z1 + nz * w1 / 2);
    out.dist.push(d0, d0, d1, d0, d1, d1);
  }
}
// ветвистая жила в поле: ломаная со случайным изгибом, сужается, иногда ветвится;
// обрывается, дойдя до обочины (смещение считается относительно кадра трассы f рядом с корнем)
function growGround(rnd, out, x, z, ang, w, maxSteps, f) {
  const offRoad = (px, pz) => Math.abs((px - f.p.x) * f.side.x + (pz - f.p.z) * f.side.z) > halfS + 0.3;
  const stack = [[x, z, ang, w, 0, maxSteps, 0, 0.07]];
  while (stack.length) {
    let [x0, z0, a, w0, d0, steps, depth, yStart] = stack.pop();
    const lift = liftFn(rnd, FLOOR_LIFT.field, d0, yStart);
    const pts = [[x0, z0, w0, d0, yStart]];
    for (let s = 0; s < steps; s++) {
      const step = 1.8 + rnd() * 1.8;
      a += (rnd() - 0.5) * 0.7;
      const x1 = x0 + Math.cos(a) * step, z1 = z0 + Math.sin(a) * step, w1 = w0 * 0.955;
      if (!offRoad(x1, z1)) break;
      x0 = x1; z0 = z1; w0 = w1; d0 += step;
      pts.push([x0, z0, w0, d0, lift(d0)]);
      if (w0 < 0.08) break;
      if (depth < 4 && rnd() < BRANCH_P.field) {        // ветвление: не глубже 4 уровней, ветви короче
        const turn = (rnd() < 0.5 ? -1 : 1) * (0.4 + rnd() * 0.6);
        stack.push([x0, z0, a + turn, w0 * 0.65, d0, Math.floor((steps - s) * 0.75), depth + 1, lift(d0)]);
      }
    }
    emitRibbon(out, pts, 6);                             // острый кончик: последние 6 м
  }
}
// ветвистая жила в небе: 3D-ломаная, тянется вверх и в стороны
const SKY_REACH = 0.89;                  // длина жил в небе (0.89 — на 11% короче исходной)
const SKY_BRANCH_P = BRANCH_P.sky, SKY_BRANCH_DEPTH = 2;   // ветвление жил в небе: вероятность на шаг и глубина
function growSky(rnd, out, p, dir, dist, maxSteps, root) {
  const stack = [[p.clone(), dir.clone(), dist, maxSteps, 0]];
  const jitter = new THREE.Vector3();
  while (stack.length) {
    let [q, d, d0, steps, depth] = stack.pop();
    const segs = [], thick = [1, 0.6, 0.4][depth] || 0.3;

// ---------- Автопилот (O) ----------
// Держит свою полосу через "погоню за точкой" впереди, как живой водитель:
// на прямых — центр полосы с едва заметным дрейфом, в поворотах срезает внутрь
// (в левых — на осевую, в правых — на краевую), то сильнее, то слабее.
// Нажатые клавиши руля/газа перебивают автопилот, пока их держишь.
const AUTO_SPEED = 125 / 3.6;            // м/с — на прямых мчит
const AUTO_SPEED_TURN = 80 / 3.6;       // м/с — в поворотах
const BRAKE_LOOK = 250;                  // м — насколько заранее видит поворот для сброса скорости
const LANE_OFFSET = ROAD_WIDTH / 4;      // центр правой полосы от оси дороги
const STRAIGHT_DRIFT = 0.15;             // м — дрейф на прямых
const CORNER_CUT = 1.7;                  // м — максимальный срез в повороте (1.25 = касание линии)
const CUT_FULL_K = 0.0012;               // 1/м — кривизна, при которой срез полный (основные повороты R=840)
const autopilot = { on: false, idx: 0, t: 0 };
const FRAME_STEP = TRACK_LEN / SEG;

// кривизна трассы по кадрам (+ = влево), сглаженная окном ~80 м
const trackCurv = (() => {
  const th = frames.slice(0, SEG).map(f => Math.atan2(f.side.z, -f.side.x));   // угол касательной
  const raw = th.map((a, i) => {
    let d = th[(i + 1) % SEG] - a;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    return d / FRAME_STEP;
  });
  const W = 20;
  return raw.map((_, i) => {
    let s = 0;
    for (let j = -W; j <= W; j++) s += raw[(i + j + SEG) % SEG];
    return s / (2 * W + 1);
  });
})();

// при включении — ближайшая точка по всей трассе (автобус мог уехать куда угодно)
function autopilotResync() {
  let best = Infinity;
  frames.forEach(({ p }, i) => {
    const dd = (p.x - car.x) ** 2 + (p.z - car.z) ** 2;
    if (i < SEG && dd < best) { best = dd; autopilot.idx = i; }
  });
}

function autopilotInput(dt) {
  autopilot.t += dt;
  // ближайший кадр трассы: ищем рядом с прошлым
  let best = Infinity, bi = autopilot.idx;
  for (let d = -25; d <= 60; d++) {
    const i = (((autopilot.idx + d) % SEG) + SEG) % SEG, p = frames[i].p;
    const dd = (p.x - car.x) ** 2 + (p.z - car.z) ** 2;
    if (dd < best) { best = dd; bi = i; }
  }
  autopilot.idx = bi;
  // точка впереди в своей полосе
  const t = autopilot.t;
  const look = 14 + 0.8 * Math.abs(car.speed);
  const ahead = Math.round(look / FRAME_STEP);
  const f = frames[(bi + ahead) % SEG];
  // на прямой — лёгкий дрейф; в повороте — срез внутрь, заранее (смотрим кривизну дальше точки цели)
  const drift = STRAIGHT_DRIFT * (0.6 * Math.sin(t * 0.11) + 0.4 * Math.sin(t * 0.29 + 2.3));
  const kAhead = trackCurv[(bi + ahead + Math.round(20 / FRAME_STEP)) % SEG];
  const cutAmount = Math.min(1, Math.abs(kAhead) / CUT_FULL_K);
  const cutMood = 0.65 + 0.35 * Math.sin(t * 0.23 + 0.8);      // то срезает сильнее, то аккуратнее
  const cut = -Math.sign(kAhead) * CORNER_CUT * cutAmount * cutMood;   // влево = к оси (меньше offset)
  const off = LANE_OFFSET + drift + cut;
  const tx = f.p.x + f.side.x * off - car.x, tz = f.p.z + f.side.z * off - car.z;
  const c = Math.cos(car.heading), s = Math.sin(car.heading);
  const lat = -(tx * c - tz * s);                        // смещение цели влево от автобуса
  const steer = Math.atan(2 * WHEELBASE * lat / (tx * tx + tz * tz));
  // скорость: сбрасывает заранее, если в ближайших BRAKE_LOOK метрах есть поворот
  let kMax = 0;
  for (let j = 0; j < BRAKE_LOOK / FRAME_STEP; j += 2) kMax = Math.max(kMax, Math.abs(trackCurv[(bi + j) % SEG]));
  const turnF = Math.min(1, kMax / CUT_FULL_K);
  const dv = AUTO_SPEED + (AUTO_SPEED_TURN - AUTO_SPEED) * turnF - car.speed;
  return { steer, gas: Math.min(1, Math.max(0, dv * 0.4)), brake: dv < -1 ? Math.min(0.35, -dv * 0.08) : 0 };   // мягко, ~5 м/с² максимум
}


// ---------- Физика ----------
function update(dt) {
  const t2 = touchState();
  const up = k('KeyW', 'ArrowUp') || (t2.fwd && !t2.rev);
  const down = k('KeyS', 'ArrowDown') || (t2.rev && !t2.fwd);         // тормоз, остановился — задний ход
  const left = k('KeyA', 'ArrowLeft') || (t2.L && !t2.R), right = k('KeyD', 'ArrowRight') || (t2.R && !t2.L);
  const hand = k('Space');
  const ap = autopilot.on ? autopilotInput(dt) : null;
  const manualPedals = up || down, manualSteer = left || right;

  // педали нажимаются не мгновенно; тяга дизеля падает с ростом скорости
  const pedal = (v, to, press, release) => v + Math.max(-release * dt, Math.min(press * dt, to - v));
  const gasTo = ap && !manualPedals ? ap.gas : up ? 1 : 0;
  const brakeTo = ap && !manualPedals ? ap.brake : down ? 1 : 0;
  car.gas = pedal(car.gas, gasTo, GAS_PRESS, GAS_RELEASE);
  car.brake = pedal(car.brake, brakeTo, BRAKE_PRESS, GAS_RELEASE);

  const prevSpeed = car.speed;
  const torque = 1 - 0.6 * Math.max(0, car.speed) / MAX_SPEED;
  car.speed += (car.speed < 0 ? BRAKE : ACCEL * torque) * car.gas * dt;
  car.speed -= (car.speed > 0 ? BRAKE : ACCEL * 0.6) * car.brake * dt;

  const drag = (!gasTo && !brakeTo ? DRAG : 0) + (hand ? HAND_DRAG : 0);
  if (drag) {
    const s = Math.sign(car.speed);
    car.speed -= s * Math.min(Math.abs(car.speed), drag * dt);
  }
  car.speed = Math.max(-MAX_REVERSE, Math.min(MAX_SPEED, car.speed));

  // руль: колёса поворачиваются с постоянной (медленной) скоростью; на скорости угол меньше
  const target = (left ? 1 : 0) - (right ? 1 : 0);
  const steerLimit = MAX_STEER * (1 - 0.85 * Math.min(1, Math.abs(car.speed) / MAX_SPEED));
  const auto = ap && !manualSteer;
  const want = auto ? Math.max(-steerLimit, Math.min(steerLimit, ap.steer)) : target * steerLimit;
  const rate = target || auto ? STEER_RATE : STEER_RETURN;
  car.steer += Math.max(-rate * dt, Math.min(rate * dt, want - car.steer));

  // велосипедная модель + инерция кузова по курсу
  const yawTarget = (car.speed / WHEELBASE) * Math.tan(car.steer);
  car.yawRate += (yawTarget - car.yawRate) * (1 - Math.exp(-dt / YAW_LAG));
  car.heading += car.yawRate * dt;
  car.x -= Math.sin(car.heading) * car.speed * dt;
  car.z -= Math.cos(car.heading) * car.speed * dt;

  // крен от поворота (наружу) и клевок от разгона/торможения — сглаженно, кузов тяжёлый
  const a = dt > 0 ? (car.speed - prevSpeed) / dt : 0;
  const sm = 1 - Math.exp(-dt / 0.3);
  car.accel += (a - car.accel) * sm;
  car.roll += (-0.008 * car.speed * car.yawRate - car.roll) * sm;
  car.pitch += (0.0015 * car.accel - car.pitch) * sm;

  const m = musicPose(music.currentTime + AUDIO_LOOKAHEAD);
  const body = bus.userData.body;
  body.position.y = m.y;
  body.rotation.set(car.pitch + m.pitch, 0, car.roll + m.roll);

  bus.position.set(car.x, 0, car.z);
  bus.rotation.y = car.heading;
  for (const w of bus.userData.frontWheels) w.rotation.y = car.steer;
  updateSkids(hand && Math.abs(car.speed) > 1);
  updatePassenger(dt, performance.now() / 1000);
  for (const f of airportAnim) f(performance.now() / 1000);
}

// ---------- Камера сверху-сзади ----------
// Ракурс низкий (снизу вверх — вышки кажутся выше): 44% пути от прежнего обычного к полному низкому.
// Широкий объектив 200% (+30° к базовому углу → 90°).
// Дистанция 79%: между прежней (100%) и вплотную к корме (0%).
const CAM_NORMAL = { back: 14, up: 7, ahead: 8, lookY: 1.5 };
const CAM_LOW_FULL = { back: 12, up: 3.2, ahead: 30, lookY: 8.5 };
const LOW_AMOUNT = 0.44, WIDE_AMOUNT = 2.0, DIST_AMOUNT = 0.79;

const camCfg = Object.fromEntries(Object.keys(CAM_NORMAL).map(k =>
  [k, CAM_NORMAL[k] + (CAM_LOW_FULL[k] - CAM_NORMAL[k]) * LOW_AMOUNT]));
camCfg.back = CAM_BACK_CLOSE + (camCfg.back - CAM_BACK_CLOSE) * DIST_AMOUNT;
camera.fov = CAM_FOV + 15 * WIDE_AMOUNT;
camera.updateProjectionMatrix();

// Дистанция до автобуса всегда фиксирована; плавно догоняет только угол камеры.
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let camYaw = car.heading;
function updateCamera(dt, snap) {
  let d = car.heading - camYaw;
  d = Math.atan2(Math.sin(d), Math.cos(d));              // кратчайший угол
  camYaw += snap ? d : d * (1 - Math.exp(-4 * dt));
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
  const { back, up, ahead, lookY } = camCfg;
  camPos.set(car.x - fx * back, up, car.z - fz * back);
  camLook.set(car.x + fx * ahead, lookY, car.z + fz * ahead);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  sky.position.copy(camPos);             // небо всегда "на бесконечности"
  hills.position.set(camPos.x, 0, camPos.z);
  placeSun(camPos);
}

// ---------- Контр-блики ----------

const GHOSTS = [   // [позиция на линии (0 — солнце, 1 — центр), радиус px, цвет, яркость, кольцо?]

// блайндеры на экране: тёплое сияние вокруг каждого + лёгкая засветка кадра, когда смотрят "в лицо".
// Без призраков и лучей. Стены ангара закрывают (сквозь проём ворот — видно).
const _bp = new THREE.Vector3(), _bf = new THREE.Vector3(), _bc = new THREE.Vector3(), _bn = new THREE.Vector3();
function drawBlinders() {

  const g = fx2d, W = RES_W, H = RES_H;

    const x = fu * W, y = fv * H, r = 6.4 + 22 * I;                         // между компактным и прежним (40% назад)

// скорость в углу: пиксельный шрифт 3×5 на сетке игры, правый нижний угол (подальше от выреза камеры)

function drawSpeed() {
  const txt = Math.round(Math.abs(car.speed) * 3.6) + ' KM/H';
  const g = fx2d, w = txt.length * 4 - 1, x0 = RES_W - 4 - w, y0 = RES_H - 4 - 5;
  for (const [col, dx, dy] of [['rgba(0,0,0,0.55)', 1, 1], ['rgba(255,255,255,0.85)', 0, 0]]) {   // тень, потом текст

function drawFlare() {

  camera.getWorldDirection(_view);
  _toSun.copy(sunGroup.position).sub(camera.position).normalize();

  g.fillStyle = glow; g.fillRect(0, 0, W, H);

// ---------- Птицы ----------
// Изредка стайка пересекает небо впереди: силуэты машут крыльями и иногда планируют.
const BIRD_EVERY = [15, 40];             // с — пауза между стайками (случайно в диапазоне)
const BIRD_MAT = lambert({ color: 0x1e161c, side: THREE.DoubleSide, fog: false });   // силуэт не тонет в дымке

function makeBird() {
  const b = new THREE.Group();           // вперёд = +Z
  const mesh = (geo) => {                // во время режима Y — сразу белая; оригинал запомнен для возврата
    const m = new THREE.Mesh(geo, worldXray ? XR_WHITE : BIRD_MAT);
    m.userData.origMat = BIRD_MAT;
    return m;
  };
  b.add(mesh(new THREE.BoxGeometry(0.3, 0.2, 0.9)));

  for (const s of [-1, 1]) {
    const pivot = new THREE.Group();
    const w = mesh(new THREE.BoxGeometry(1.4, 0.06, 0.5));
    w.position.x = s * 0.7;

    for (const b of f.g.children) {
      const u = b.userData;
      const gliding = Math.sin(time * 0.6 + u.glide) > 0.55;      // иногда планирует
      const flap = gliding ? 0.12 : 0.15 + 0.55 * Math.sin(time * 9 + u.phase);
      for (const [pivot, s] of u.wings) pivot.rotation.z = s * flap;
      b.position.copy(u.off).setY(u.off.y + Math.sin(time * 1.3 + u.phase) * 0.4);
    }
    if (f.age > 45) { scene.remove(f.g); flocks.splice(i, 1); }
  }
}

// ---------- Цикл ----------
let last = performance.now();
updateCamera(0, true);
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  updateCamera(dt, false);
  updateBirds(dt, now / 1000);
  const t = now / 1000;
  for (const m of [VEIN_GROUND_MAT, VEIN_ROAD_MAT, VEIN_SKY_MAT, VINE_MAT, WIRE_PULSE_MAT]) m.uniforms.uTime.value = t % 1000;
  uMat.uniforms.uTime.value = t % 1000;
  updateVeinChunks();
  if (soundSpeakers) {                     // саунд-система подпрыгивает под бочку — на ту же высоту, что автобус
    const mp = musicPose(music.currentTime + AUDIO_LOOKAHEAD);
    soundSpeakers.position.y = PLINTH_H + mp.y / SOUND_SCALE;
  }
  if (xrayMode === 'U') updateGravel();
  for (const m of [VEIN_SKY_MAT, VINE_MAT]) {
    m.uniforms.uCam.value.copy(camera.position);
    m.uniforms.uRes.value.set(hiRT.width, hiRT.height);
  }
  renderFrame();
  drawFlare();
  drawBlinders();
  drawSpeed();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
