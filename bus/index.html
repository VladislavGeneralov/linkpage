<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Bus</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141c; overflow: hidden; }
  #game, #flare {
    position: absolute; inset: 0; margin: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #flare { pointer-events: none; }
  /* обычный режим: контраст и насыщенность итогового кадра; в режиме Y (синька) — без фильтра */
  :root { --contrast: 1.1; --saturate: 1.2; }
  #view { position: fixed; inset: 0; filter: contrast(var(--contrast)) saturate(var(--saturate)); }
  #view.xray { filter: none; }
  /* индикатор дубля (R) — поверх кадра, в рендер не попадает */
  #take { position: fixed; top: 10px; left: 12px; font: bold 14px/1 monospace; color: #fff;
    text-shadow: 0 0 3px #000; pointer-events: none; display: none; }
  #take.rec::before { content: 'CF  '; color: #ff3030; }
  /* приборы (выбор машины, скорость) — свой холст поверх кадра: в режимах Y/U холст бликов прячется, приборы — нет */
  #hud { position: absolute; inset: 0; margin: auto; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
  /* крошечные переключатели на поле страницы снизу слева (как в tropicalgame): сенсорные ручки и помощь в заносе */
  #touchToggle, #driftToggle { position: fixed; left: 8px; bottom: 8px; z-index: 5; display: flex; align-items: center; gap: 5px; cursor: pointer;
    font: 10px/1 Consolas, 'Courier New', monospace; color: #5f6b7a; user-select: none; }
  #driftToggle { bottom: 24px; }
  #touchToggle[hidden], #driftToggle[hidden] { display: none; }
  #touchToggle i, #driftToggle i { position: relative; width: 18px; height: 10px; border-radius: 5px; background: #26334a; transition: background 0.15s; }
  #touchToggle i::after, #driftToggle i::after { content: ''; position: absolute; left: 1px; top: 1px; width: 8px; height: 8px; border-radius: 50%; background: #5f6b7a; transition: left 0.15s, background 0.15s; }
  #touchToggle.on i, #driftToggle.on i { background: #3a5a3a; } #touchToggle.on i::after, #driftToggle.on i::after { left: 9px; background: #9ad89a; } #touchToggle.on, #driftToggle.on { color: #9aa6b4; }
</style>
</head>
<body>
<div id="view">
  <canvas id="game"></canvas>
  <canvas id="flare"></canvas>
</div>
<canvas id="hud"></canvas>
<div id="take"></div>
<div id="touchToggle" hidden title="touch controls"><i></i>TOUCH</div>
<div id="driftToggle" hidden title="drift assist (J)"><i></i>DRIFT ASSIST</div>
<!-- трек подключает скрипт (на вечеринке музыка играет снаружи — там он не грузится вовсе) -->
<audio id="music" loop preload="none"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="track_data.js"></script>
<script src="island_data.js"></script>
<!-- машины из tropicalgame (копии файлов моделей; обновлять — скопировать заново из tropicalgame) -->
<script src="cars/beetle.js"></script>
<script src="cars/porsche.js"></script>
<script src="cars/lancia.js"></script>
<script src="cars/scooters.js"></script>
<script src="cars/dmax.js"></script>
<script src="cars/city.js"></script>
<script src="cars/evo.js"></script>
<script src="cars/impreza.js"></script>
<script src="cars/car_icons.js"></script>
<script src="touch.js"></script>
<script src="farm.js"></script>
<script>
// ---------- Настройки ----------
// 4:5 как афиша BROKEN17 (3548×4435). Высота прежняя (270) — пиксель того же размера, на 1080p ровно ×4.
// Для 16:9 было 480×270 и CAM_FOV 55.
// Вечеринка (Broken Bus/bus_party, сервер вставляет window.PARTY до скриптов игры): 'phone' — игра на телефоне,
// 'watch' (или ?watch в адресе) — наблюдатель на дашборде: без ввода, картинка по присланному состоянию (busParty).
// В обоих режимах кадр — по пропорциям экрана (как в мобильной версии: высота RES_H постоянная, ширина по экрану),
// растянут на весь экран не целым масштабом; у наблюдателя iframe — в пропорциях экрана его телефона.
// 'phantom' — фантомная поездка бота, пока никто не катается: обычная физика, без тач-слоя и музыки.
// С сайта (ellectroniqa.com/bus) сенсорный экран без PARTY — тоже 'phone': кадр по экрану, джойстики сразу.
const PARTY = window.PARTY || (/[?&]watch\b/.test(location.search) ? 'watch' : null) || (matchMedia('(pointer: coarse)').matches ? 'phone' : null);
window.PARTY = PARTY;                    // (touch.js смотрит window.PARTY)
const PHONE = PARTY === 'phone', WATCH = PARTY === 'watch', PHANTOM = PARTY === 'phantom';
// широкое окно вечеринки (окна игроков на компе — 16:9): прежний горизонтальный вариант — высота 270, угол обзора 55
// пропорции окна при запуске; пока окно ещё без размера (бывает у только что открытого окна) — считаем его 16:9
const PARTY_AR = innerWidth > 0 && innerHeight > 0 ? innerWidth / innerHeight : 16 / 9;
const PARTY_WIDE = !!PARTY && PARTY_AR > 1;
const RES_H = PARTY ? (PARTY_WIDE ? 270 : 320) : 270;
const RES_W = PARTY ? Math.max(120, Math.round(RES_H * PARTY_AR)) : 216;   // внутреннее "пиксельное" разрешение
const CAM_FOV = PARTY_WIDE ? 55 : 60;    // вертикальный угол обзора (чуть шире, чтобы по бокам меньше обрезалось)
const ROAD_WIDTH = 10;                   // асфальт
const SHOULDER = 2.5;                    // обочина с каждой стороны
const MAX_SPEED = 38, MAX_REVERSE = 8;   // м/с (~137 км/ч) — чтобы F и O набирали свои 130
const ACCEL = 5.5, BRAKE = 14, DRAG = 2;
const GAS_PRESS = 0.9, BRAKE_PRESS = 1.8; // 1/с — как быстро педаль доходит до пола
const GAS_RELEASE = 3;                    // 1/с — как быстро педаль отпускается
const HAND_DRAG = 0.8;                    // м/с² — ручник почти не тормозит, зато оставляет следы
// руль тугой, как у настоящего автобуса: колёса поворачиваются с ограниченной скоростью,
// а сам кузов набирает скорость поворота с инерцией
const MAX_STEER = 0.5, WHEELBASE = 5.7;
const STEER_RATE = 0.28;                 // рад/с — как быстро крутятся колёса под рукой
const STEER_RETURN = 0.4;                // рад/с — самовозврат руля, когда отпустил
const YAW_LAG = 0.45;                    // с — инерция кузова по курсу

// качание под музыку (данные из analyze_track.py -> track_data.js)
const AUDIO_LOOKAHEAD = 0.1;             // с — упреждение: задержка звука + кадры отрисовки
// Рендер дубля (index.html?render, запускает render.js): своего цикла нет, кадры шагает render.js,
// время трека и часы анимаций — от записанного дубля, случайность — с фиксированным зерном.
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) {
  let seed = 17;
  Math.random = () => {                                  // mulberry32
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clock = { track: null, now: null, day: undefined };   // при рендере — заданное время трека / часов (с) / суток (ч)
const SWAY_ROLL = 0.035;                 // рад — крен влево-вправо на долях
const KICK_HOP = 0.2;                    // м — подпрыгивание кузова на бочке
const BASS_LIFT = 0.05;                  // м — лёгкий подъём от общего баса

// ---------- Рендер ----------
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);     // прозрачная очистка — нужна слою "чётких" объектов

// ---------- Вывод кадра: пиксельный мир + (по выбору) чёткие объекты режима Y + фишай ----------

// а итоговый шейдер берёт его по пиксельной сетке RES_W×RES_H — ступеньки пикселей сохраняются.
// То, что обнажает режим Y, живёт в слое 1: либо дорисовывается в тот же пиксельный кадр,
// либо (галочка "чёткие") рисуется отдельно в полном разрешении с перекрытием сценой.
// Фишай — бочка: углы кадра на месте, центр раздувается; к обоим слоям одинаково.
const FISHEYE = 0.19;                    // сила бочки: 0 — выкл, 0.3 — заметно, 0.6 — сильно
const REVEAL_LAYER = 1;
const XRAY_PIXEL_DIV = 4;                // во сколько раз мельче пиксель мира в режимах Y/U
const lowRT = new THREE.WebGLRenderTarget(RES_W * 2, RES_H * 2,
  { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
const hiRT = new THREE.WebGLRenderTarget(RES_W, RES_H,
  { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
const FISH_ASPECT = RES_W / RES_H;
// Заголовок BROKEN (T): слой афиши 1_заголовок.png, пикселизован до 144×47 пикселей игры (2/3 ширины кадра),
// цвета свои. Рисуется при сведении кадра по пиксельной сетке игры 216×270, по центру. В Y/U — белый
// полупрозрачный, как реальные конструкции (в U к нему применяется тонкий контур реальных объектов).

const logoTex = new THREE.TextureLoader().load(LOGO_URI);
logoTex.magFilter = logoTex.minFilter = THREE.NearestFilter;
logoTex.generateMipmaps = false;
logoTex.flipY = false;                                // строка 0 — верх заголовка
const outScene = new THREE.Scene(), outCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const outMat = new THREE.ShaderMaterial({
  uniforms: {
    tLow: { value: lowRT.texture }, tHi: { value: hiRT.texture }, useHi: { value: 0 },
    k: { value: FISHEYE }, aspect: { value: FISH_ASPECT }, res: { value: new THREE.Vector2(RES_W, RES_H) },
    hiTexel: { value: new THREE.Vector2(1, 1) }, glowAmount: { value: 0.6 },
    tLogo: { value: logoTex }, showLogo: { value: 0 }, logoWhite: { value: 0 }, logoAlpha: { value: 1 },
  },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tLow, tHi, tLogo; uniform float useHi, k, aspect, glowAmount, showLogo, logoAlpha, logoWhite;
    uniform vec2 res, hiTexel; varying vec2 vUv;
    vec2 fish(vec2 uv) {
      vec2 p = (uv - 0.5) * vec2(aspect, 1.0);
      float r2 = dot(p, p) / (0.25 * (aspect * aspect + 1.0));   // 1 — в углу кадра
      vec2 q = p * (1.0 + k * (r2 - 1.0));                      // бочка: угол на месте, центр крупнее
      return q / vec2(aspect, 1.0) + 0.5;
    }
    void main() {
      vec2 uvq = (floor(vUv * res) + 0.5) / res;                // пиксельная сетка мира
      vec3 c = texture2D(tLow, fish(uvq)).rgb;
      // чёткий слой очищен прозрачным чёрным, поэтому его цвет уже умножен на прозрачность
      if (useHi > 0.5) {
        vec2 u = fish(vUv);
        vec4 h = texture2D(tHi, u);
        // свечение: средняя непрозрачность слоя на двух кольцах вокруг (3 и 6 px)
        vec3 g = vec3(0.0);                                        // свечение — цвета самой структуры
        for (int i = 0; i < 8; i++) {
          float an = float(i) * 0.785398;
          vec2 d = vec2(cos(an), sin(an)) * hiTexel;
          g += texture2D(tHi, u + d * 3.0).rgb + 0.6 * texture2D(tHi, u + d * 6.0).rgb;
        }
        g /= 12.8;
        c += g * glowAmount * (1.0 - h.a);
        c = c * (1.0 - h.a) + h.rgb;

function fishForward(u, v) {
  if (FISHEYE <= 0) return [u, v];
  const px = (u - 0.5) * FISH_ASPECT, py = v - 0.5, rs = Math.hypot(px, py);
  if (rs < 1e-6) return [u, v];
  const c2 = 0.25 * (FISH_ASPECT * FISH_ASPECT + 1), k = FISHEYE;
  let r = rs;                                        // решаем r * (1 + k (r²/c2 - 1)) = rs
  for (let i = 0; i < 8; i++) {
    const f = r * (1 + k * (r * r / c2 - 1)) - rs, df = 1 + k * (3 * r * r / c2 - 1);
    r -= f / df;
  }
  const s = r / rs;
  return [px * s / FISH_ASPECT + 0.5, py * s + 0.5];
}

// холмы едут вместе с камерой — всегда "на горизонте"; цвет — от неба (updateSky), низ — у земли под камерой
const hills = new THREE.Group();
const HILLS = [[1000, 55, '#c07a8a', '#f5a070', 1],        // дальние — в дымке
               [750, 38, '#7a4a5a', '#c07060', 4]];        // ближние — силуэты
for (const [r, h, top, bot, seed] of HILLS) hills.add(tagFill(hillRing(r, h, top, bot, seed), r > 800 ? XR_BLUE.far : XR_BLUE.near));
scene.add(hills);

// ---------- Дороги: сеть острова Самуи из tropicalgame ----------
// Кольцевая — главная («трасса»): от неё считаются кадры frames (отбойники, ЛЭП, жилы, станции), старт — на ней.
// Остальные дороги — такие же ленты; на развилках асфальт младшей дороги ныряет под полотно старшей.
// Земля под любой дорогой выровнена сборщиком острова и лежит на 12 см ниже полотна. Асфальт и обочины — прежние.
const curve = new THREE.CatmullRomCurve3(IS.ring.map(([x, z, y]) => new THREE.Vector3(x, y, z)), true, 'centripetal');
curve.arcLengthDivisions = IS.ring.length * 4;
const TRACK_LEN = curve.getLength();
const SEG = Math.round(TRACK_LEN / 4);
// кадры вдоль дороги: точка (с высотой) + единичный горизонтальный вектор "вправо" + путь от начала
function roadFrames(c, n) {
  const fr = [], len = c.getLength();
  for (let i = 0; i <= n; i++) {
    const t = i / n, p = c.getPointAt(t), tan = c.getTangentAt(t);
    fr.push({ p, side: new THREE.Vector3(-tan.z, 0, tan.x).normalize(), dist: t * len });
  }
  return fr;
}
const frames = roadFrames(curve, SEG);

// лента вдоль дороги fr между смещениями offL..offR на y выше полотна; drape — внешний край (offR) ложится на землю;
// opt.keep(i) — рисовать ли отрезок между кадрами i и i+1; opt.yAt(x, z) — своя высота вершины (null — обычная)
function ribbon(fr, offL, offR, y, material, vLen, drape = false, opt = {}) {
  const pos = [], uv = [], idx = [], { keep = null, yAt = null } = opt;
  fr.forEach(({ p, side, dist }, i) => {
    const xl = p.x + side.x * offL, zl = p.z + side.z * offL, xr = p.x + side.x * offR, zr = p.z + side.z * offR;
    const yl = yAt ? yAt(xl, zl) : null, yr = yAt ? yAt(xr, zr) : null;
    pos.push(xl, yl !== null ? yl : p.y + y, zl, xr, yr !== null ? yr : (drape ? groundY(xr, zr) : p.y) + y, zr);
    uv.push(0, dist / vLen, 1, dist / vLen);
    if (i < fr.length - 1 && (!keep || keep(i))) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  });
  return meshFrom(pos, uv, idx, material);
}
// вертикальная лента (отбойник) вдоль кольцевой на смещении off, от y0 до y1 над полотном
function wall(off, y0, y1, material, keep) {
  const pos = [], uv = [], idx = [];
  frames.forEach(({ p, side, dist }, i) => {
    const x = p.x + side.x * off, z = p.z + side.z * off;
    pos.push(x, p.y + y0, z, x, p.y + y1, z);
    uv.push(dist / 4, 0, dist / 4, 1);
    if (i < SEG && keep(i)) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
  });
  return meshFrom(pos, uv, idx, material);
}
function meshFrom(pos, uv, idx, material) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, material);
}
// столбики вдоль кольцевой с шагом step (на земле под ними); skip(x, z) — здесь не ставить
function posts(off, step, geo, color, y, skip) {
  const count = Math.floor(TRACK_LEN / step), mats = [];
  const d = new THREE.Object3D();
  for (let i = 0; i < count; i++) {
    const t = i / count, p = curve.getPointAt(t), tan = curve.getTangentAt(t);
    const x = p.x - tan.z * off, z = p.z + tan.x * off;
    if (skip(x, z)) continue;
    d.position.set(x, Math.max(p.y, groundY(x, z)) + y, z);
    d.rotation.y = Math.atan2(tan.x, tan.z);
    d.updateMatrix();
    mats.push(d.matrix.clone());
  }
  const mesh = new THREE.InstancedMesh(geo, lambert({ color }), mats.length);
  mats.forEach((m, i) => mesh.setMatrixAt(i, m));
  return mesh;
}

// асфальт: белые края, белая прерывистая по центру
const roadTex = pixelTexture(64, 32, (g, w, h) => {
  g.fillStyle = '#6a6c6e'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, ['#5f6163', '#727476', '#646668'], 240);
  g.fillStyle = '#e6e6e2';
  g.fillRect(2, 0, 1, h); g.fillRect(w - 3, 0, 1, h);   // сплошные края
  g.fillRect(31, 0, 1, 8);                              // короткий штрих по центру
});
const gravelTex = pixelTexture(16, 16, (g, w, h) => {
  g.fillStyle = '#b3a891'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, ['#9f9580', '#c2b8a2', '#8e8574'], 60);
});
const railTex = pixelTexture(8, 4, (g, w, h) => {
  g.fillStyle = '#c3c8cd'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#e4e8ec'; g.fillRect(0, 1, w, 1);
  g.fillStyle = '#8f959b'; g.fillRect(0, 3, w, 1);
});
const halfR = ROAD_WIDTH / 2, halfS = halfR + SHOULDER;
const ROAD_MAT = lambert({ map: roadTex, side: THREE.DoubleSide }), SHOULDER_MAT = lambert({ map: gravelTex, side: THREE.DoubleSide });

// все дороги: { fr — кадры, len, ring — замкнута, lift — высота покрытия над осью, half — полуширина с обочинами }.
// Чем меньше номер, тем дорога старше: кольцевая — нулевая. Торцы прочих продлены на 4 м: на развилке полотно
// старшей дороги накрывает весь стык, младшие уходят под него.
const roads = [{ fr: frames, len: TRACK_LEN, lift: 0.04, ring: true, half: halfS }];
for (const rd of IS.roads) {
  const pts = rd.pts.map(([x, z, y]) => new THREE.Vector3(x, y, z)), n = pts.length;
  const beyond = (a, b) => a.clone().add(a.clone().sub(b).setY(0).normalize().multiplyScalar(4));
  const c = new THREE.CatmullRomCurve3([beyond(pts[0], pts[1]), ...pts, beyond(pts[n - 1], pts[n - 2])], false, 'centripetal');
  c.arcLengthDivisions = rd.pts.length * 4;
  const len = c.getLength();
  roads.push({ fr: roadFrames(c, Math.max(2, Math.round(len / 4))), len, lift: 0.034, ring: false, half: halfS, id: rd.id });
}
// поиск ближайшей дороги: кадры всех дорог разложены по клеткам ROAD_CELL м
const ROAD_CELL = 40, roadCells = new Map(), roadKey = (cx, cz) => (cx + 32768) * 65536 + cz + 32768;
roads.forEach((R, r) => R.fr.forEach((f, i) => {
  const key = roadKey(Math.floor(f.p.x / ROAD_CELL), Math.floor(f.p.z / ROAD_CELL));
  if (!roadCells.has(key)) roadCells.set(key, []);
  roadCells.get(key).push(r, i);
}));
// ближайшая дорога к точке: { d — расстояние до оси, y — высота оси там, road, end — точка за торцом дороги };
// дальше ROAD_CELL м — null. below — искать только среди дорог старше этого номера; skip — эту дорогу не считать
const _roadHit = { d: 0, y: 0, road: null, end: false };
function roadAt(x, z, below = Infinity, skip = -1) {
  const cx = Math.floor(x / ROAD_CELL), cz = Math.floor(z / ROAD_CELL);
  let best = Infinity, br = -1, bi = -1;
  for (let ax = cx - 1; ax <= cx + 1; ax++) for (let az = cz - 1; az <= cz + 1; az++) {
    const cell = roadCells.get(roadKey(ax, az));
    if (!cell) continue;
    for (let k = 0; k < cell.length; k += 2) {
      if (cell[k] >= below || cell[k] === skip) continue;
      const p = roads[cell[k]].fr[cell[k + 1]].p, d = (p.x - x) ** 2 + (p.z - z) ** 2;
      if (d < best) { best = d; br = cell[k]; bi = cell[k + 1]; }
    }
  }
  if (br < 0) return null;
  const fr = roads[br].fr, n = fr.length - 1, ring = roads[br].ring;   // уточнение: проекция на два соседних отрезка оси
  let d = Infinity, y = 0, end = false;
  for (const j of [bi - 1, bi]) {
    const ja = ring ? (j + n) % n : Math.max(0, Math.min(n - 1, j)), a = fr[ja].p, b = fr[ja + 1].p;
    const wx = b.x - a.x, wz = b.z - a.z, tr = ((x - a.x) * wx + (z - a.z) * wz) / (wx * wx + wz * wz || 1), t = Math.max(0, Math.min(1, tr));
    const dd = Math.hypot(x - (a.x + wx * t), z - (a.z + wz * t));
    if (dd < d) { d = dd; y = a.y + (b.y - a.y) * t; end = !ring && ((ja === 0 && tr < 0) || (ja === n - 1 && tr > 1)); }
  }
  _roadHit.d = d; _roadHit.y = y; _roadHit.road = roads[br]; _roadHit.end = end;
  return _roadHit;
}
// высота поверхности под колесом: на дороге — полотно, у края — плавный спуск к земле, дальше — земля
function surfaceY(x, z) {
  const g = groundY(x, z), h = roadAt(x, z);
  if (!h || h.d > h.road.half + 5) return g;
  const top = h.y + h.road.lift - 0.01, edge = h.road.half - 0.5;
  return h.d < edge ? top : top + (g - top) * (h.d - edge) / 5.5;
}
// полотно и обочины каждой дороги. Асфальт младшей дороги ныряет под полотно старшей; обочина не ложится туда,
// где под ней чужой асфальт.
function layRoad(r) {
  const { fr, lift } = roads[r];
  const onOther = (x, z) => { const h = roadAt(x, z, Infinity, r); return h && !h.end && h.d < halfR + 0.4; };
  const free = fr.map(({ p, side }) => [-1, 1].map((sd) => ![halfR + 0.3, (halfR + halfS) / 2, halfS].some(o => onOther(p.x + side.x * o * sd, p.z + side.z * o * sd))));
  const dive = (x, z) => { const h = roadAt(x, z, r); return h && !h.end && h.d < halfR - 0.2 ? h.y + h.road.lift - 0.06 : null; };
  scene.add(tagFill(ribbon(fr, -halfS, -(halfR - 0.3), lift - 0.02, SHOULDER_MAT, 4, false, { keep: (i) => free[i][0] && free[i + 1][0] }), XR_BLUE.shoulder));
  scene.add(tagFill(ribbon(fr, halfR - 0.3, halfS, lift - 0.02, SHOULDER_MAT, 4, false, { keep: (i) => free[i][1] && free[i + 1][1] }), XR_BLUE.shoulder));
  scene.add(tagFill(ribbon(fr, -halfR, halfR, lift, ROAD_MAT, 12, false, r ? { yAt: dive } : {}), XR_BLUE.road));
}
roads.forEach((_, r) => layRoad(r));

// отбойники и забор — вдоль кольцевой с обеих сторон; на примыканиях других дорог — разрыв
const railMat = lambert({ map: railTex, side: THREE.DoubleSide });
const postGeo = new THREE.BoxGeometry(0.15, 0.8, 0.15);
const nearSideRoad = (x, z, lim) => { const h = roadAt(x, z, Infinity, 0); return !!h && !h.end && h.d < lim; };
for (const s of [-1, 1]) {
  const off = s * (halfS - 0.4);
  const gap = frames.map(({ p, side }) => nearSideRoad(p.x + side.x * off, p.z + side.z * off, halfS + 6));
  scene.add(wall(off, 0.5, 0.85, railMat, (i) => !gap[i] && !gap[i + 1]));
  scene.add(posts(off + s * 0.1, 4, postGeo, 0x8d9297, 0.4, (x, z) => nearSideRoad(x, z, halfS + 6)));
  scene.add(posts(s * (halfS + 14), 7, new THREE.BoxGeometry(0.1, 1.3, 0.1), 0xd4d2c8, 0.65, (x, z) => nearSideRoad(x, z, halfS + 4) || (roadAt(x, z, 1) || { d: 99 }).d < halfS + 2));   // забор
}

// ---------- ЛЭП ----------
// Решётчатая опора в локальных координатах: X — поперёк линии (траверса), Z — вдоль линии.
// Опора собирается из балок; все балки всех опор — один InstancedMesh (один draw call).
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
// Пропорции опоры (в условных единицах до масштаба TOWER_SCALE_Y): длинная сужающаяся пирамида
// до "талии", сверху — расширяющийся "бокал" до траверсы и рожки грозотроса.
// Соотношение частей по высоте: пирамида : бокал : рожки = 65 : 32 : 13.
const TW_PARTS = [65, 32, 13];
const TW_SUM = TW_PARTS[0] + TW_PARTS[1] + TW_PARTS[2];
const TW_TOP = 31;                                     // верх рожков (вся высота)
const TW_WAIST = TW_TOP * TW_PARTS[0] / TW_SUM;        // талия
const TW_ARM = TW_TOP * (TW_PARTS[0] + TW_PARTS[1]) / TW_SUM;   // траверса
const TW_INS = 2.5 * (TW_TOP - TW_WAIST) / 15;               // длина гирлянды изоляторов
function towerBeams() {
  const beams = [];                                   // [a, b, толщина]
  const add = (a, b, t = 0.2) => beams.push([a, b, t]);
  // нижняя пирамида: 4 ноги от базы (±4) к талии (±1.5), 6 ярусов связей
  const LV = 6, half = y => 4 - (2.5 * y) / TW_WAIST;
  const lv = Array.from({ length: LV + 1 }, (_, i) => (TW_WAIST * i) / LV);
  const corners = y => { const s = half(y); return [V3(-s, y, -s), V3(s, y, -s), V3(s, y, s), V3(-s, y, s)]; };
  for (let c = 0; c < 4; c++) add(corners(0)[c], corners(TW_WAIST)[c], 0.4);
  for (let i = 0; i < lv.length - 1; i++) {
    const A = corners(lv[i]), B = corners(lv[i + 1]);
    for (let c = 0; c < 4; c++) {
      const n = (c + 1) % 4;
      add(A[c], A[n]);                                 // пояс
      add(A[c], B[n]); add(A[n], B[c]);                // крест
    }
  }
  // V-образный "бокал": от талии расходится к траверсе
  const W = TW_WAIST, A2 = TW_ARM, MID = (W + A2) / 2;
  for (const sx of [-1, 1]) {
    for (const sz of [-1, 1]) add(V3(sx * 1.5, W, sz * 1.5), V3(sx * 6, A2, sz * 1.2), 0.3);
    add(V3(sx * 1.5, W, -1.5), V3(sx * 6, A2, 1.2)); add(V3(sx * 1.5, W, 1.5), V3(sx * 6, A2, -1.2));
    add(V3(sx * 3.75, MID, -1.35), V3(sx * 3.75, MID, 1.35));
    // рожки для грозотроса
    add(V3(sx * 6, A2, 0), V3(sx * 8, TW_TOP, 0), 0.25);
    add(V3(sx * 10, A2, 0), V3(sx * 8, TW_TOP, 0), 0.15);
    // гирлянды изоляторов
    add(V3(sx * 9, A2, 0), V3(sx * 9, A2 - TW_INS, 0), 0.15);
  }
  add(V3(0, A2, 0), V3(0, A2 - TW_INS, 0), 0.15);
  // траверса: две продольные балки + решётка
  for (const sz of [-1.2, 1.2]) add(V3(-11, A2, sz), V3(11, A2, sz), 0.35);
  for (let x = -11; x < 11; x += 2) add(V3(x, A2, -1.2), V3(x + 2, A2, 1.2), 0.12);
  return beams;
}
// точки подвеса: 3 фазы + 2 грозотроса
const WIRE_POINTS = [V3(-9, TW_ARM - TW_INS, 0), V3(0, TW_ARM - TW_INS, 0), V3(9, TW_ARM - TW_INS, 0),
                     V3(-8, TW_TOP, 0), V3(8, TW_TOP, 0)];

// линия идёт вдоль кольцевой по внешней стороне (к краю острова)
const TOWER_SCALE_Y = 1.82;              // опоры выше в 1.82 раза (1.4 × 1.3; провода подвешены к ним же)
const LINE_OFFSET = 34;                                // от оси дороги (м), + = справа по ходу
const TOWER_STEP = 85;                                 // шаг опор вдоль трассы (м)

const POWER_TOWERS = [];                 // матрицы опор (для жил)
let pulseWires = null;                   // провода с импульсами тока (режим Y)
function buildPowerLines() {
  const beams = towerBeams();
  const list = [], count = Math.round(TRACK_LEN / TOWER_STEP);
  for (let k = 0; k < count; k++) {
    // опора стоит на земле; попала на другую дорогу — сдвигается вдоль линии, пока не встанет рядом
    let t = k / count, p, tan, x, z;
    for (let tries = 0; tries < 8; tries++, t += 6 / TRACK_LEN) {
      p = curve.getPointAt(t % 1); tan = curve.getTangentAt(t % 1);
      x = p.x - tan.z * LINE_OFFSET; z = p.z + tan.x * LINE_OFFSET;
      const h = roadAt(x, z);
      if (!h || h.end || h.d > halfS + 6) break;
    }
    const q = new THREE.Quaternion().setFromAxisAngle(V3(0, 1, 0), Math.atan2(tan.x, tan.z));
    list.push(new THREE.Matrix4().compose(V3(x, groundY(x, z) - 0.3, z), q, V3(1, TOWER_SCALE_Y, 1)));
  }
  list.push(list[0]);                                  // замыкаем провода по кругу
  const towerMats = [list];

  // опоры
  const all = list.slice(0, -1);
  POWER_TOWERS.push(...all);
  const mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), lambert({ color: 0x1e161c }), all.length * beams.length);
  const up = V3(0, 1, 0), m = new THREE.Matrix4();
  let i = 0;
  for (const T of all) for (const [a, b, t] of beams) {
    const dir = b.clone().sub(a), l = dir.length();
    m.compose(a.clone().add(b).multiplyScalar(0.5), new THREE.Quaternion().setFromUnitVectors(up, dir.normalize()), V3(t, l, t));
    mesh.setMatrixAt(i++, m.premultiply(T));
  }
  scene.add(mesh);

  // провода: парабола с провисом между соседними опорами
  const SAG = 4, STEPS = 16, pts = [];
  for (const list of towerMats) for (let k = 0; k < list.length - 1; k++) {
    for (const wp of WIRE_POINTS) {
      const A = wp.clone().applyMatrix4(list[k]), B = wp.clone().applyMatrix4(list[k + 1]);
      for (let j = 0; j < STEPS; j++) {
        for (const u of [j / STEPS, (j + 1) / STEPS]) {
          const p = A.clone().lerp(B, u);
          p.y -= SAG * 4 * u * (1 - u);
          pts.push(p.x, p.y, p.z);
        }
      }
    }
  }
  const wgeo = new THREE.BufferGeometry();
  wgeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const wires = new THREE.LineSegments(wgeo, new THREE.LineBasicMaterial({ color: 0x2a1a22 }));
  scene.add(wires);

  // импульсы тока: те же нити с путём вдоль каждой (aDist); рисуются только бегущие чёрточки
  const dist = [];
  for (let i = 0; i < pts.length; i += 6) {
    const seg = i / 6;                                         // номер отрезка
    const j = seg % STEPS;                                     // отрезок внутри пролёта
    const w = Math.floor(seg / STEPS) % WIRE_POINTS.length;    // номер нити
    const k = Math.floor(seg / STEPS / WIRE_POINTS.length);    // номер пролёта
    const base = (k + j / STEPS) * TOWER_STEP + w * 37;        // сдвиг, чтобы нити мигали вразнобой
    dist.push(base, base + TOWER_STEP / STEPS);
  }
  const pgeo = new THREE.BufferGeometry();
  pgeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  pgeo.setAttribute('aDist', new THREE.Float32BufferAttribute(dist, 1));
  pulseWires = new THREE.LineSegments(pgeo, WIRE_PULSE_MAT);
  pulseWires.visible = false;
  pulseWires.layers.set(REVEAL_LAYER);
  pulseWires.userData.xrSkip = true;
  scene.add(pulseWires);
}
buildPowerLines();

// ---------- Локаторы ----------
// Слева от кольцевой — две огороженные территории с параболическими антеннами на пирамидальных опорах, дорожками,
// аппаратной, контейнерами, фонарями, воротами и подъездом. Места — из данных острова (ровные площадки у дороги).
// Станции разные (вторая — из tropicalgame): у первой три одинаковые тарелки и серая мачта, у второй четыре тарелки
// разного размера и красно-белая вышка связи с мигающими огнями.
// Координаты объекта: u — вдоль дороги, v — влево от оси дороги (метры).
const SITE = { u0: -55, u1: 55, v0: 40, v1: 110, gate: 4 };
// dishes — антенны: u, v, азимут°, угол места°, размер (1 — тарелка ⌀16 м); house — аппаратная; boxes — контейнеры

  for (const [dx, dz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) bx(1.1, 0.6, 1.1, lambert({ color: 0xa6a39a }), dx * B0, 0.3, dz * B0);   // башмаки
  bx(2.4, 2.3, 1.6, lambert({ color: 0xe4e2da }), 6.2, 1.15, -1.5); bx(1.2, 2.6, 1.2, lambert({ color: 0xe4e2da }), -6.0, 1.3, 0.5);   // шкафы

function scoopBin(W, H, D) {

    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y, z); m.rotation.x = rx; g.add(m);
  };
  for (const sx of [-1, 1]) plank(T, H, D, dark, sx * (W - T) / 2, H / 2, 0);   // боковины
  plank(W, T, D, wood, 0, H - T / 2, 0);                                        // крыша
  plank(W, T, D, dark, 0, T / 2, 0);                                            // дно
  plank(W - 2 * T, H, T, inner, 0, H / 2, -D / 2 + T / 2);                      // задняя стенка
  const R = Math.min(D, H) * 0.85, cz = -D / 2 + R, cy = T;                     // дека: 6 досок по дуге
  for (let i = 0; i < 6; i++) {
    const a0 = (i / 6) * Math.PI / 2, a1 = ((i + 1) / 6) * Math.PI / 2, am = (a0 + a1) / 2;
    const len = 2 * R * Math.sin((a1 - a0) / 2) + 0.02;
    plank(W - 2 * T, T, len, i % 2 ? wood : lambert({ color: WOOD_LIGHT }),
      0, cy + R - R * Math.cos(am), cz - R * Math.sin(am), am);   // доска по касательной к дуге
  }
  plank(W - 2 * T, H - R - 2 * T, 0.08, inner, 0, R + T + (H - R - 2 * T) / 2, -D / 2 + 0.15);   // горло
  const c = new THREE.Mesh(new THREE.CircleGeometry(Math.min(0.3, (H - R) * 0.4), 12), lambert({ color: CONE }));
  c.position.set(0, R + T + (H - R - 2 * T) / 2, -D / 2 + 0.2); g.add(c);
  return g;
}

// Инверсия цветов обычных материалов (вариант автобуса в режиме U): текстура/цвет -> 1 - c, без освещения
function invertMat(src, invert = true) {
  const map = src.map || null;
  if (map) map.updateMatrix();
  return new THREE.ShaderMaterial({
    uniforms: {
      map: { value: map }, useMap: { value: map ? 1 : 0 }, uvTransform: { value: map ? map.matrix : new THREE.Matrix3() },
      baseColor: { value: (src.color || new THREE.Color(1, 1, 1)).clone() },
    },

    box(0.12, 0.12, 0.12, 0xd0d0cc, -0.9, BUS_Y0 + BUS_H + 0.15, 5.2),           // маячки на крыше

function buildBusXray() {

  // каркас: стойки между окнами, дуги крыши, продольные пояса

    for (const s of [-1, 1]) g.add(xrayBox(T, BUS_H, T, s * hw, y0 + BUS_H / 2, z));

  g.add(xrayBox(0.05, 0.05, 1.9, 0, 0.6, 3.35));

  let nod = 0;
  if (TD && musicOn()) {
    const t = trackNow(), bi = lastBefore(TD.beats, t);
    if (bi >= 0) nod = Math.exp(-(t - TD.beats[bi][0]) / 0.14) * Math.min(1, TD.beats[bi][1] + 0.3);
  }
  // иногда чешет нос: раз в 8–20 с, ~1.5 с
  if (pax.scratchLeft > 0) pax.scratchLeft -= dt;

  const key = drop + '|' + scratch + '|' + rub;
  if (key !== pax.key) { pax.key = key; drawPassenger(drop, scratch, rub); }
  // скелет
  if (passengerRig) {
    const { head, upper, fore } = passengerRig;
    head.rotation.x = -0.35 * nod;                                            // кивок
    const k = scratch ? 1 : 0;
    upper.rotation.x += ((k ? -1.35 : 0) - upper.rotation.x) * Math.min(1, dt * 10);
    upper.rotation.z += ((k ? 0.35 : 0) - upper.rotation.z) * Math.min(1, dt * 10);
    fore.rotation.x += ((k ? -1.55 + (rub ? 0.15 : -0.15) : 0) - fore.rotation.x) * Math.min(1, dt * 14);
  }
}

function setCar(id) {

    const m = CAR.model = CAR.build();
    m.updateMatrixWorld(true);
    const bb = new THREE.Box3().setFromObject(m), fw = m.userData.frontWheels[0].position;
    const rear = m.userData.spin.map(w => w.parent.position).find(q => q.z > 0) || fw;
    Object.assign(CAR, { front: -bb.min.z, rear: bb.max.z, top: bb.max.y, axle: Math.abs(fw.z), track: Math.abs(fw.x), trackRear: Math.abs(rear.x), wheelR: fw.y });

// Кольцевой буфер квадов под задними колёсами; старые следы перезаписываются новыми.
const SKID_MAX = 4000, SKID_W = 0.3;
const skidPos = new Float32Array(SKID_MAX * 4 * 3);
const skidIdx = [];
for (let i = 0; i < SKID_MAX; i++) { const b = i * 4; skidIdx.push(b, b + 2, b + 1, b + 1, b + 2, b + 3); }
const skidGeo = new THREE.BufferGeometry();
skidGeo.setAttribute('position', new THREE.BufferAttribute(skidPos, 3));
skidGeo.setIndex(skidIdx);
const skidMesh = new THREE.Mesh(skidGeo, new THREE.MeshBasicMaterial({
  color: 0x1c1616, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide }));
skidMesh.userData.xr = new THREE.MeshBasicMaterial({
  color: 0x9ab8ff, transparent: true, opacity: 0.5, depthWrite: false, side: THREE.DoubleSide });
skidMesh.frustumCulled = false;                    // буфер заполняется на лету
scene.add(skidMesh);

let skidNext = 0;
const REAR_WHEELS = [[-1.05, 2.4], [1.05, 2.4]];   // локальные x, z задних колёс автобуса
const skidLast = [null, null];
function updateSkids(on) {
  const c = Math.cos(car.heading), s = Math.sin(car.heading);
  const rear = CAR.bus ? REAR_WHEELS : [[-CAR.trackRear, CAR.axle], [CAR.trackRear, CAR.axle]];   // у машин — с модели
  rear.forEach(([lx, lz], w) => {
    if (!on) { skidLast[w] = null; return; }
    const x = car.x + lx * c + lz * s, z = car.z - lx * s + lz * c;
    const prev = skidLast[w];
    if (prev) {
      const dx = x - prev[0], dz = z - prev[1], len = Math.hypot(dx, dz);
      if (len < 0.05) return;
      const nx = (-dz / len) * SKID_W / 2, nz = (dx / len) * SKID_W / 2, y0 = prev[2], y = surfaceY(x, z) + 0.04;   // след лежит на поверхности
      skidPos.set([prev[0] - nx, y0, prev[1] - nz, prev[0] + nx, y0, prev[1] + nz,
                   x - nx, y, z - nz, x + nx, y, z + nz], skidNext * 12);
      skidNext = (skidNext + 1) % SKID_MAX;
      skidGeo.attributes.position.needsUpdate = true;
    }
    skidLast[w] = [x, z, surfaceY(x, z) + 0.04];
  });
}

// ---------- Фары (из tropicalgame) ----------
// Свет фар ночью: два луча-трапеции от фар. Лучи чуть сведены — пересекаются перед машиной — и плавно тают вдали.
// Свет лежит на поверхности: ряды вершин каждый кадр ставятся по рельефу под ними. Загораются, как только солнце село.
const BEAM = { len: 62, rows: 18, near: 0.5, far: 9, toe: 0.085, lamp: 0.52, lift: 0.14 };   // м; near/far — полуширина у фары и в конце; toe — рад
const headGlowTex = pixelTexture(16, 64, (g, w, h) => {
  const img = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const d = 1 - y / (h - 1), e = 1 - Math.abs((x + 0.5) / w * 2 - 1);      // d: 0 — у фары, 1 — в конце луча; e: 0 — край, 1 — ось
    const a = Math.pow(1 - d, 1.25) * Math.min(1, e * 3) * (0.45 + 0.55 * Math.min(1, d * 12));
    img.data.set([255, 232, 170, Math.round(255 * a)], (y * w + x) * 4);
  }
  g.putImageData(img, 0, 0);
});
headGlowTex.magFilter = headGlowTex.minFilter = THREE.LinearFilter;          // свет — без ступенек
const headGlow = (() => {
  const n = (BEAM.rows + 1) * 2, uv = [], idx = [];
  for (let b = 0; b < 2; b++) for (let j = 0; j <= BEAM.rows; j++) {
    const t = Math.pow(j / BEAM.rows, 1.5);                                  // у фары ряды чаще
    uv.push(0, t, 1, t);
    if (j < BEAM.rows) { const a = b * n + j * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 2 * 3), 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: headGlowTex, blending: THREE.AdditiveBlending, transparent: true,
    depthWrite: false, fog: false, opacity: 0, side: THREE.DoubleSide }));
  m.frustumCulled = false; m.visible = false;
  m.userData.xrSkip = true;                                                  // в Y/U фар нет (updateSky прячет)
  return m;
})();
scene.add(headGlow);
function updateBeams() {
  const pos = headGlow.geometry.attributes.position, fx = -Math.sin(car.heading), fz = -Math.cos(car.heading);
  const front = CAR.bus ? BUS_L / 2 : CAR.front, lamp = CAR.bus ? 0.9 : CAR.lamp || BEAM.lamp;
  let i = 0;
  for (const sd of [-1, 1]) {
    const a = car.heading + sd * BEAM.toe, dx = -Math.sin(a), dz = -Math.cos(a);   // левый луч смотрит чуть вправо, правый — чуть влево
    const ox = car.x + fx * (front - 0.15) + Math.cos(car.heading) * sd * lamp;
    const oz = car.z + fz * (front - 0.15) - Math.sin(car.heading) * sd * lamp;
    for (let j = 0; j <= BEAM.rows; j++) {
      const t = Math.pow(j / BEAM.rows, 1.5), d = t * BEAM.len, hw = BEAM.near + (BEAM.far - BEAM.near) * t;
      for (const e of [-1, 1]) {
        const x = ox + dx * d - dz * e * hw, z = oz + dz * d + dx * e * hw;
        pos.setXYZ(i++, x, surfaceY(x, z) + BEAM.lift, z);
      }
    }
  }
  pos.needsUpdate = true;
}

// огибающая баса, сглаженная вперёд-назад (без сдвига по времени)
const bassEnv = (() => {
  if (!TD) return null;
  const a = TD.bass.map(v => v / 99), k = 0.25;
  for (let i = 1; i < a.length; i++) a[i] += (a[i - 1] - a[i]) * (1 - k);
  for (let i = a.length - 2; i >= 0; i--) a[i] += (a[i + 1] - a[i]) * (1 - k);

// индекс последнего события с временем <= t (бинарный поиск по [[t, сила], ...])
function lastBefore(list, t) {

  while (lo <= hi) { const m = (lo + hi) >> 1; if (list[m][0] <= t) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}

// крен/проседание кузова от музыки в момент t
function musicPose(t) {
  const pose = { roll: 0, y: 0, pitch: 0 };
  if (!TD || !musicOn()) return pose;
  // крен: маятник с крайними точками на долях, сторона чередуется
  const bi = lastBefore(TD.beats, t);
  if (bi >= 0 && bi < TD.beats.length - 1) {
    const [b0, s0] = TD.beats[bi], [b1, s1] = TD.beats[bi + 1];
    const u = (t - b0) / (b1 - b0);
    const s = s0 + (s1 - s0) * u;                    // сила доли, плавно между долями
    pose.roll = SWAY_ROLL * Math.min(1, s) * Math.cos(Math.PI * (bi + u));
  }
  // бочка: кузов подпрыгивает и мягко садится с затухающим отскоком
  for (let i = lastBefore(TD.kicks, t); i >= 0 && t - TD.kicks[i][0] < 0.6; i--) {
    const d = t - TD.kicks[i][0], s = TD.kicks[i][1];
    const r = Math.exp(-d / 0.14) * Math.cos(d * 16);
    pose.y += KICK_HOP * s * r;
    pose.pitch += 0.008 * s * r;                      // нос подлетает чуть выше кормы
  }
  pose.y += BASS_LIFT * (bassEnv[Math.min(bassEnv.length - 1, Math.floor(t * TD.fps))] || 0);
  return pose;
}

// перемотка: Q/E — ±5 с (с Shift ±30 с), 1..9/0 — к 10..90% / в начало, P — пауза
function seekMusic(t) {
  if (!isFinite(music.duration)) return;
  music.currentTime = Math.max(0, Math.min(music.duration - 0.1, t));
}
function musicKeys(e) {
  const step = e.shiftKey ? 30 : 5;
  if (e.code === 'KeyQ') seekMusic(music.currentTime - step);
  else if (e.code === 'KeyE') seekMusic(music.currentTime + step);
  else if (/^Digit\d$/.test(e.code)) seekMusic(music.duration * Number(e.code[5]) / 10);
  else if (e.code === 'KeyP') { music.paused ? music.play().catch(() => {}) : music.pause(); return true; }
  return false;
}

function growGround(rnd, out, x, z, ang, w, maxSteps, f) {
  const offRoad = (px, pz) => Math.abs((px - f.p.x) * f.side.x + (pz - f.p.z) * f.side.z) > halfS + 0.3;
  const stack = [[x, z, ang, w, 0, maxSteps, 0, 0.07]];
  while (stack.length) {
    let [x0, z0, a, w0, d0, steps, depth, yStart] = stack.pop();
    const lift = liftFn(rnd, FLOOR_LIFT.field, d0, yStart);
    const pts = [[x0, z0, w0, d0, yStart]];
    for (let s = 0; s < steps; s++) {

function growSky(rnd, out, p, dir, dist, maxSteps, root) {
  const stack = [[p.clone(), dir.clone(), dist, maxSteps, 0]];
  const jitter = new THREE.Vector3();
  while (stack.length) {
    let [q, d, d0, steps, depth] = stack.pop();
    const segs = [], thick = [1, 0.6, 0.4][depth] || 0.3;
    for (let s = 0; s < steps; s++) {

      d.add(jitter).normalize();

// ---------- Камера сверху-сзади ----------
// Ракурс низкий (снизу вверх — вышки кажутся выше): 44% пути от прежнего обычного к полному низкому.
// Широкий объектив 200% (+30° к базовому углу → 90°).
// Дистанция 79%: между прежней (100%) и вплотную к корме (0%).
const CAM_NORMAL = { back: 14, up: 7, ahead: 8, lookY: 1.5 };
const CAM_LOW_FULL = { back: 12, up: 3.2, ahead: 30, lookY: 8.5 };
const LOW_AMOUNT = 0.44, WIDE_AMOUNT = 2.0, DIST_AMOUNT = 0.79;
const CAM_BACK_CLOSE = BUS_L / 2 + 1;    // "вплотную" — метр за задним бампером
const CAM_BUS = Object.fromEntries(Object.keys(CAM_NORMAL).map(k =>
  [k, CAM_NORMAL[k] + (CAM_LOW_FULL[k] - CAM_NORMAL[k]) * LOW_AMOUNT]));
CAM_BUS.back = CAM_BACK_CLOSE + (CAM_BUS.back - CAM_BACK_CLOSE) * DIST_AMOUNT;
// машины низкие и короткие — камера как в tropicalgame: та же схема от кормы жука, ближе и ниже в 0.6 раза
const CAM_CAR = Object.fromEntries(Object.keys(CAM_NORMAL).map(k =>
  [k, CAM_NORMAL[k] + (CAM_LOW_FULL[k] - CAM_NORMAL[k]) * LOW_AMOUNT]));
CAM_CAR.back = BEETLE_REAR + 1 + (CAM_CAR.back - BEETLE_REAR - 1) * DIST_AMOUNT;
for (const k of Object.keys(CAM_CAR)) CAM_CAR[k] *= 0.6;
const camCfg = { ...CAM_BUS };           // нынешняя камера: плавно переходит к камере выбранной машины
camera.fov = CAM_FOV + 15 * WIDE_AMOUNT;
camera.updateProjectionMatrix();
const CAR_START = { ...car };                            // стартовая точка дубля (R)

// Дистанция до автобуса всегда фиксирована; плавно догоняет только угол камеры.
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let camYaw = car.heading, camSlope = 0;
let camLookYaw = 0, camLookUp = 0, camLookSpin = 0;   // обзор (из tropicalgame): поворот и подъём камеры, докрутка при дожатом крае
function updateCamera(dt, snap) {
  // в заносе камера смотрит между носом и ходом — видно, как несёт боком
  let d = car.heading - 0.7 * Math.sin(car.slip) * Math.sign(car.speed) * Math.min(1, Math.abs(car.speed) / 4) - camYaw;
  d = Math.atan2(Math.sin(d), Math.cos(d));              // кратчайший угол
  camYaw += snap ? d : d * (1 - Math.exp(-4 * dt));
  const want = CAR.bus ? CAM_BUS : CAM_CAR, ck = snap ? 1 : 1 - Math.exp(-3 * dt);   // пересел — камера плавно подстраивается
  for (const key of Object.keys(camCfg)) camCfg[key] += (want[key] - camCfg[key]) * ck;
  // обзор — джойстик с глазом (touch.js) или мышь с зажатой правой кнопкой: камера обходит машину по кругу (до 180°
  // в обе стороны) и поднимается или опускается; дожал до края — ещё и медленно кружит; отпустил — плавно обратно.
  // Пока держишь B — тот же вид, но спереди: камера перед машиной, смотрит назад, на неё.
  const T = touchIn(), lk = 1 - Math.exp(-(snap ? 99 : 6) * dt);
  camLookSpin = T.lookSpin ? camLookSpin - T.lookSpin * 0.7 * dt : T.lookX ? camLookSpin : 0;
  const lookTo = -T.lookX * Math.PI + camLookSpin;
  if (T.lookX || T.lookSpin) camLookYaw += (lookTo - camLookYaw) * lk;                  // держат — угол без перескоков через ±180°
  else { camLookYaw = Math.atan2(Math.sin(camLookYaw), Math.cos(camLookYaw)); camLookYaw -= camLookYaw * lk; }   // отпустили — кратчайшим путём за машину
  camLookUp += (T.lookY - camLookUp) * lk;
  const fr = keys['KeyB'] ? -1 : 1, vy = camYaw + camLookYaw, fx = -Math.sin(vy) * fr, fz = -Math.cos(vy) * fr;
  const { back, ahead, lookY } = camCfg, up = camCfg.up * (1 + 1.4 * Math.max(0, -camLookUp)) * (1 - 0.65 * Math.max(0, camLookUp));   // вверх — выше над машиной, вниз — к земле
  camPos.set(car.x - fx * back, 0, car.z - fz * back);
  camPos.y = Math.max(car.y + up, groundY(camPos.x, camPos.z) + 1.2);   // не под землёй (склон позади)
  camSlope += (Math.sin(car.gPitch) - camSlope) * (snap ? 1 : 1 - Math.exp(-dt / 0.35));
  camLook.set(car.x + fx * ahead, car.y + lookY + camSlope * ahead * 0.8 * fr, car.z + fz * ahead);   // на подъёме взгляд идёт вверх по склону
  // обзор вниз после четверти хода ещё и задирает взгляд: на упоре — почти отвесно в небо (1.53 рад ≈ 88°)
  { const k0 = Math.max(0, Math.min(1, (camLookUp - 0.25) / 0.75)), k = k0 * k0 * (3 - 2 * k0);
    if (k > 0) {
      const hx = camLook.x - camPos.x, hz = camLook.z - camPos.z, hd = Math.hypot(hx, hz) || 1, base = Math.atan2(camLook.y - camPos.y, hd), a = base + (1.53 - base) * k;
      camLook.set(camPos.x + hx / hd * Math.cos(a) * 10, camPos.y + Math.sin(a) * 10, camPos.z + hz / hd * Math.cos(a) * 10);
    } }
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  hills.position.set(camPos.x, PLAIN_Y, camPos.z);     // холмы — на степи вокруг острова, едут с камерой
  placeSun(camPos);                      // небо, светила, звёзды — «на бесконечности»
}

// ---------- Контр-блики ----------
// Когда камера разворачивается к солнцу: общая засветка, ореол, горизонтальный луч
// и "призраки" объектива на линии солнце -> центр кадра (и дальше за центр).
const FAR_GHOST_ALPHA = 0.7;             // прозрачнее только призраки за центром кадра (4–6); 1 — как остальные
const GHOSTS = [   // [позиция на линии (0 — солнце, 1 — центр), радиус px, цвет, яркость, кольцо?]
  [0.35, 5, '255,220,120', 0.35], [0.6, 10, '255,120,90', 0.18], [0.85, 3, '255,255,200', 0.4],
  [1.25, 16, '190,120,255', 0.14], [1.5, 7, '120,255,180', 0.2], [1.9, 26, '255,150,80', 0.12, true],
];
const _sunNdc = new THREE.Vector3(), _view = new THREE.Vector3(), _toSun = new THREE.Vector3();
const _ray = new THREE.Raycaster(), _camLocal = new THREE.Vector3();
let flareVis = 1;                                    // 0..1: плавное гашение, когда солнце закрыто ангаром
function sunBlocked() {
  if (!airportGroup) return false;
  _camLocal.copy(camera.position); airportGroup.worldToLocal(_camLocal);
  const { u, v, R, HL } = HANGAR, cv = -_camLocal.z + AIRPORT_SHIFT;   // в координатах core
  if (Math.abs(_camLocal.x - u) < HL / 2 + 1 && Math.hypot(cv - v, _camLocal.y) < R + 1) return true;   // камера внутри ангара
  _ray.set(camera.position, _toSun.copy(sunGroup.position).sub(camera.position).normalize());
  _ray.far = 400;
  return _ray.intersectObjects(hangarBlockers, false).length > 0;              // стены между камерой и солнцем
}
// блайндеры на экране: тёплое сияние вокруг каждого + лёгкая засветка кадра, когда смотрят "в лицо".
// Без призраков и лучей. Стены ангара закрывают (сквозь проём ворот — видно).
const _bp = new THREE.Vector3(), _bf = new THREE.Vector3(), _bc = new THREE.Vector3(), _bn = new THREE.Vector3();
function drawBlinders() {
  if (worldXray || !blinders.length) return;
  const g = fx2d, W = RES_W, H = RES_H;
  let veil = 0;
  g.globalCompositeOperation = 'lighter';
  for (const b of blinders) {
    b.getWorldPosition(_bp); b.getWorldDirection(_bf);
    _bc.copy(camera.position).sub(_bp);
    const dist = _bc.length(), facing = Math.max(0, _bf.dot(_bc.normalize()));
    let I = Math.pow(facing, 6) * Math.max(0, 1 - dist / 160);
    if (I < 0.01) continue;
    _ray.set(camera.position, _bn.copy(_bp).sub(camera.position).normalize());
    _ray.far = dist - 1.5;
    if (_ray.intersectObjects(hangarBlockers, false).length) continue;   // стена ангара закрывает
    _sunNdc.copy(_bp).project(camera);
    if (_sunNdc.z > 1 || Math.abs(_sunNdc.x) > 1.3 || Math.abs(_sunNdc.y) > 1.3) continue;
    const [fu, fv] = fishForward((_sunNdc.x + 1) / 2, (1 - _sunNdc.y) / 2);
    const x = fu * W, y = fv * H, r = 6.4 + 22 * I;                         // между компактным и прежним (40% назад)
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(255,226,170,${0.66 * I})`); gr.addColorStop(0.44, `rgba(255,190,110,${0.27 * I})`);
    gr.addColorStop(1, 'rgba(255,150,70,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
    veil += I;
  }
  if (veil > 0) { g.fillStyle = `rgba(255,185,110,${Math.min(0.17, 0.052 * veil)})`; g.fillRect(0, 0, W, H); }
  g.globalCompositeOperation = 'source-over';
}
function drawFlare() {
  const W = RES_W, H = RES_H, g = fx2d;
  g.clearRect(0, 0, W, H);
  camera.getWorldDirection(_view);
  _toSun.copy(sunGroup.position).sub(camera.position).normalize();
  const cosA = _view.dot(_toSun);
  const lo = Math.cos(THREE.MathUtils.degToRad(32)), hi = Math.cos(THREE.MathUtils.degToRad(6));
  let I = Math.min(1, Math.max(0, (cosA - lo) / (hi - lo))) * skyNow.flare;   // солнце зашло — бликов нет
  I = I * I * (3 - 2 * I);                                   // smoothstep
  flareVis += ((sunBlocked() ? 0 : 1) - flareVis) * 0.15;
  I *= flareVis;
  if (I <= 0.01) return;

  _sunNdc.copy(sunGroup.position).project(camera);
  const [fu, fv] = fishForward((_sunNdc.x + 1) / 2, (1 - _sunNdc.y) / 2);   // с учётом фишая
  const sx = Math.round(fu * W), sy = Math.round(fv * H);
  g.globalCompositeOperation = 'lighter';

  g.fillStyle = `rgba(255,140,80,${0.22 * I})`;              // засветка всего кадра
  g.fillRect(0, 0, W, H);

  const glow = g.createRadialGradient(sx, sy, 0, sx, sy, 110);
  glow.addColorStop(0, `rgba(255,210,150,${0.7 * I})`); glow.addColorStop(1, 'rgba(255,120,60,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);

  const streak = g.createLinearGradient(sx - 220, 0, sx + 220, 0);   // анаморфный луч
  streak.addColorStop(0, 'rgba(255,160,90,0)'); streak.addColorStop(0.5, `rgba(255,220,170,${0.3 * I})`);
  streak.addColorStop(1, 'rgba(255,160,90,0)');
  g.fillStyle = streak; g.fillRect(sx - 220, sy, 440, 1);

  const vx = W / 2 - sx, vy = H / 2 - sy;
  for (const [t, r, rgb, a0, ring] of GHOSTS) {
    const a = t > 1 ? a0 * FAR_GHOST_ALPHA : a0;
    const x = Math.round(sx + vx * t), y = Math.round(sy + vy * t);
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
    if (ring) { g.strokeStyle = `rgba(${rgb},${a * I})`; g.lineWidth = 2; g.stroke(); }
    else { g.fillStyle = `rgba(${rgb},${a * I})`; g.fill(); }
  }
  g.globalCompositeOperation = 'source-over';
}

// ---------- Птицы ----------
// Изредка стайка пересекает небо впереди: силуэты машут крыльями и иногда планируют.
const BIRD_EVERY = [15, 40];             // с — пауза между стайками (случайно в диапазоне)
const BIRD_MAT = lambert({ color: 0x1e161c, side: THREE.DoubleSide, fog: false });   // силуэт не тонет в дымке
const flocks = [];
let nextFlock = 6;                       // первая стайка вскоре после старта

function makeBird() {
  const b = new THREE.Group();           // вперёд = +Z
  const mesh = (geo) => {                // во время режима Y — сразу белая; оригинал запомнен для возврата
    const m = new THREE.Mesh(geo, worldXray ? XR_WHITE : BIRD_MAT);
    m.userData.origMat = BIRD_MAT;
    return m;
  };
  b.add(mesh(new THREE.BoxGeometry(0.3, 0.2, 0.9)));
  const wings = [];
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group();
    const w = mesh(new THREE.BoxGeometry(1.4, 0.06, 0.5));
    w.position.x = s * 0.7;
    pivot.add(w); b.add(pivot); wings.push([pivot, s]);
  }
  b.userData = { wings, phase: Math.random() * 6.28, glide: Math.random() * 6.28, off: null };
  return b;
}
function spawnFlock() {
  const n = 3 + ((Math.random() * 5) | 0), side = Math.random() < 0.5 ? -1 : 1;
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
  // далеко впереди (на 110 км/ч успеем увидеть) и сразу за краем кадра
  const dist = 200 + Math.random() * 160, h = 25 + Math.random() * 35, speed = 10 + Math.random() * 5;
  const halfW = dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * RES_W / RES_H + 15;
  const flock = new THREE.Group();
  flock.position.set(camPos.x + fx * dist - rx * side * halfW, h, camPos.z + fz * dist - rz * side * halfW);
  const vx = rx * side * speed + fx * (Math.random() - 0.5) * 4, vz = rz * side * speed + fz * (Math.random() - 0.5) * 4;
  flock.rotation.y = Math.atan2(vx, vz);
  for (let i = 0; i < n; i++) {                        // рыхлый клин
    const b = makeBird(), row = Math.ceil(i / 2), s = i % 2 ? 1 : -1;
    b.userData.off = V3(s * row * (2.5 + Math.random() * 2), (Math.random() - 0.5) * 2, -row * (2.5 + Math.random() * 2));
    b.scale.setScalar(1.3 + Math.random() * 0.4);
    flock.add(b);
  }
  flocks.push({ g: flock, vx, vz, age: 0 });
  scene.add(flock);
}
function updateBirds(dt, time) {
  if ((nextFlock -= dt * (xrayMode === 'U' ? 2 : 1)) <= 0) {   // в режиме U стайки вдвое чаще
    spawnFlock();
    nextFlock = BIRD_EVERY[0] + Math.random() * (BIRD_EVERY[1] - BIRD_EVERY[0]);
  }
  for (let i = flocks.length - 1; i >= 0; i--) {
    const f = flocks[i];
    f.age += dt;
    f.g.position.x += f.vx * dt; f.g.position.z += f.vz * dt;
    for (const b of f.g.children) {
      const u = b.userData;
      const gliding = Math.sin(time * 0.6 + u.glide) > 0.55;      // иногда планирует
      const flap = gliding ? 0.12 : 0.15 + 0.55 * Math.sin(time * 9 + u.phase);
      for (const [pivot, s] of u.wings) pivot.rotation.z = s * flap;
      b.position.copy(u.off).setY(u.off.y + Math.sin(time * 1.3 + u.phase) * 0.4);
    }
    if (f.age > 45) { scene.remove(f.g); flocks.splice(i, 1); }
  }
}

// ---------- Дубль (R) ----------
// R — машина на стартовую точку (въезд в кадр), трек с MUSIC_START, пишутся нажатия и состояние по кадрам.
// Через TAKE_LEN с звук выключается, кадр замирает, дубль скачивается файлом take_<дата-время>.json
// (рендер из него — отдельно). Повторное R во время дубля — отмена без сохранения; R после конца — новый дубль.
// Машина в дубле — та, что выбрана (во время дубля пересесть нельзя).
const TAKE_LEN = 80;                                     // с трека (1:20)
const TAKE_KEYS = ['KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyY', 'KeyU', 'KeyT', 'KeyB', 'Space',
  'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
const take = { on: false, frozen: false, t0: 0, events: [], frames: [], startedAt: '' };
const takeEl = document.getElementById('take');
const r4 = v => Math.round(v * 1e4) / 1e4;
function takeKey(code, down, repeat) {
  if (!repeat && TAKE_KEYS.includes(code)) take.events.push([r4(music.currentTime - take.t0), code, down ? 1 : 0]);
}
// сброс мира к старту дубля
function resetToStart() {
  Object.assign(car, CAR_START);
  for (const c in keys) keys[c] = false;
  setXray(false);
  outMat.uniforms.showLogo.value = 0;
  camYaw = car.heading;
  updateCamera(0, true);
}
function toggleTake() {
  if (take.on) { take.on = false; takeEl.style.display = 'none'; return; }   // отмена
  resetToStart();
  CAR_PICK.open = false;
  take.frozen = false;
  take.events = []; take.frames = [];
  const d = new Date(), z = n => String(n).padStart(2, '0');
  take.startedAt = `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}_${z(d.getHours())}-${z(d.getMinutes())}-${z(d.getSeconds())}`;
  try { music.currentTime = MUSIC_START; } catch (e) {}
  take.t0 = MUSIC_START;
  music.play().then(() => { musicStarted = true; }).catch(() => {});
  take.on = true;
  takeEl.className = 'rec'; takeEl.style.display = 'block';
}
// после update/updateCamera: состояние кадра (для рендера и сверки)
function takeFrame(dt, now) {
  if (!take.on) return;
  const t = music.currentTime - take.t0;
  const held = TAKE_KEYS.filter(c => keys[c]).map(c => TAKE_KEYS.indexOf(c));
  take.frames.push([r4(t), r4(dt), r4(now / 1000),
    r4(car.x), r4(car.z), r4(car.heading), r4(car.speed), r4(car.steer), r4(car.yawRate),
    r4(car.accel), r4(car.pitch), r4(car.roll), r4(car.gas), r4(car.brake),
    r4(car.course), r4(car.slip), r4(car.lean),
    r4(camYaw), xrayMode || '', outMat.uniforms.showLogo.value, held, r4(dayTime)]);
  const s = Math.max(0, t) | 0;
  takeEl.textContent = `REC ${(s / 60) | 0}:${String(s % 60).padStart(2, '0')} / 1:20`;
  if (t >= TAKE_LEN) finishTake();
}
function finishTake() {
  take.on = false; take.frozen = true;
  music.pause();
  const data = {
    version: 2, startedAt: take.startedAt, musicStart: take.t0, length: TAKE_LEN, car: CAR.id,
    start: CAR_START, keys: TAKE_KEYS,
    frameFields: ['t', 'dt', 'now', 'x', 'z', 'heading', 'speed', 'steer', 'yawRate', 'accel', 'pitch', 'roll',
      'gas', 'brake', 'course', 'slip', 'lean', 'camYaw', 'xray', 'logo', 'held', 'day'],
    events: take.events, frames: take.frames,
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
  a.download = `take_${take.startedAt}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  takeEl.className = ''; takeEl.textContent = `ДУБЛЬ СОХРАНЁН: take_${take.startedAt}.json  (R — новый)`;
  console.log(`дубль: ${take.frames.length} кадров, ${take.events.length} нажатий`);
}

// ---------- Приборы ----------
// Свой холст поверх кадра (hud2d). Вверху справа — выбор машины, внизу — скорость, по центру — короткие надписи (J).
// В рендер дубля приборы не попадают.
const HUD_NOTE = { text: '', until: 0 };
function hudNote(text) { HUD_NOTE.text = text; HUD_NOTE.until = performance.now() + 2000; }
const hudAt = (e) => { const r = hudCanvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * RES_W, (e.clientY - r.top) / r.height * RES_H]; };

// Выбор машины (из tropicalgame): кнопка с названием машины; щелчок открывает под ней список — нынешняя подсвечена,
// щелчок по строке — пересесть. Щелчок мимо или Esc — закрыть. Клавиша C — следующая машина без окна.
const CAR_PICK = { open: false, hover: null, y: 3, h: 11, rowH: 14 };
// крошечный вид сбоку каждой машины для списка — готовые картинки из cars/car_icons.js; автобуса там нет —
// его модель один раз рисуется в маленькую картинку (вчетверо крупнее — и ужимается), носом вправо, при ровном свете
const CAR_ICON = { W: 30, H: 12, img: {} };
for (const [id, url] of Object.entries(window.CAR_ICONS || {})) { const im = new Image(); im.src = url; CAR_ICON.img[id] = im; }
function carIcon(id) {
  if (id in CAR_ICON.img) return CAR_ICON.img[id];
  const K = 4, W = CAR_ICON.W * K, H = CAR_ICON.H * K, sc = new THREE.Scene();
  sc.add(new THREE.AmbientLight(0xffffff, 0.8)); const dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(2, 3, -1); sc.add(dl);

// Мини-карта в левом нижнем углу (из tropicalgame): весь остров; крутится так, что «вперёд» всегда вверху, стрелка — машина.

const MAP = (() => {
  const R = 20, N = 2 * R + 1, T = TERRAIN;            // радиус и сторона карты, пиксели
  let far = 0;                                         // самая дальняя от центра суша: остров должен помещаться при любом повороте
  for (let ix = 0; ix < T.nx; ix += 2) for (let iz = 0; iz < T.nz; iz += 2) if (T.h[ix * T.nz + iz] > PLAIN_Y + 0.9) far = Math.max(far, Math.hypot(T.x0 + ix * T.step, T.z0 + iz * T.step));

  const pts = [];                                      // дороги — точками через ~60% пикселя карты: [x, z, кольцевая?]
  for (const r of roads) {
    const n = r.fr.length - 1, step = Math.max(1, Math.round(scale * 0.6 / (r.len / n)));

const MAP_COL = { plain: [52, 40, 30, 170], land: [[120, 96, 62, 235], [146, 118, 78, 240], [176, 150, 106, 240]], road: [196, 190, 176, 255], ring: [250, 240, 214, 255] };
function drawMap() {
  const { R, N, scale, img } = MAP, d = img.data;
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);   // вверх на карте — вперёд

  for (let py = 0; py < N; py++) for (let px = 0; px < N; px++) {
    const dx = px - R, dy = py - R, i = (py * N + px) * 4;

// машины и камеры приравнивается к записанному (дрейфа нет). Кадр видео на время T (с от старта трека) —
// между двумя записанными кадрами, положение машины и камеры интерполируется.
// Время записанного кадра = его часы (ровные) + средний сдвиг к треку + упреждение звука (как видел игрок).

  const CAR_F = ['x', 'z', 'heading', 'speed', 'steer', 'yawRate', 'accel', 'pitch', 'roll', 'gas', 'brake', 'course', 'slip', 'lean'];
  // xray: null — режимы Y/U как в дубле; 'Y' / 'U' / '' — весь ролик в этом режиме / без режима
  function setup(data, xray = null) {

    const n0 = F[0][fi.now], off = F.map(f => f[fi.t] - (f[fi.now] - n0)).slice(30).sort((a, b) => a - b);
    const shift = off[off.length >> 1] + AUDIO_LOOKAHEAD;
    R = { data, F, fi, tf: F.map(f => f[fi.now] - n0 + shift), k: -1, xray };
    clock.track = MUSIC_START; clock.now = F[0][fi.now];

      for (const c of data.keys) keys[c] = false;
      for (const i of f[fi.held]) keys[data.keys[i]] = true;

    placeVehicle(0);                                     // машина и камера — по интерполированному состоянию
    updateCamera(0, false);

    camYaw = savedYaw;
    return R.k;
  }
  return { setup, frameAt };
})();
