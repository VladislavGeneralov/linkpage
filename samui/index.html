<title>Samui Drive</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141c; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* телефон стоит вертикально — просьба повернуть (надпись — пиксельным шрифтом, рисует игра) */
  #rotate { position: fixed; inset: 0; z-index: 30; background: #10141c; display: none; align-items: center; justify-content: center; }
  #rotate canvas { image-rendering: pixelated; image-rendering: crisp-edges; width: 80vw; }
  #game, #flare {
    position: absolute; inset: 0; margin: auto;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #flare { pointer-events: none; }
  /* контраст и насыщенность итогового кадра */
  :root { --contrast: 1.1; --saturate: 1.2; }
  #view { position: fixed; inset: 0; filter: contrast(var(--contrast)) saturate(var(--saturate)); }
  /* меню SoundCloud нарисовано игрой; здесь — только невидимые поля ввода поверх нарисованных */
  #scMenu[hidden] { display: none; }
  #scMenu { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #scMenu input { position: absolute; pointer-events: auto; box-sizing: border-box; margin: 0; padding: 0; border: 0; outline: 0;
    background: transparent; color: transparent; caret-color: transparent; font: 16px monospace; cursor: text; }
  #scMenu input::selection { background: transparent; color: transparent; }
  /* счётчик кадров — справа от игры, на тёмном поле страницы */
  #fps { position: fixed; right: 0; top: 0; z-index: 5; box-sizing: border-box; padding: 6px 8px 6px 4px; text-align: right;
    font: 11px/1.35 Consolas, 'Courier New', monospace; color: #9aa6b4; user-select: none; white-space: nowrap; }
  #fps[hidden] { display: none; }
  #fps b { display: block; font-weight: normal; color: #5f6b7a; margin: 0 0 3px; }
  /* крошечные переключатели на поле страницы снизу слева: сенсорные ручки и помощь в заносе */
  #touchToggle, #driftToggle { position: fixed; left: 8px; bottom: 8px; z-index: 5; display: flex; align-items: center; gap: 5px; cursor: pointer;
    font: 10px/1 Consolas, 'Courier New', monospace; color: #5f6b7a; user-select: none; }
  #driftToggle { bottom: 24px; }
  #touchToggle[hidden], #driftToggle[hidden] { display: none; }
  #touchToggle i, #driftToggle i { position: relative; width: 18px; height: 10px; border-radius: 5px; background: #26334a; transition: background 0.15s; }
  #touchToggle i::after, #driftToggle i::after { content: ''; position: absolute; left: 1px; top: 1px; width: 8px; height: 8px; border-radius: 50%; background: #5f6b7a; transition: left 0.15s, background 0.15s; }
  #touchToggle.on i, #driftToggle.on i { background: #3a5a3a; } #touchToggle.on i::after, #driftToggle.on i::after { left: 9px; background: #9ad89a; } #touchToggle.on, #driftToggle.on { color: #9aa6b4; }
  /* надпись на время загрузки: видна, пока качаются данные и строится мир; убирается с первым кадром */
  #loading { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; pointer-events: none;
    font: 14px/1 Consolas, 'Courier New', monospace; letter-spacing: 3px; color: #9aa6b4; }
</style>
</head>

<script>
// ---------- Настройки ----------
// 16:9, на 1080p пиксель ровно ×4. (Вертикальный 4:5, как у афиши BROKEN17: 216×270 и CAM_FOV 60.)
const RES_W = 480, RES_H = 270;          // внутреннее "пиксельное" разрешение
const CAM_FOV = 55;                      // вертикальный угол обзора
const ROAD_WIDTH = 10;                   // асфальт
const SHOULDER = 2.5;                    // обочина с каждой стороны
// разметка (по образцу Таиланда: осевая жёлтая, краевые белые). Правила — в ROAD_MARKING_TZ.md
const MARK_YELLOW = '#e0a82c', MARK_WHITE = '#e6e6e2';
const LINE_W = 0.15;                     // м — ширина продольных линий (один тексель прежней текстуры)
const EDGE_IN = 0.3;                     // м — краевая линия от кромки асфальта
const DASH = 3, DASH_STEP = 12;          // м — штрих осевой и шаг (штрих + разрыв 9 м)
const R_SOLID = 90;                      // м — на поворотах круче этого радиуса осевая сплошная
const CURVE_SPAN = 40;                   // м — на каком отрезке пути меряется поворот оси
const CREST_GRADE = 0.06, CREST_SPAN = 40;   // перелом профиля: уклон меняется больше чем на 6 % за 40 м (выпуклая вершина)
const LEAD = 30;                         // м — сплошная начинается за столько до поворота или перелома и тянется столько же после
const JUNCTION_SOLID = 30;               // м — сплошная осевая перед стыком
const SOLID_JOIN = 60, SOLID_MIN = 30;   // м — сплошные ближе этого сливаются; короче этого — удлиняются
const MOUTH_DASH = 2, MOUTH_GAP = 4, MOUTH_W = 0.3;   // м — линия продолжения края через устье примыкания
const STOP_W = 0.45, STOP_BACK = 1;      // м — толщина стоп-линии и её отступ от краевой линии главной дороги
const GIVE_DASH = 0.6, GIVE_GAP = 0.3;   // м — «уступи дорогу»: штрихи поперёк полосы
const DEAD_END_GAP = 6;                  // м — в тупике осевая кончается за столько до торца
const FORK_ANGLE = 60;                   // ° — примыкание под углом острее этого — развилка
const STOP_SIDE = -1;                    // +1 — стоп-линия на правой по ходу полосе (как едет автопилот), −1 — на левой (как в Таиланде)
const END_EXT = 4;                       // м — на столько асфальт дороги продлён за её торец

// ---------- Машины ----------
// Ходовые качества у каждой модели свои; новые модели добавляются сюда же. CAR — модель, на которой едем сейчас
// (выбор — стрелками у названия вверху экрана или клавишей C). Габариты для физики (свесы, база, колея, радиус
// колеса) снимаются с самой модели при первом выборе.
const CARS = {
  beetle: {
    name: 'VOLKSWAGEN BEETLE', build: () => buildBeetle(), lamp: 0.52,   // lamp — фары от оси, м
    maxSpeed: 36,            // м/с — предельная скорость на ровном асфальте (~130 км/ч)
    maxReverse: 16,          // м/с — задним ходом (все пределы заднего хода удвоены 2026-10-11 по просьбе Влада)
    accel: 5.5,              // м/с² — разгон с места; к предельной скорости тяга спадает до 40% (до максимума — около 11 с)
    brake: 14,               // м/с² — торможение (со 130 км/ч до нуля — за 2.6 с)
    drag: 2,                 // м/с² — накат: замедление с отпущенными педалями
    gasPress: 0.9, brakePress: 1.8, pedalRelease: 3,   // 1/с — как быстро педали доходят до пола и отпускаются
    // руль лёгкий, как у легковушки: колёса поворачиваются быстро, кузов почти без инерции по курсу
    maxSteer: 0.55,          // рад — предельный угол колёс
    wheelbase: 2.4,          // м
    steerRate: 0.9,          // рад/с — как быстро крутятся колёса под рукой
    steerReturn: 1.4,        // рад/с — самовозврат руля, когда отпустил
    yawLag: 0.12,            // с — инерция кузова по курсу
    // занос
    grip: 70,                // м/с² — устойчивость: боковое ускорение, которое шины держат без заноса (жук не срывается сам)
    align: 1.0,              // рад/с — как сильно нос в заносе тянет встать по ходу (без ручника)
    gripBack: 0.45,          // с — за сколько шины снова цепляются, когда ручник отпущен
    slideDrag: 4.5,          // м/с² — потеря скорости при скольжении боком (при 90°)
    // ручник: задние колёса заблокированы — корму уносит, машину можно развернуть на 180°
    handGrip: 5,             // м/с² — сцепление на ручнике: ход почти не поворачивает, машину несёт прежним курсом
    handBrake: 2.3,            // м/с² — замедление от ручника на прямой
    handYaw: 1.7,            // во столько раз резче нос заходит в поворот на ручнике
    handYawLag: 0.22,        // с — как быстро раскручивается вращение
    spinLag: 0.9,            // с — как долго машина вращается по инерции, когда руль уже не помогает
    handAlign: 1.6,          // рад/с — в заносе на ручнике машину тянет встать вдоль хода — носом или кормой, что ближе
  },
  // Porsche 911 Turbo (930). Цифры — предложение: вдвое резвее жука, тормозит цепче, руль острее, а на пределе
  // в повороте корму понемногу сносит (у настоящего 930 мотор сзади и крутой нрав).
  porsche: {
    name: 'PORSCHE 911', build: () => buildPorsche(), lamp: 0.6,
    maxSpeed: 61,            // м/с — 220 км/ч (у настоящего 260; остров в игре втрое меньше)
    maxReverse: 20,          // м/с
    accel: 8.5,              // м/с² — до 100 км/ч около 4 с, до предельной — около 12 с
    brake: 19,               // м/с² — со 100 км/ч до нуля за 1.5 с
    drag: 1.6,               // м/с² — накат
    gasPress: 1.3, brakePress: 2.2, pedalRelease: 3.5,
    maxSteer: 0.5, wheelbase: 2.27,
    steerRate: 1.2, steerReturn: 1.8, yawLag: 0.09,
    latMax: 56,              // м/с² — предел бокового ускорения от руля: на скорости колёса поворачиваются ровно настолько
    grip: 50,                // м/с² — шины держат чуть меньше, чем просит руль на пределе: в быстром повороте корма плывёт на 10–18°
    align: 1.0, gripBack: 0.45, slideDrag: 5,
    handGrip: 6, handBrake: 2.88, handYaw: 1.6, handYawLag: 0.2, spinLag: 0.8, handAlign: 1.6,
  },
  // Lancia Delta HF Integrale — раллийный полный привод: разгоняется чуть хуже Porsche, зато цепкая и послушная —
  // в повороте не плывёт, из заноса вытягивает газом почти без потери скорости, на ручнике охотно встаёт боком.
  lancia: {
    name: 'LANCIA DELTA', build: () => buildLancia(), lamp: 0.5,
    maxSpeed: 53,            // м/с — 190 км/ч (у настоящей 220)
    maxReverse: 20,          // м/с
    accel: 7.2,              // м/с² — до 100 км/ч около 5.3 с
    brake: 18,               // м/с² — со 100 км/ч до нуля за 1.6 с
    drag: 1.9,               // м/с² — накат
    gasPress: 1.4, brakePress: 2.2, pedalRelease: 3.5,
    maxSteer: 0.55, wheelbase: 2.48,
    steerRate: 1.3, steerReturn: 1.9, yawLag: 0.08,
    latMax: 54,              // м/с² — предел бокового ускорения от руля
    grip: 64,                // м/с² — запас над latMax: без ручника не срывается
    align: 1.2, gripBack: 0.3, slideDrag: 3.2,     // полный привод: в скольжении скорость почти не теряется, сцепление возвращается быстро
    handGrip: 5, handBrake: 2.3, handYaw: 1.9, handYawLag: 0.16, spinLag: 0.7, handAlign: 1.4,
  },
  // Honda Wave 110i — скутер-андербон. Цифры — предложение: лёгкий и вёрткий, 130 км/ч, на пределе срывается
  // раньше машин. База короткая (1.2 м), поэтому угол руля и предел бокового ускорения меньше, чем у машин, — иначе поворачивает
  // вдвое резче жука. bike — одноколейный: в повороте наклоняется весь, вместе с колёсами.
  wave: {
    name: 'HONDA WAVE', build: () => buildScooter(SCOOTERS.wave), lamp: 0.04, bike: true,
    maxSpeed: 36,            // м/с — 130 км/ч (Влад: «макс скорость ему можно сделать больше»; было 100)
    maxReverse: 4,           // м/с — задом только откатывается
    accel: 5.2,              // м/с² — до 60 км/ч за 4 с
    brake: 11,               // м/с²
    drag: 1.7,               // м/с² — накат
    gasPress: 1.8, brakePress: 2.4, pedalRelease: 4,
    maxSteer: 0.35, wheelbase: 1.227,   // при короткой базе 0.6 рад поворачивало вдвое резче жука (Влад: «очень резко поворачивает»)
    steerRate: 1.0, steerReturn: 1.8, yawLag: 0.1,
    latMax: 34,              // м/с² — предел бокового ускорения от руля
    grip: 46,                // м/с² — запас маленький: резкий руль на скорости — и заднее колесо едет
    align: 1.5, gripBack: 0.35, slideDrag: 6,
    handGrip: 6, handBrake: 3.45, handYaw: 1.4, handYawLag: 0.15, spinLag: 0.5, handAlign: 2.0,
    offroad: 1.25,           // тонкие колёса: трава и грунт тормозят сильнее
  },
  // Isuzu D-Max — пикап на раме. Цифры — предложение: тяжёлый и неторопливый в руле, зато трава и грунт ему почти
  // не мешают (offroad — доля обычного замедления на покрытиях).
  dmax: {
    name: 'ISUZU D-MAX', build: () => buildDmax(), lamp: 0.72,
    maxSpeed: 47,            // м/с — 170 км/ч
    maxReverse: 18,          // м/с
    accel: 5.0,              // м/с² — до 100 км/ч около 8 с
    brake: 13,               // м/с²
    drag: 2.2,               // м/с² — накат
    gasPress: 1.0, brakePress: 1.8, pedalRelease: 3,
    maxSteer: 0.5, wheelbase: 3.125,
    steerRate: 0.8, steerReturn: 1.2, yawLag: 0.16,
    latMax: 44,              // м/с²
    grip: 56,                // м/с²
    align: 0.9, gripBack: 0.5, slideDrag: 5,
    handGrip: 5, handBrake: 2.53, handYaw: 1.5, handYawLag: 0.26, spinLag: 1.0, handAlign: 1.5,
    offroad: 0.45,
  },
  // Honda City — городской седан. Цифры — предложение: немного резвее жука, послушный, без характера.
  city: {
    name: 'HONDA CITY', build: () => buildCity(), lamp: 0.58,
    maxSpeed: 50,            // м/с — 180 км/ч
    maxReverse: 18,          // м/с
    accel: 6.0,              // м/с² — до 100 км/ч около 6.5 с
    brake: 16,               // м/с²
    drag: 1.9,               // м/с² — накат
    gasPress: 1.2, brakePress: 2.0, pedalRelease: 3.2,
    maxSteer: 0.55, wheelbase: 2.6,
    steerRate: 1.1, steerReturn: 1.7, yawLag: 0.1,
    latMax: 48,              // м/с²
    grip: 62,                // м/с²
    align: 1.1, gripBack: 0.4, slideDrag: 4.5,
    handGrip: 5, handBrake: 2.3, handYaw: 1.7, handYawLag: 0.2, spinLag: 0.8, handAlign: 1.6,
  },
  // Mitsubishi Lancer Evolution — раллийный полный привод с турбо. Цифры — предложение: самая резвая из полноприводных,
  // цепкая, как Lancia, но на ручнике разворачивается ещё охотнее.
  evo: {
    name: 'MITSUBISHI LANCER EVO', build: () => buildEvo(), lamp: 0.62,
    maxSpeed: 58,            // м/с — 210 км/ч
    maxReverse: 20,          // м/с
    accel: 8.0,              // м/с² — до 100 км/ч около 4.6 с
    brake: 19,               // м/с²
    drag: 1.8,               // м/с² — накат
    gasPress: 1.4, brakePress: 2.2, pedalRelease: 3.5,
    maxSteer: 0.55, wheelbase: 2.51,
    steerRate: 1.35, steerReturn: 1.9, yawLag: 0.08,
    latMax: 56,              // м/с²
    grip: 66,                // м/с² — запас над latMax: без ручника не срывается
    align: 1.2, gripBack: 0.3, slideDrag: 3.0,
    handGrip: 5, handBrake: 2.3, handYaw: 2.0, handYawLag: 0.15, spinLag: 0.7, handAlign: 1.4,
  },
  // Subaru Impreza WRX — тоже полный привод: чуть мягче и медленнее Evo, в заносе плавнее, по грунту и траве идёт легче.
  impreza: {
    name: 'SUBARU IMPREZA WRX', build: () => buildImpreza(), lamp: 0.6,
    maxSpeed: 56,            // м/с — 200 км/ч
    maxReverse: 20,          // м/с
    accel: 7.4,              // м/с² — до 100 км/ч около 5 с
    brake: 18,               // м/с²
    drag: 1.8,               // м/с² — накат
    gasPress: 1.4, brakePress: 2.2, pedalRelease: 3.5,
    maxSteer: 0.55, wheelbase: 2.54,
    steerRate: 1.3, steerReturn: 1.9, yawLag: 0.09,
    latMax: 54,              // м/с²
    grip: 62,                // м/с²
    align: 1.15, gripBack: 0.32, slideDrag: 3.3,
    handGrip: 5, handBrake: 2.3, handYaw: 1.9, handYawLag: 0.17, spinLag: 0.75, handAlign: 1.4,
    offroad: 0.75,
  },
};

// сетке RES_W×RES_H — ступеньки пикселей сохраняются. Фишай — бочка: углы кадра на месте, центр раздувается.
const FISHEYE = 0.19;                    // сила бочки: 0 — выкл, 0.3 — заметно, 0.6 — сильно

  uniforms: {
    tLow: { value: lowRT.texture }, k: { value: FISHEYE }, aspect: { value: FISH_ASPECT },
    res: { value: new THREE.Vector2(RES_W, RES_H) },
    ripAmt: { value: 0 }, ripSize: { value: 1 }, ripPhase: { value: 0 }, green: { value: 0 },   // «травка»: рябь и зелень (WEED_FX)

  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `

function fishForward(u, v) {
  if (FISHEYE <= 0) return [u, v];
  const px = (u - 0.5) * FISH_ASPECT, py = v - 0.5, rs = Math.hypot(px, py);
  if (rs < 1e-6) return [u, v];
  const c2 = 0.25 * (FISH_ASPECT * FISH_ASPECT + 1), k = FISHEYE;
  let r = rs;                                        // решаем r * (1 + k (r²/c2 - 1)) = rs
  for (let i = 0; i < 8; i++) {
    const f = r * (1 + k * (r * r / c2 - 1)) - rs, df = 1 + k * (3 * r * r / c2 - 1);

    const a = i * 6, lenL = Math.hypot(T[a + 6] - T[a], T[a + 8] - T[a + 2]), lenR = Math.hypot(T[a + 9] - T[a + 3], T[a + 11] - T[a + 5]);
    bent[i] = Math.abs(T[a + 1] - T[a + 4]) > 0.002 || Math.abs(T[a + 7] - T[a + 10]) > 0.002 || Math.abs(T[a + 7] - T[a + 1]) / ds * Math.abs(lenL - lenR) / 4 > 0.008 ? 1 : 0;
  }
  const quad = (a, b, c, d) => { pos.push(...a, ...b, ...c, ...a, ...c, ...d); for (let i = 0; i < 6; i++) col.push(C.r, C.g, C.b); };
  // где линия со смещением o пересекает диагональ клетки асфальта i (доля пути по клетке)
  const diag = (i, o) => {
    const T = R.top, a = i * 6, A = roadPoint(R, i * ds + 1e-6, o), B = roadPoint(R, (i + 1) * ds - 1e-6, o);
    const px = T[a + 3], pz = T[a + 5], qx = T[a + 6] - px, qz = T[a + 8] - pz, ex = B[0] - A[0], ez = B[1] - A[1], den = ex * qz - ez * qx;
    return Math.abs(den) < 1e-9 ? 0.5 : ((px - A[0]) * qz - (pz - A[1]) * qx) / den;
  };
  return {
    // лента вдоль дороги от s0 до s1, ось на смещении o, ширина w; fine — у стыков вершины чаще
    line(s0, s1, o, w, color, fine = false) {
      if (s1 - s0 < 0.05) return;
      C.set(color); zone = fine;
      const S = [s0, s1];
      for (let i = Math.max(0, Math.floor(s0 / ds)); i <= Math.min(n - 1, Math.floor(s1 / ds)); i++) {
        const sd = bent[i] ? (i + Math.max(0.02, Math.min(0.98, diag(i, o)))) * ds : -1, sb = (i + 1) * ds;
        if (sd > s0 + 0.02 && sd < s1 - 0.02) S.push(sd);
        if (sb > s0 + 0.02 && sb < s1 - 0.02) S.push(sb);
      }
      S.sort((a, b) => a - b);
      if (fine) for (let k = S.length - 1; k > 0; k--) {
        const m = Math.ceil((S[k] - S[k - 1]) / 1);
        for (let j = m - 1; j > 0; j--) S.splice(k, 0, S[k - 1] + (S[k] - S[k - 1]) * j / m);
      }
      let pl = vert(S[0], o - w / 2), pr = vert(S[0], o + w / 2);
      for (let k = 1; k < S.length; k++) {
        const ql = vert(S[k], o - w / 2), qr = vert(S[k], o + w / 2);
        quad(pl, pr, qr, ql); pl = ql; pr = qr;
      }
    },
    // поперечная полоса: от s до s + len вдоль дороги, от oA до oB поперёк; dash — штрихи поперёк (иначе сплошная)
    bar(s, len, oA, oB, color, dash = 0, gap = 0) {
      C.set(color); zone = true;
      const lo = Math.min(oA, oB), hi = Math.max(oA, oB), step = dash ? dash + gap : 0.75;
      for (let o = lo; o < hi - 0.05; o += step) {
        const o1 = Math.min(hi, o + (dash || step));
        quad(vert(s, o), vert(s, o1), vert(s + len, o1), vert(s + len, o));
      }
    },
    mesh() {
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      geo.computeVertexNormals();
      return new THREE.Mesh(geo, MARK_MAT);
    },
  };
}

// --- где осевая сплошная: повороты, переломы профиля, подходы к стыкам. Возвращает по клеткам шага штриха ---
// mk.dir, mk.ph — фаза штриха: g = dir * s + ph; клетка k — отрезок g = [k, k + 1) * step
function centreCells(R, rSolid) {
  const mk = R.mk, STEP = 2, N = Math.ceil(R.len / STEP) + 1, flag = new Uint8Array(N);
  const tan = (s) => { const p = roadPoint(R, R.ring ? s : Math.max(0, Math.min(R.len - 0.01, s))); return Math.atan2(p[3], p[2]); };
  const hgt = (s) => { const n = R.fr.length - 1, f = (R.ring ? ((s % R.len) + R.len) % R.len : Math.max(0, Math.min(R.len, s))) / R.len * n, i = Math.min(n - 1, Math.floor(f)); return R.fr[i].p.y + (R.fr[i + 1].p.y - R.fr[i].p.y) * (f - i); };
  const grade = (s) => (hgt(s + 10) - hgt(s - 10)) / 20;
  const mark = (a, b) => { for (let i = Math.max(0, Math.floor(a / STEP)); i <= Math.min(N - 1, Math.ceil(b / STEP)); i++) flag[i] = 1; };
  for (let i = 0; i < N; i++) {
    const s = i * STEP;
    let dt = tan(s + CURVE_SPAN / 2) - tan(s - CURVE_SPAN / 2);
    dt = Math.atan2(Math.sin(dt), Math.cos(dt));
    const curve = Math.abs(dt) > CURVE_SPAN / rSolid, crest = grade(s - CREST_SPAN / 2) - grade(s + CREST_SPAN / 2) > CREST_GRADE;
    if (curve || crest) {
      if (R.ring) { for (let a = s - LEAD; a <= s + LEAD; a += STEP) flag[(((Math.round(a / STEP)) % (N - 1)) + (N - 1)) % (N - 1)] = 1; }
      else mark(s - LEAD, s + LEAD);
    }
  }
  for (const [a, b] of mk.solids) mark(a, b);
  // по клеткам
  const g = (s) => mk.dir * s + mk.ph, g0 = Math.min(g(0), g(R.len)), g1 = Math.max(g(0), g(R.len));
  const k0 = Math.floor(g0 / mk.step + 1e-6), K = R.ring ? Math.round(R.len / mk.step) : Math.ceil(g1 / mk.step - 1e-6) - k0;
  const cells = new Uint8Array(K);
  for (let i = 0; i < N; i++) if (flag[i]) { const k = Math.floor(g(Math.min(R.len - 0.01, i * STEP)) / mk.step + 1e-6) - k0; if (k >= 0 && k < K) cells[k] = 1; }
  // сшивка: короткие разрывы между сплошными заливаются, короткие сплошные удлиняются
  const joinN = Math.ceil(SOLID_JOIN / mk.step) - 1, minN = Math.ceil(SOLID_MIN / mk.step), at = (k) => R.ring ? cells[((k % K) + K) % K] : (k >= 0 && k < K ? cells[k] : 0);
  for (let k = 0; k < K; k++) if (!cells[k] && at(k - 1)) {
    let e = k; while (e < k + joinN + 1 && !at(e)) e++;
    if (e - k <= joinN && at(e) && (R.ring || e < K)) for (let j = k; j < e; j++) cells[((j % K) + K) % K] = 1;
  }
  for (let k = 0; k < K; k++) if (cells[k] && !at(k - 1)) {
    let e = k; while (e - k < K && at(e)) e++;
    for (let j = e; j < k + minN; j++) if (R.ring || j < K) cells[((j % K) + K) % K] = 1;
  }
  return { cells, k0, K };
}

// --- углы стыков ---
// У стыка обочины обеих дорог сходят на нет (иначе легли бы на чужой асфальт), и в углу оставался клин травы вплотную
// к полотну. Угол засыпается землёй: от кромки одной дороги до кромки другой, с плавной дугой снаружи и рваным краем
// по ней — как у обычной обочины. Земля лежит на рельефе, ниже асфальта, так что на полотно не заходит.
function junctionCorners() {
  const pos = [], uv = [], idx = [], epos = [], euv = [], eidx = [];
  const walk = (R, side, s, dir) => {                  // до первого места, где обочина снова во всю ширину
    const n = R.fr.length - 1, ds = R.len / n;
    let i = Math.round(s / ds) + (dir > 0 ? 1 : -2);
    for (let k = 0; k < 11; k++, i += dir) {
      const j = R.ring ? ((i % n) + n) % n : i;
      if (j < 0 || j > n - 1) return null;
      if (R.shFull[side][j]) return (dir > 0 ? i : i + 1) * ds;
    }
    return null;
  };
  const path = (R, s0, s1, o) => { const P = [], m = Math.max(2, Math.ceil(Math.abs(s1 - s0) / 2)); for (let i = 0; i <= m; i++) P.push(roadPoint(R, s0 + (s1 - s0) * i / m, o)); return P; };
  const resample = (P, N) => {                         // N + 1 точек через равные доли длины
    const L = [0]; for (let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
    const out = [];
    for (let k = 0, i = 1; k <= N; k++) {
      const d = L[L.length - 1] * k / N;
      while (i < P.length - 1 && L[i] < d) i++;
      const t = (d - L[i - 1]) / Math.max(1e-6, L[i] - L[i - 1]);
      out.push([P[i - 1][0] + (P[i][0] - P[i - 1][0]) * t, P[i - 1][1] + (P[i][1] - P[i - 1][1]) * t]);
    }
    return out;
  };
  for (const J of JUNCTIONS) {
    if (!J.info || J.angle < 25) continue;
    const RJ = roads[J.minor], sgJ = J.e ? 1 : -1;
    for (const { q, side, sa, sb } of J.info) for (const [sc, dir] of [[sa, -1], [sb, 1]]) {
      const M = roads[q], oM = side ? 1 : -1, C = roadPoint(M, sc, oM * halfR), pj = roadProj(J.minor, C[0], C[1]);
      if (!pj) continue;
      if (!M.ring && (sc < END_EXT + 1 || sc > M.len - END_EXT - 1)) continue;        // это узел сквозной пары, а не угол
      const sideJ = pj.o > 0 ? 1 : 0, oJ = sideJ ? 1 : -1;
      const sB = walk(M, side, sc, dir), sA = walk(RJ, sideJ, pj.s, -sgJ);
      if (sB === null || sA === null) continue;
      const inner = [...path(RJ, sA, pj.s, oJ * (halfR - 1)), ...path(M, sc, sB, oM * (halfR - 1))];
      const Qa = roadPoint(RJ, sA, oJ * halfS), Qb = roadPoint(M, sB, oM * halfS);
      // дуга снаружи: от края обочины одной дороги до края обочины другой; изгиб — к точке, где эти края пересеклись бы
      const ax = Qa[2] * sgJ, az = Qa[3] * sgJ, bx = -Qb[2] * dir, bz = -Qb[3] * dir, den = ax * bz - az * bx;
      let X = [(Qa[0] + Qb[0]) / 2, (Qa[1] + Qb[1]) / 2];
      if (Math.abs(den) > 0.05) {
        const t = ((Qb[0] - Qa[0]) * bz - (Qb[1] - Qa[1]) * bx) / den, u = ((Qb[0] - Qa[0]) * az - (Qb[1] - Qa[1]) * ax) / den;
        if (t > 0 && u > 0 && t < 60 && u < 60) X = [Qa[0] + ax * t, Qa[1] + az * t];
      }
      const curve = []; for (let i = 0; i <= 16; i++) { const t = i / 16, a = (1 - t) ** 2, b = 2 * t * (1 - t), c = t * t; curve.push([a * Qa[0] + b * X[0] + c * Qb[0], a * Qa[1] + b * X[1] + c * Qb[1]]); }
      const N = 22, I = resample(inner, N), O = resample(curve, N), base = pos.length / 3, ebase = epos.length / 3;
      let arc = 0;
      for (let i = 0; i <= N; i++) {
        for (let j = 0; j <= 3; j++) {
          const x = I[i][0] + (O[i][0] - I[i][0]) * j / 3, z = I[i][1] + (O[i][1] - I[i][1]) * j / 3;
          pos.push(x, groundY(x, z) + 0.04, z); uv.push(x / 15, z / 4);
          if (i < N && j < 3) { const a = base + i * 4 + j; idx.push(a, a + 4, a + 1, a + 1, a + 4, a + 5); }
        }
        // рваный край вдоль дуги: наружу от неё
        const p = O[Math.max(0, i - 1)], n2 = O[Math.min(N, i + 1)];
        let nx = -(n2[1] - p[1]), nz = n2[0] - p[0]; const nl = Math.hypot(nx, nz) || 1; nx /= nl; nz /= nl;
        if ((O[i][0] - I[i][0]) * nx + (O[i][1] - I[i][1]) * nz < 0) { nx = -nx; nz = -nz; }
        if (i) arc += Math.hypot(O[i][0] - O[i - 1][0], O[i][1] - O[i - 1][1]);
        [-0.5, 2.25, 5].forEach((d, j) => {
          const x = O[i][0] + nx * d, z = O[i][1] + nz * d;
          epos.push(x, groundY(x, z) + 0.05, z); euv.push(j / 2, arc / 8);
          if (i < N && j < 2) { const a = ebase + i * 3 + j; eidx.push(a, a + 3, a + 1, a + 1, a + 3, a + 4); }
        });
      }
    }
  }
  if (!idx.length) return;
  const tex = gravelTex.clone(); tex.needsUpdate = true;
  roadMesh(meshFrom(pos, uv, idx, lambert({ map: tex, side: THREE.DoubleSide })));
  roadMesh(meshFrom(epos, euv, eidx, edgeMat));
}

// --- разбор стыков и разметка всех дорог ---
function buildRoadMarkings() {
  const DEG = 180 / Math.PI, NODE_R = 8, t0 = performance.now();
  const pierLike = (R) => /^(pier|spot) /.test(R.name);
  roads.forEach((R) => {
    R.mk = { dir: 1, ph: 0, step: R.ring ? R.len / Math.round(R.len / DASH_STEP) : DASH_STEP, noCentre: pierLike(R),
      edge: [[0, R.len], [0, R.len]],                 // краевые: слева (o < 0) и справа — от и до
      centre: [R.ring ? 0 : DEAD_END_GAP, R.ring ? R.len : R.len - DEAD_END_GAP], clip: [false, false],   // осевая: от и до; clip — у этого конца штрих обрезается, а не выкидывается
      mouths: [[], []], gaps: [], solids: [], bars: [], zones: [] };
  });
  // торцы незамкнутых дорог: точка, направление наружу
  const ends = [];
  roads.forEach((R, r) => {
    if (R.ring) return;
    for (const e of [0, 1]) {
      const s = e ? R.len - END_EXT : END_EXT, [x, z, tx, tz] = roadPoint(R, s);
      ends.push({ r, e, s, x, z, dx: e ? tx : -tx, dz: e ? tz : -tz, main: null });
    }
  });
  // сквозная дорога под торцом?
  for (const E of ends) {
    let best = null;
    roads.forEach((Q, q) => {
      if (q === E.r) return;
      const p = roadProj(q, E.x, E.z);
      if (!p || p.out || p.d > halfR + 2) return;
      if (!Q.ring && (p.s < END_EXT + NODE_R || p.s > Q.len - END_EXT - NODE_R)) return;       // это торец той дороги — узел торцов
      if (!best || p.d < best.d) best = { q, d: p.d, s: p.s };
    });
    if (best) E.main = [best.q];
  }
  // узлы торцов без сквозной дороги
  const loose = ends.filter(E => !E.main), nodes = [];
  for (const E of loose) {
    let node = nodes.find(N => N.some(o => Math.hypot(o.x - E.x, o.z - E.z) < NODE_R));
    if (!node) nodes.push(node = []);
    node.push(E);
  }
  const links = [];                                    // пары торцов, идущих как одна дорога
  const odd = [];
  for (const node of nodes) {
    if (node.length === 1) { node[0].free = true; continue; }
    let pair = [node[0], node[1]];
    if (node.length > 2) {                             // сквозная пара — та, что ближе всего к прямой
      let bd = Infinity;
      for (let i = 0; i < node.length; i++) for (let j = i + 1; j < node.length; j++) {
        const dev = Math.round((Math.PI - Math.acos(Math.max(-1, Math.min(1, node[i].dx * node[j].dx + node[i].dz * node[j].dz)))) * DEG);
        const rank = dev * 1000 + Math.min(node[i].r, node[j].r);
        if (rank < bd) { bd = rank; pair = [node[i], node[j]]; }
      }
      for (const E of node) if (!pair.includes(E)) { E.main = [pair[0].r, pair[1].r]; E.three = true; }
      if (node.length > 3) odd.push(`узел из ${node.length} торцов у x=${node[0].x.toFixed(0)} z=${node[0].z.toFixed(0)}`);
    }
    pair[0].mate = pair[1]; pair[1].mate = pair[0]; pair[0].through = pair[1].through = node.length > 2;
    links.push(pair);
  }
  // фаза штриха осевой: по цепочкам «одной дороги» штрих идёт без сбоя
  {
    const seen = new Set();
    roads.forEach((R, r) => {
      if (seen.has(r) || R.ring) return;
      const queue = [r]; seen.add(r);
      while (queue.length) {
        const a = queue.shift(), A = roads[a].mk;
        for (const [p, q] of links) for (const [E, F] of [[p, q], [q, p]]) {
          if (E.r !== a || seen.has(F.r)) continue;
          const B = roads[F.r].mk, v = A.dir * (E.e ? 1 : -1);
          B.dir = v * (F.e ? -1 : 1); B.ph = A.dir * E.s + A.ph - B.dir * F.s;
          seen.add(F.r); queue.push(F.r);
        }
      }
    });
  }
  // продолжение одной дороги через узел: линии обеих дорог сходятся на биссектрисе
  for (const [p, q] of links) for (const [E, F] of [[p, q], [q, p]]) {
    const R = roads[E.r], mk = R.mk, phi = Math.atan2(E.dx * -F.dz - E.dz * -F.dx, E.dx * -F.dx + E.dz * -F.dz), sg = E.e ? 1 : -1;
    const trim = (o) => E.s + sg * Math.max(-8, Math.min(END_EXT - 0.3, -(o * sg) * Math.tan(phi / 2)));
    mk.edge[0][E.e] = trim(-EDGE_O); mk.edge[1][E.e] = trim(EDGE_O);
    mk.centre[E.e] = E.s; mk.clip[E.e] = true;
    mk.trim = mk.trim || {}; mk.trim[E.e] = trim;
    if (E.through) { mk.solids.push(E.e ? [E.s - JUNCTION_SOLID, E.s] : [E.s, E.s + JUNCTION_SOLID]); mk.zones.push(E.s); }
  }
  for (const [p, q] of links) if (!p.through) JUNCTIONS.push({ type: 'продолжение', x: p.x, z: p.z, angle: Math.round(Math.acos(Math.max(-1, Math.min(1, -(p.dx * q.dx + p.dz * q.dz)))) * DEG), minor: p.r, main: [q.r] });
  // свободные торцы
  for (const E of ends) if (E.free) JUNCTIONS.push({ type: pierLike(roads[E.r]) ? 'въезд на пирс или место' : 'тупик', x: E.x, z: E.z, angle: 0, minor: E.r, main: [], s: E.s, e: E.e });

  // примыкания: торец упирается в сквозную дорогу (или в сквозную пару узла)
  const dMain = (main, x, z) => { let d = Infinity; for (const q of main) { const p = roadProj(q, x, z); if (p && !p.out) d = Math.min(d, p.d); } return d; };
  for (const E of ends) {
    if (!E.main) continue;
    const J = roads[E.r], mk = J.mk, sg = E.e ? 1 : -1, back = (t) => E.s - sg * t;           // t — путь от торца вглубь дороги
    // угол к главной
    const pm = roadProj(E.main[0], E.x, E.z), tm = roadPoint(roads[E.main[0]], pm ? pm.s : 0);
    let ang = Math.acos(Math.min(1, Math.abs(E.dx * tm[2] + E.dz * tm[3]))) * DEG;
    if (E.three) for (const F of ends) if (F.mate && E.main.includes(F.r) && Math.hypot(F.x - E.x, F.z - E.z) < NODE_R * 2) ang = Math.min(ang, Math.acos(Math.min(1, Math.abs(E.dx * F.dx + E.dz * F.dz))) * DEG);
    const fork = ang < FORK_ANGLE, give = fork || pierLike(J);
    // где линия со смещением o выходит за отметку lim от оси главной (идём от торца вглубь)
    // (линия может начинаться за главной — торец продлён на END_EXT, — поэтому ищем последнюю точку под главной)
    const leave = (o, lim) => {
      let last = -END_EXT - 0.25;
      for (let t = -END_EXT; t < 120 && t - last < 25; t += 0.25) { const [x, z] = roadPoint(J, back(t), o); if (dMain(E.main, x, z) <= lim) last = t; }
      return last + 0.25;
    };
    let tEdge, tC, tBar;
    if (fork) {                                        // линии начинаются там, где полотно целиком вышло из-под главной
      tEdge = [Math.max(leave(-halfR, halfR + 0.1), leave(halfR, halfR + 0.1))]; tEdge.push(tEdge[0]);
      tBar = tEdge[0]; tC = tBar;
    } else {
      tEdge = [leave(-EDGE_O, halfR - EDGE_IN), leave(EDGE_O, halfR - EDGE_IN)];
      const lane = STOP_SIDE * sg * (EDGE_O - LINE_W / 2);
      tBar = Math.max(leave(0, halfR - EDGE_IN + STOP_BACK), leave(lane, halfR - EDGE_IN + STOP_BACK)); tC = tBar;
    }
    if (tEdge[0] >= 119 || tEdge[1] >= 119) { odd.push(`торец дороги «${J.name}» у x=${E.x.toFixed(0)} z=${E.z.toFixed(0)}: не найден выход из-под главной`); continue; }
    mk.edge[0][E.e] = back(tEdge[0]); mk.edge[1][E.e] = back(tEdge[1]);
    mk.centre[E.e] = back(tC); mk.clip[E.e] = true;

  return pixelTexture(w, h, (g) => {
    const n = colors.length;
    for (let i = 0; i < (vertical ? w : h); i++) {
      g.fillStyle = colors[Math.floor(i / ((vertical ? w : h) / n)) % n];
      if (vertical) g.fillRect(i, 0, 1, h); else g.fillRect(0, i, w, 1);
    }

}

}

      for (let n = power * share * 130 * dt + Math.random(); n >= 1; n--) {
        if (dust.length >= DUST_MAX) dust.shift();
        dust.push({ x: x + (Math.random() - 0.5) * 0.5, y: surfaceY(x, z) + 0.1, z: z + (Math.random() - 0.5) * 0.5, col,
          vx: vx * 0.12 + (Math.random() - 0.5) * 2.2, vy: 0.7 + Math.random() * 1.8, vz: vz * 0.12 + (Math.random() - 0.5) * 2.2,
          age: 0, life: 0.9 + Math.random() * 0.9, size: 0.45 + Math.random() * 0.4, shade: 0.9 + Math.random() * 0.2 });
      }
    }
  }
  if (!dust.length) { dustGeo.setDrawRange(0, 0); return; }
  const P = dustGeo.attributes.position.array, C = dustGeo.attributes.aColor.array, S = dustGeo.attributes.aSize.array, A = dustGeo.attributes.aAlpha.array;
  const light = 1 - 0.78 * skyNow.night;                                      // ночью пыль тёмная
  let n = 0;
  for (let i = 0; i < dust.length; i++) {
    const d = dust[i];
    d.age += dt;
    if (d.age >= d.life) continue;
    const k = d.age / d.life;
    if (d.g) {                                                                // капля: летит и падает, на воде гаснет
      const drag = Math.exp(-0.9 * dt); d.vx *= drag; d.vz *= drag; d.vy -= d.g * dt;
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      if (d.vy < 0 && d.y < d.floor) continue;
    } else {
      const drag = Math.exp(-2.2 * dt);
      d.vx *= drag; d.vz *= drag; d.vy *= Math.exp(-1.2 * dt);
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
    }
    P[n * 3] = d.x; P[n * 3 + 1] = d.y; P[n * 3 + 2] = d.z;
    C[n * 3] = d.col.r * d.shade * light; C[n * 3 + 1] = d.col.g * d.shade * light; C[n * 3 + 2] = d.col.b * d.shade * light;
    S[n] = d.size * (1 + (d.grow ?? 2.6) * k); A[n] = (d.a0 || 0.62) * (1 - k) * (1 - k);
    dust[n++] = d;
  }
  dust.length = n;
  dustGeo.setDrawRange(0, n);
  for (const a of ['position', 'aColor', 'aSize', 'aAlpha']) dustGeo.attributes[a].needsUpdate = true;
  dustMat.uniforms.uScale.value = lowRT.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}

// ---------- Следы шин (ручник) ----------
// Кольцевой буфер квадов под задними колёсами; старые следы перезаписываются новыми.
const SKID_MAX = 4000, SKID_W = 0.3;
const SKID_LIFT = 0.035;                 // м — над поверхностью: выше плит перрона, полосы и мощения (они лежат на 3–5 см над землёй)
const skidPos = new Float32Array(SKID_MAX * 4 * 3);
const skidIdx = [];
for (let i = 0; i < SKID_MAX; i++) { const b = i * 4; skidIdx.push(b, b + 2, b + 1, b + 1, b + 2, b + 3); }
const skidGeo = new THREE.BufferGeometry();
skidGeo.setAttribute('position', new THREE.BufferAttribute(skidPos, 3));
skidGeo.setIndex(skidIdx);
const skidMesh = new THREE.Mesh(skidGeo, new THREE.MeshBasicMaterial({
  color: 0x1c1616, transparent: true, opacity: 0.55, depthWrite: false, side: THREE.DoubleSide }));
skidMesh.frustumCulled = false;                    // буфер заполняется на лету
scene.add(skidMesh);

let skidNext = 0;
const skidLast = [null, null];
function updateSkids(on) {
  const c = Math.cos(car.heading), s = Math.sin(car.heading);
  [[-CAR.trackRear, CAR.axle], [CAR.trackRear, CAR.axle]].forEach(([lx, lz], w) => {   // локальные x, z задних колёс
    if (!on) { skidLast[w] = null; return; }
    const x = car.x + lx * c + lz * s, z = car.z - lx * s + lz * c;
    const prev = skidLast[w];
    if (prev) {
      const dx = x - prev[0], dz = z - prev[1], len = Math.hypot(dx, dz);
      if (len < 0.05) return;
      const nx = (-dz / len) * SKID_W / 2, nz = (dx / len) * SKID_W / 2;
      const y0 = surfaceY(prev[0], prev[1]) + SKID_LIFT, y1 = surfaceY(x, z) + SKID_LIFT;   // чуть над покрытием
      skidPos.set([prev[0] - nx, y0, prev[1] - nz, prev[0] + nx, y0, prev[1] + nz,
                   x - nx, y1, z - nz, x + nx, y1, z + nz], skidNext * 12);
      skidNext = (skidNext + 1) % SKID_MAX;
      skidGeo.attributes.position.needsUpdate = true;
    }
    skidLast[w] = [x, z];
  });
}

// ---------- Состояние ----------
// старт: правая полоса (движение правостороннее)

// ---------- Музыка ----------
// Браузер разрешает звук только после действия пользователя — стартуем на первую клавишу/клик.
const music = document.getElementById('music');
music.addEventListener('ended', () => { if (radio.mode !== 'stream') { music.currentTime = 0; if (!userPaused) music.play().catch(() => {}); } });
const TD = window.TRACK_DATA || null;
let userPaused = false;                  // пауза по P держится, пока P не нажата снова
const startMusic = () => { if (!userPaused && !(radio.menuOpen)) radioStart(); };
addEventListener('pointerdown', (e) => { if (!radio.menuOpen) { startMusic(); soundStart(); } });

// огибающая баса, сглаженная вперёд-назад (без сдвига по времени)
const bassEnv = (() => {
  if (!TD) return null;
  const a = TD.bass.map(v => v / 99), k = 0.25;
  for (let i = 1; i < a.length; i++) a[i] += (a[i - 1] - a[i]) * (1 - k);
  for (let i = a.length - 2; i >= 0; i--) a[i] += (a[i + 1] - a[i]) * (1 - k);
  return a;
})();

// индекс последнего события с временем <= t (бинарный поиск по [[t, сила], ...])
function lastBefore(list, t) {
  let lo = 0, hi = list.length - 1, r = -1;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (list[m][0] <= t) { r = m; lo = m + 1; } else hi = m - 1; }
  return r;
}

// крен/проседание кузова от музыки в момент t
function musicPose(t) {
  const pose = { roll: 0, y: 0, pitch: 0 }, D = musicData();   // данные даёт радио: встроенный track_data или живой анализ потока
  if (!D) return pose;
  // крен: маятник с крайними точками на долях, сторона чередуется (у живых данных номер доли хранит чётность)
  const bi = lastBefore(D.beats, t);
  if (bi >= 0 && bi < D.beats.length - 1) {
    const [b0, s0] = D.beats[bi], [b1, s1] = D.beats[bi + 1];
    const u = (t - b0) / (b1 - b0);
    const s = s0 + (s1 - s0) * u;                    // сила доли, плавно между долями
    pose.roll = SWAY_ROLL * Math.min(1, s) * Math.cos(Math.PI * (bi + u));   // живой список долей начинается с чётной — сторона не скачет
  }
  // бочка: кузов подпрыгивает и мягко садится с затухающим отскоком
  for (let i = lastBefore(D.kicks, t); i >= 0 && t - D.kicks[i][0] < 0.6; i--) {
    const d = t - D.kicks[i][0], s = D.kicks[i][1];
    const r = Math.exp(-d / 0.14) * Math.cos(d * 16);
    pose.y += KICK_HOP * s * r;
    pose.pitch += 0.008 * s * r;                      // нос подлетает чуть выше кормы
  }
  pose.y += BASS_LIFT * (D === TD ? bassEnv[Math.min(bassEnv.length - 1, Math.floor(t * TD.fps))] || 0 : D.bassAt(t));
  return pose;
}

// перемотка встроенного трека (поток мотает радио)
function seekMusic(t) {
  if (!isFinite(music.duration)) return;
  music.currentTime = Math.max(0, Math.min(music.duration - 0.1, t));
}

// ---------- Ввод ----------
function nearestFrameIdx(x, z) {
  let best = Infinity, bi = 0;
  for (let i = 0; i < SEG; i++) {
    const p = frames[i].p, d = (p.x - x) ** 2 + (p.z - z) ** 2;
    if (d < best) { best = d; bi = i; }
  }
  return bi;
}
function seededRandom(seed) {            // mulberry32
  const rnd = () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  rnd.state = () => seed;                // состояние: seededRandom(rnd.state()) продолжит тот же ряд чисел
  return rnd;
}
const keys = {};
addEventListener('keydown', e => {
  if (radio.menuOpen) { if (e.code === 'Escape') radioMenu(false); return; }   // меню открыто — клавиши в поля, не в игру

  startMusic(); soundStart();              // звук мотора, шин и моря (sound.js) — после первого нажатия
  if (!e.repeat && soundKeys(e)) return;   // громкость звука: «−», «=», M
  if (e.code === 'KeyO' && !e.repeat) { autopilot.on = !autopilot.on; if (autopilot.on) autopilotResync(); }
  if (e.code === 'KeyC' && !e.repeat) nextCar(1);       // следующая машина
  if (e.code === 'KeyJ' && !e.repeat) { driftSet(!DRIFT.on); SOUND.note = { text: DRIFT.on ? 'DRIFT ASSIST ON' : 'DRIFT ASSIST OFF', until: performance.now() + 2000 }; }   // сравнить со старым заносом
  keys[e.code] = true; if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => {
  keys[e.code] = false;
});
addEventListener('blur', () => { for (const c in keys) keys[c] = false; });   // окно потеряло фокус — клавиши отпущены
const k = (...codes) => codes.some(c => keys[c]);

// ---------- Автопилот (O) ----------
// Держит свою полосу через "погоню за точкой" впереди, как живой водитель:
// на прямых — центр полосы с едва заметным дрейфом, в поворотах срезает внутрь
// (в левых — на осевую, в правых — на краевую), то сильнее, то слабее.
// Нажатые клавиши руля/газа перебивают автопилот, пока их держишь.
const AUTO_SPEED = 125 / 3.6;            // м/с — на прямых мчит
const AUTO_SPEED_MIN = 45 / 3.6;         // м/с — медленнее не едет даже в самом крутом повороте
const AUTO_LAT = 6.5;                    // м/с² — с каким боковым ускорением проходит повороты
const AUTO_BRAKE = 4.5;                  // м/с² — как тормозит перед поворотом
const BRAKE_LOOK = 250;                  // м — насколько заранее видит поворот для сброса скорости
const LANE_OFFSET = ROAD_WIDTH / 4;      // центр правой полосы от оси дороги
const STRAIGHT_DRIFT = 0.15;             // м — дрейф на прямых
const CORNER_CUT = 0.9;                  // м — максимальный срез в повороте (1.25 = касание линии)
const CUT_FULL_K = 0.008;                // 1/м — кривизна, при которой срез полный (поворот радиусом 125 м)
const autopilot = { on: false, idx: 0, t: 0 };
const FRAME_STEP = TRACK_LEN / SEG;

// кривизна трассы по кадрам (+ = влево), сглаженная окном ~25 м
const trackCurv = (() => {
  const th = frames.slice(0, SEG).map(f => Math.atan2(f.side.z, -f.side.x));   // угол касательной
  const raw = th.map((a, i) => {
    let d = th[(i + 1) % SEG] - a;
    d = Math.atan2(Math.sin(d), Math.cos(d));
    return d / FRAME_STEP;
  });
  const W = 3;
  return raw.map((_, i) => {
    let s = 0;
    for (let j = -W; j <= W; j++) s += raw[(i + j + SEG) % SEG];
    return s / (2 * W + 1);
  });
})();

// при включении — ближайшая точка по всей трассе (машина могла уехать куда угодно)
function autopilotResync() {
  let best = Infinity;
  frames.forEach(({ p }, i) => {
    const dd = (p.x - car.x) ** 2 + (p.z - car.z) ** 2;
    if (i < SEG && dd < best) { best = dd; autopilot.idx = i; }
  });
}

function autopilotInput(dt) {
  autopilot.t += dt;
  // ближайший кадр трассы: ищем рядом с прошлым
  let best = Infinity, bi = autopilot.idx;
  for (let d = -25; d <= 60; d++) {
    const i = (((autopilot.idx + d) % SEG) + SEG) % SEG, p = frames[i].p;
    const dd = (p.x - car.x) ** 2 + (p.z - car.z) ** 2;
    if (dd < best) { best = dd; bi = i; }
  }
  autopilot.idx = bi;
  // точка впереди в своей полосе
  const t = autopilot.t;
  const look = 10 + 0.65 * Math.abs(car.speed);
  const ahead = Math.round(look / FRAME_STEP);
  const f = frames[(bi + ahead) % SEG];
  // на прямой — лёгкий дрейф; в повороте — срез внутрь, заранее (смотрим кривизну дальше точки цели)
  const drift = STRAIGHT_DRIFT * (0.6 * Math.sin(t * 0.11) + 0.4 * Math.sin(t * 0.29 + 2.3));
  const kAhead = trackCurv[(bi + ahead + Math.round(20 / FRAME_STEP)) % SEG];
  const cutAmount = Math.min(1, Math.abs(kAhead) / CUT_FULL_K);
  const cutMood = 0.65 + 0.35 * Math.sin(t * 0.23 + 0.8);      // то срезает сильнее, то аккуратнее
  const cut = -Math.sign(kAhead) * CORNER_CUT * cutAmount * cutMood;   // влево = к оси (меньше offset)
  const off = LANE_OFFSET + drift + cut;
  const tx = f.p.x + f.side.x * off - car.x, tz = f.p.z + f.side.z * off - car.z;
  const c = Math.cos(car.heading), s = Math.sin(car.heading);
  const lat = -(tx * c - tz * s);                        // смещение цели влево от машины
  const steer = Math.atan(2 * CAR.wheelbase * lat / (tx * tx + tz * tz));
  // скорость: каждый поворот впереди проходит с боковым ускорением AUTO_LAT и тормозит под него заранее
  let vT = AUTO_SPEED;
  for (let j = 0; j < BRAKE_LOOK / FRAME_STEP; j += 2) {
    const vc = Math.max(AUTO_SPEED_MIN, Math.sqrt(AUTO_LAT / Math.max(1e-5, Math.abs(trackCurv[(bi + j) % SEG]))));
    vT = Math.min(vT, Math.sqrt(vc * vc + 2 * AUTO_BRAKE * j * FRAME_STEP));
  }
  const dv = vT - car.speed;
  return { steer, gas: Math.min(1, Math.max(0, dv * 0.4)), brake: dv < -1 ? Math.min(0.35, -dv * 0.08) : 0 };   // мягко, ~5 м/с² максимум
}

// (поездка в ангар по F убрана по просьбе Влада)

// ---------- Столкновения ----------
// Машина — два круга, спереди и сзади. Круг, зашедший в стену, выталкивается; по новым положениям кругов
// пересчитываются центр и курс — машина разворачивается вдоль стены и скользит по ней.
// Скорость гасится тем сильнее, чем прямее удар: вскользь — почти нет, в лоб — до нуля.
const HIT_STEP = 0.5;                    // м — движение за кадр дробится на такие шаги (тонкий забор не проскочить)
// Откат назад от удара (задание Влада): от твёрдого, что выдержало удар (стены, здания, твёрдые прямоугольники, стоящая
// машина, в которую упёрлись), и от стоящих машин (vehBump в vehicles.js). Дальность задаётся прямо в метрах:
// RECOIL_AT_100 м при ударе в лоб на 100 км/ч, пропорционально скорости, не больше RECOIL_MAX; вскользь (до RECOIL_GLANCE°
// к стене) отката нет — машина скользит вдоль стены; между ними — плавно по прямоте удара. Откат — отдельное движение
// машины (car.kick: куда и с какой скоростью), гаснущее с постоянным замедлением RECOIL_DECEL: его длина не зависит от
// наката и трения машины. Один удар — один откат: пока машина откатывается, нового нет; толчок медленнее RECOIL_MIN_V
// (упёрлись в стену и давим газ) — без отката, иначе машину дребезжит.
const RECOIL_AT_100 = 4, RECOIL_MAX = 7, RECOIL_GLANCE = 20, RECOIL_DECEL = 14, RECOIL_MIN_V = 1.5;
// прямота удара c (1 — в лоб, 0 — вдоль) -> доля отката 0…1
function recoilShare(c) { const g = Math.sin(RECOIL_GLANCE * Math.PI / 180), t = Math.max(0, Math.min(1, (c - g) / (1 - g))); return t * t * (3 - 2 * t); }
// дальность отката, м: скорость сближения v (м/с, вдоль хода), прямота c. Растёт как v^1.5: на 100 км/ч — RECOIL_AT_100,
// а на малой скорости быстро сходит на нет — иначе, если держать газ в стену, машина отскакивает и снова разгоняется
// в стену без конца (линейный откат даёт повторный удар с той же скоростью)
function recoilDist(v, c) { return v < RECOIL_MIN_V ? 0 : Math.min(RECOIL_MAX, RECOIL_AT_100 * Math.pow(v / (100 / 3.6), 1.5)) * recoilShare(c); }
// начать откат в сторону (nx, nz) на d м
function carRecoil(nx, nz, d) {
  if (car.kick || d < 0.03) return;
  car.kick = { nx, nz, v: Math.sqrt(2 * RECOIL_DECEL * d), d };
}
let collideN = null;                     // нормаль последней стены, в которую упёрся collide() (от стены к машине)
function collide() {
  const fx = -Math.sin(car.heading), fz = -Math.cos(car.heading), dir = Math.sign(car.speed);
  let tx = -Math.sin(car.course) * dir, tz = -Math.cos(car.course) * dir;                               // куда машина движется
  const pts = [[car.x + fx * HIT_ZF, car.z + fz * HIT_ZF], [car.x - fx * HIT_ZR, car.z - fz * HIT_ZR]];   // перед, зад
  let hit = false, kicked = false, kickAlong = 0;
  // только стены рядом с машиной (с запасом: круг, вытолкнутый из одной стены, может зайти в соседнюю)
  const pad = HIT_R + 2, near = wallsNear(Math.min(pts[0][0], pts[1][0]) - pad, Math.min(pts[0][1], pts[1][1]) - pad, Math.max(pts[0][0], pts[1][0]) + pad, Math.max(pts[0][1], pts[1][1]) + pad);
  if (!near.length && !breakWalls.length) return;
  for (const p of pts) for (const W of [near, breakWalls]) for (const [x1, z1, x2, z2] of W) {
    const wx = x2 - x1, wz = z2 - z1;
    const t = Math.max(0, Math.min(1, ((p[0] - x1) * wx + (p[1] - z1) * wz) / (wx * wx + wz * wz)));
    const dx = p[0] - (x1 + wx * t), dz = p[1] - (z1 + wz * t), d = Math.hypot(dx, dz);
    if (d >= HIT_R || d < 1e-6) continue;
    const nx = dx / d, nz = dz / d;                      // от стены к кругу
    p[0] += nx * (HIT_R - d); p[1] += nz * (HIT_R - d);
    const vn = tx * nx + tz * nz;                        // < 0 — движемся в стену: 0 — вскользь, −1 — в лоб
    collideN = [nx, nz];
    if (vn < 0) {
      soundImpact(Math.abs(car.speed * vn));              // толчок или удар — по скорости сближения
      if (!car.kick) { carRecoil(nx, nz, recoilDist(Math.abs(car.speed), -vn)); kicked = !!car.kick; if (kicked) kickAlong = Math.sqrt(Math.max(0, 1 - vn * vn)); }   // прямой удар — откат назад от стены (один раз за удар); kickAlong — доля хода вдоль стены

  // джойстик обзора (touch.js): камера обходит машину по кругу (до 180° в обе стороны) и поднимается или опускается; отпустил — плавно обратно
  // дожал обзор до края — камера ещё и медленно кружит (40°/с); отпустил — возвращается за машину кратчайшим путём

  camPos.set(car.x - fx * back, 0, car.z - fz * back);
  camPos.y = Math.max(car.y + up, groundY(camPos.x, camPos.z) + 1.2, 0.9);   // не под землёй (склон позади) и не под водой

}

// ---------- Контр-блики ----------
// Когда камера разворачивается к солнцу: общая засветка, ореол, горизонтальный луч
// и "призраки" объектива на линии солнце -> центр кадра (и дальше за центр).
const FAR_GHOST_ALPHA = 0.7;             // прозрачнее только призраки за центром кадра (4–6); 1 — как остальные
const GHOSTS = [   // [позиция на линии (0 — солнце, 1 — центр), радиус px, цвет, яркость, кольцо?]
  [0.35, 5, '255,220,120', 0.35], [0.6, 10, '255,120,90', 0.18], [0.85, 3, '255,255,200', 0.4],
  [1.25, 16, '190,120,255', 0.14], [1.5, 7, '120,255,180', 0.2], [1.9, 26, '255,150,80', 0.12, true],
];
const _sunNdc = new THREE.Vector3(), _view = new THREE.Vector3(), _toSun = new THREE.Vector3();
const _ray = new THREE.Raycaster(), _camLocal = new THREE.Vector3();
let flareVis = 1;                                    // 0..1: плавное гашение, когда солнце закрыто ангаром
function sunBlocked() {

// блайндеры на экране: тёплое сияние вокруг каждого + лёгкая засветка кадра, когда смотрят "в лицо".
// Без призраков и лучей. Стены ангара закрывают (сквозь проём ворот — видно).
const _bp = new THREE.Vector3(), _bf = new THREE.Vector3(), _bc = new THREE.Vector3(), _bn = new THREE.Vector3();
function drawBlinders() {

  const g = fx2d, W = RES_W, H = RES_H;
  let veil = 0;
  g.globalCompositeOperation = 'lighter';
  for (const b of blinders) {

function drawFlare(dt) {
  const W = RES_W, H = RES_H, g = fx2d;
  g.clearRect(0, 0, W, H);
  camera.getWorldDirection(_view);
  _toSun.copy(sunGroup.position).sub(camera.position).normalize();

  streak.addColorStop(0, 'rgba(255,160,90,0)'); streak.addColorStop(0.5, `rgba(255,220,170,${0.3 * I})`);

// ---------- Птицы ----------
// Изредка стайка пересекает небо впереди: силуэты машут крыльями и иногда планируют.
// Стайка летит поперёк курса и проходит над дорогой в BIRD_CROSS м перед машиной — там, где машина окажется
// к тому моменту. На месте и на малом ходу стайка влетает из-за края кадра. На ходу край кадра ей не догнать
// (обзор слишком широкий), поэтому она проявляется вдали, а машина сама к ней подъезжает.
const BIRD_EVERY = [15, 40];             // с — пауза между стайками (случайно в диапазоне)
const BIRD_CROSS = [90, 170];            // м — на каком удалении перед машиной стайка пересекает курс
const BIRD_FAR = 600;                    // м — на таком удалении птица не больше пикселя
const BIRD_FADE = 1.5;                   // с — проявление и растворение

const BIRD_BODY_GEO = new THREE.BoxGeometry(0.3, 0.2, 0.9), BIRD_WING_GEO = new THREE.BoxGeometry(1.4, 0.06, 0.5);
const flocks = [];
let nextFlock = 6;                       // первая стайка вскоре после старта

function makeBird(mat) {
  const b = new THREE.Group();           // вперёд = +Z
  b.add(new THREE.Mesh(BIRD_BODY_GEO, mat));

  for (const s of [-1, 1]) {

    const w = new THREE.Mesh(BIRD_WING_GEO, mat);

    pivot.add(w); b.add(pivot); wings.push([pivot, s]);

}
// тангенс половины горизонтального угла обзора
const viewHalfTan = () => Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * RES_W / RES_H;
function spawnFlock() {
  const n = 3 + ((Math.random() * 5) | 0), side = Math.random() < 0.5 ? -1 : 1;
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
  const h = 25 + Math.random() * 35, speed = 10 + Math.random() * 5, along = (Math.random() - 0.5) * 4;
  const cross = BIRD_CROSS[0] + Math.random() * (BIRD_CROSS[1] - BIRD_CROSS[0]);
  const closing = car.speed - along;                   // м/с — как быстро машина сближается со стайкой вдоль курса
  // сколько лететь до пересечения курса: старт сразу за краем кадра (если стайка успевает) или издалека — что раньше
  const kEdge = viewHalfTan() * 1.03;

  const qa = closing * closing + speed * speed, qb = cross * closing;   // hypot(cross + closing·t, speed·t) = BIRD_FAR
  const tFar = (-qb + Math.sqrt(qb * qb + qa * (BIRD_FAR * BIRD_FAR - cross * cross))) / qa;

  flock.position.set(camPos.x + fx * meet - vx * tc, h + over, camPos.z + fz * meet - vz * tc);

function updateBirds(dt, time) {

  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw), rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
  const kOut = viewHalfTan() * 1.1;
  for (let i = flocks.length - 1; i >= 0; i--) {

    f.g.position.x += f.vx * dt; f.g.position.z += f.vz * dt;
    for (const b of f.g.children) {
      const u = b.userData;
      const gliding = Math.sin(time * 0.6 + u.glide) > 0.55;      // иногда планирует
      const flap = gliding ? 0.12 : 0.15 + 0.55 * Math.sin(time * 9 + u.phase);
      for (const [pivot, s] of u.wings) pivot.rotation.z = s * flap;

  }
}

// ---------- Экран: приборы ----------
// Пиксельный шрифт 3×5 на сетке игры. Внизу слева — карта острова и компас, по центру — время суток, правее — радио,
// в правом нижнем углу — скорость; собранные бананы и кокосы — в правом верхнем.
const HUD_BANANA = ['1000001', '1100011', '0111110', '0011100'];   // значок: банан-"улыбка"
const HUD_COCONUT = ['01110', '11111', '11111', '11111', '01110'];   // значок: кокос
const HUD_LEAF = ['0001000', '1001001', '0101010', '0011100', '1111111', '0001000'];   // значок: лист конопли
const HUD_LEAF_GREEN = 'rgba(96,232,84,0.95)';
const HUD_WHITE = 'rgba(255,255,255,0.85)', HUD_YELLOW = 'rgba(255,214,46,0.95)', HUD_GREEN = 'rgba(160,214,90,0.95)';
// знак разобран один раз на горизонтальные отрезки [x, y, длина]; строка рисуется одной заливкой, а не по точке на пиксель
const glyphRuns = new WeakMap();
function runsOf(rows) {
  let runs = glyphRuns.get(rows);
  if (!runs) {
    runs = [];
    rows.forEach((row, y) => { for (let i = 0; i < row.length; i++) if (row[i] === '1') { let e = i; while (e + 1 < row.length && row[e + 1] === '1') e++; runs.push(i, y, e - i + 1); i = e; } });
    glyphRuns.set(rows, runs);
  }

}
function hudGlyphs(glyphs, x0, y0, color, shadow = true, g = fx2d) {   // g — куда рисовать (обычно — холст приборов)
  for (let pass = shadow ? 0 : 1; pass < 2; pass++) {                        // тень, потом знаки
    const d = pass ? 0 : 1;
    g.fillStyle = pass ? color : 'rgba(0,0,0,0.55)';
    g.beginPath();
    let x = x0 + d;
    for (const rows of glyphs) {
      const top = y0 + d - Math.max(0, rows.length - 5), runs = runsOf(rows);   // знак выше пяти строк (Й) растёт вверх
      for (let k = 0; k < runs.length; k += 3) g.rect(x + runs[k], top + runs[k + 1], runs[k + 2], 1);
      x += rows[0].length + 1;
    }
    g.fill();
  }
}
function drawHud() {
  const speed = Math.round(Math.abs(car.speed) * 3.6) + ' KM/H';
  if (DEV_PLACES) drawTeleBtn();                                           // между картой и спидометром — кнопка телепортов
  hudGlyphs(hudText(speed), TELE_BTN.cx() + TELE_BTN.r + 6, RES_H - 11, HUD_WHITE);    // спидометр — слева, правее мини-карты и кнопки телепортов
  // собранное — вверху по центру (на месте прежней листалки машин), слева направо: бананы, кокосы, листья конопли
  const bt = hudText(String(bananaCount)), ct = hudText(String(coconutCount)), lt = hudText(String(leafCount));
  const W = 10 + hudWidth(bt) + 7 + 8 + hudWidth(ct) + 6 + 10 + hudWidth(lt);
  let x = Math.round((RES_W - W) / 2);
  hudGlyphs([HUD_BANANA], x, 7, HUD_YELLOW);
  hudGlyphs(bt, x += 10, 6, bananaFlash > 0 ? HUD_YELLOW : HUD_WHITE);   // только что собран — жёлтым
  hudGlyphs([HUD_COCONUT], x += hudWidth(bt) + 7, 6, HUD_GREEN);
  hudGlyphs(ct, x += 8, 6, coconutFlash > 0 ? HUD_GREEN : HUD_WHITE);
  hudGlyphs([HUD_LEAF], x += hudWidth(ct) + 6, 5, HUD_LEAF_GREEN);

  drawCarPick();
  drawClock();
  drawMap();
  drawCompass();

    const g = hudText(SOUND.note.text);

// Часы в левом верхнем углу: циферблат с часовой и минутной стрелками и время ЧЧ:ММ рядом. Циферблат — ручка: его тянут
// по кругу, и время идёт за указателем (полный оборот — 12 часов, упора нет: можно крутить сколько угодно в обе стороны).
// Показывается поясное время игрока (солнечное + CLOCK_SHIFT), так что сутки на часах идут с 00:00 до 24:00.
const CLOCK_CX = 14, CLOCK_CY = 14, CLOCK_R = 10;         // в левом верхнем углу экрана (просил Влад); радиус 10 — на 15 % больше прежних 9, сколько позволяют пиксели
const clockShown = () => (dayTime + CLOCK_SHIFT) % 24;
function drawClock() {
  const g = fx2d, t = clockShown(), night = skyNow.night > 0.5;
  const px = (x, y, c) => { g.fillStyle = c; g.fillRect(Math.round(CLOCK_CX + x), Math.round(CLOCK_CY + y), 1, 1); };
  // циферблат: тёмный круг, светлый обод, двенадцать меток (четыре главные длиннее)
  g.fillStyle = dayDrag ? 'rgba(0,0,0,0.6)' : 'rgba(0,0,0,0.42)';
  for (let y = -CLOCK_R; y <= CLOCK_R; y++) { const w = Math.floor(Math.sqrt(CLOCK_R * CLOCK_R - y * y + 0.6)); g.fillRect(CLOCK_CX - w, CLOCK_CY + y, 2 * w + 1, 1); }

  const hand = (a, len, c) => { for (let d = 0; d <= len; d += 0.5) px(Math.sin(a) * d, -Math.cos(a) * d, c); };
  hand((t % 1) * 6.2832, CLOCK_R - 2.5, HUD_WHITE);                                               // минутная

// Мини-карта в левом нижнем углу: весь остров; карта крутится так, что «вперёд» всегда вверху, стрелка — машина.

  MERGE.byG = new Map();
  MERGE.own = new Set(pierGroups);
  const skip = new Set([beetle, bananaRoot, starGroup, sunGroup, hills]);
  for (const o of scene.children) if (o.type === 'Group' && !skip.has(o)) MERGE.own.add(o);
  for (const g of [...MERGE.own, null]) MERGE.list.push({ g, roots: g ? [g] : roadMeshes, proxies: null, tracked: null, parents: null, sig: 0, since: -1, gone: 0, retry: 0, shown: false, x: 0, z: 0, r: 0 });
  for (const E of MERGE.list) if (E.g) MERGE.byG.set(E.g, E);
}
// материал сводного меша для материалов без текстур: всё, кроме цвета, — как у исходного
function mergeMat(m, key) {
  let b = MERGE.mats.get(key);
  if (!b) MERGE.mats.set(key, b = new THREE.MeshLambertMaterial({ vertexColors: true, side: m.side, emissive: m.emissive.clone(), emissiveIntensity: m.emissiveIntensity,
    alphaTest: m.alphaTest, polygonOffset: m.polygonOffset, polygonOffsetFactor: m.polygonOffsetFactor, polygonOffsetUnits: m.polygonOffsetUnits, depthWrite: m.depthWrite, depthTest: m.depthTest, fog: m.fog, wireframe: m.wireframe }));
  return b;
}
const inScene = (o) => { for (; o; o = o.parent) { if (o === scene) return true; if (!o.visible) return false; } return false; };
function mergeOk(o) {
  const m = o.material, a = o.geometry.attributes, dr = o.geometry.drawRange;
  if (o.isInstancedMesh || Array.isArray(m) || !m.isMeshLambertMaterial || m.transparent || !m.visible || o.layers.mask !== 1 || o.userData.proxy) return false;
  if (m.onBeforeCompile !== THREE.Material.prototype.onBeforeCompile || m.lightMap || m.aoMap || m.morphTargets) return false;
  if (!a.position || !a.normal || !(a.position.array instanceof Float32Array) || !(a.normal.array instanceof Float32Array) || a.position.itemSize !== 3) return false;
  if (m.vertexColors && !(a.color && a.color.itemSize === 3 && a.color.array instanceof Float32Array)) return false;
  if ((m.map || m.alphaMap || m.emissiveMap || m.specularMap) && !(a.uv && a.uv.array instanceof Float32Array)) return false;

}
// Сборка идёт по частям (job): сначала отбор мешей и разметка массивов, потом перенос вершин — меш за мешем, пока не выйдет
// время кадра (until), и в конце готовые меши встают в сцену. Большой посёлок или аэродром собирается за несколько кадров без рывка.
function mergeStart(E) {

  const walk = (o) => {
    if (!o.visible || (o !== g && (MERGE.own.has(o) || o._movedAt > E.since))) return;       // спрятано; вложенная группа со своей дальностью; движется
    if (o.isMesh && mergeOk(o)) {
      const m = o.material, a = o.geometry.attributes, bake = !(m.map || m.alphaMap || m.emissiveMap || m.specularMap || m.envMap);
      const key = bake ? 'bake|' + [m.side, m.emissive.getHex(), m.emissiveIntensity, m.alphaTest, m.polygonOffset ? m.polygonOffsetFactor + ':' + m.polygonOffsetUnits : '', m.depthWrite, m.depthTest, m.fog, m.wireframe, o.renderOrder].join('|') : m.uuid + '|' + o.renderOrder;
      let s = sets.get(key);
      if (!s) sets.set(key, s = { mat: bake ? mergeMat(m, key) : m, bake, order: o.renderOrder, list: [], nv: 0, ni: 0 });
      s.list.push(o); s.nv += a.position.count; s.ni += o.geometry.index ? o.geometry.index.count : a.position.count;

  for (const s of sets.values()) {
    const uvs = !!(s.mat.map || s.mat.alphaMap || s.mat.emissiveMap || s.mat.specularMap);
    s.P = new Float32Array(s.nv * 3); s.N = new Float32Array(s.nv * 3); s.C = s.mat.vertexColors ? new Float32Array(s.nv * 3) : null; s.U = uvs ? new Float32Array(s.nv * 2) : null;

function mergeStep(job, until) {           // true — работа закончена (меши в сцене или сборка отменена)
  const E = job.E;

    const s = job.sets[job.si], { P, N, C, U, I } = s;
    for (; s.at < s.list.length; s.at++) {
      if (!first && performance.now() >= until) return false;
      first = false;
      const o = s.list[s.at], a = o.geometry.attributes, pa = a.position.array, na = a.normal.array, n = a.position.count, e = o.matrixWorld.elements, v = s.v;
      const nm = MERGE.m3.getNormalMatrix(o.matrixWorld).elements, flip = o.matrixWorld.determinant() < 0;   // зеркальный меш — грани в другую сторону
      for (let i = 0, j = v * 3; i < n * 3; i += 3, j += 3) {
        const x = pa[i], y = pa[i + 1], z = pa[i + 2], nx = na[i], ny = na[i + 1], nz = na[i + 2];
        P[j] = e[0] * x + e[4] * y + e[8] * z + e[12]; P[j + 1] = e[1] * x + e[5] * y + e[9] * z + e[13]; P[j + 2] = e[2] * x + e[6] * y + e[10] * z + e[14];
        const wx = nm[0] * nx + nm[3] * ny + nm[6] * nz, wy = nm[1] * nx + nm[4] * ny + nm[7] * nz, wz = nm[2] * nx + nm[5] * ny + nm[8] * nz, l = Math.sqrt(wx * wx + wy * wy + wz * wz) || 1;
        N[j] = wx / l; N[j + 1] = wy / l; N[j + 2] = wz / l;
      }
      if (C && !s.bake) C.set(a.color.array.subarray(0, n * 3), v * 3);
      else if (C) {                                              // цвет материала — в вершины (вместе с их собственным цветом, если он есть)
        const mc = o.material.color, ca = o.material.vertexColors ? a.color.array : null;
        for (let i = 0, j = v * 3; i < n * 3; i += 3, j += 3) { C[j] = mc.r * (ca ? ca[i] : 1); C[j + 1] = mc.g * (ca ? ca[i + 1] : 1); C[j + 2] = mc.b * (ca ? ca[i + 2] : 1); }
      }
      if (U) U.set(a.uv.array.subarray(0, n * 2), v * 2);
      const ix = o.geometry.index ? o.geometry.index.array : null, cnt = ix ? ix.length : n;
      let k = s.k;
      for (let i = 0; i + 2 < cnt; i += 3) {
        const p0 = v + (ix ? ix[i] : i), p1 = v + (ix ? ix[i + 1] : i + 1), p2 = v + (ix ? ix[i + 2] : i + 2);
        I[k++] = p0; I[k++] = flip ? p2 : p1; I[k++] = flip ? p1 : p2;
      }
      s.k = k; s.v += n;
    }
  }
  if (mergeSig(job) !== job.sig || (E.g && !inScene(E.g))) { E.retry = STILL.frame + 150; return true; }   // пока собирали, что-то сломали или группа скрылась — позже заново
  const proxies = [], box = MERGE.box.makeEmpty();
  for (const s of job.sets) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(s.P, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(s.N, 3));
    if (s.C) geo.setAttribute('color', new THREE.BufferAttribute(s.C, 3));
    if (s.U) geo.setAttribute('uv', new THREE.BufferAttribute(s.U, 2));
    geo.setIndex(new THREE.BufferAttribute(s.I, 1));
    geo.computeBoundingBox(); box.union(geo.boundingBox);
    const m = new THREE.Mesh(geo, s.mat);
    m.renderOrder = s.order; m.matrixAutoUpdate = false; m.userData.proxy = true;
    scene.add(m); proxies.push(m);
  }
  for (const o of job.tracked) o.layers.disable(0);
  E.proxies = proxies; E.tracked = job.tracked; E.parents = job.parents; E.shown = true; E.sig = job.sig;
  E.x = (box.min.x + box.max.x) / 2; E.z = (box.min.z + box.max.z) / 2; E.r = Math.hypot(box.max.x - box.min.x, box.max.z - box.min.z) / 2;
  return true;
}
// отпечаток состояния сведённых мешей: −1 — что-то спрятано или вынуто из группы; иначе сумма версий их вершин
function mergeSig(E) {
  let sum = 0;
  for (let i = 0; i < E.tracked.length; i++) {
    const o = E.tracked[i];
    if (o.parent !== E.parents[i]) return -1;
    for (let q = o; q && q !== E.g; q = q.parent) if (!q.visible) return -1;

}
function mergeDrop(E) {
  for (const o of E.tracked) o.layers.enable(0);
  for (const m of E.proxies) { scene.remove(m); m.geometry.dispose(); }

}
// в группу добавились меши (достроено отложенное): её сводный меш собирается заново
function mergeTouch(g) {
  if (!MERGE.byG) return;
  for (let q = g; q; q = q.parent) {
    const E = MERGE.byG.get(q);
    if (!E) continue;
    if (MERGE.job && MERGE.job.E === E) MERGE.job = null;

function mergeUpdate() {
  const until = Math.min(performance.now() + 3, STILL.until);    // на сборку — не больше 3 мс кадра
  let stepped = !!MERGE.job;                                      // сборка за этот кадр уже продвинулась (новую тогда — только если есть время)
  if (MERGE.job && mergeStep(MERGE.job, until)) MERGE.job = null;
  for (const E of MERGE.list) {
    if (E.g && !inScene(E.g)) {                                  // группа далеко: её не видно
      E.since = -1;
      if (E.proxies) {
        if (E.shown) { for (const m of E.proxies) m.visible = false; E.shown = false; }
        if (++E.gone > 1800) mergeDrop(E);                       // давно не видна — память сводного меша освобождается
      }
      continue;
    }
    if (E.since < 0) E.since = STILL.frame;
    E.gone = 0;
    if (E.proxies) {
      if ((car.x - E.x) ** 2 + (car.z - E.z) ** 2 < (E.r + 150) ** 2 && mergeSig(E) !== E.sig) { mergeDrop(E); E.retry = STILL.frame + 150; continue; }   // рядом что-то сломали
      if (!E.shown) { for (const m of E.proxies) m.visible = true; E.shown = true; }

    }

}

// ---------- Прогрев шейдеров ----------
// Шейдер собирается, когда материал впервые попадает в кадр, — это рывок на 30–100 мс: первая стайка птиц, первый взрыв,
// первый плод, первый сводный меш. Здесь всё собирается заранее, пока идёт загрузка: по крошечному невидимому мешу на
// каждый материал, которого в сцене ещё нет. Эти материалы живут всё время игры, поэтому их шейдеры уже не выбрасываются.
{
  const warm = new THREE.Group(), tri = new THREE.BufferGeometry();
  tri.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, 0, 0, 0, 0], 3));
  tri.setAttribute('normal', new THREE.Float32BufferAttribute([0, 1, 0, 0, 1, 0, 0, 1, 0], 3));
  tri.setAttribute('color', new THREE.Float32BufferAttribute([1, 1, 1, 1, 1, 1, 1, 1, 1], 3));
  tri.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, 0], 2));
  const basic = (o) => new THREE.MeshBasicMaterial(o);
  for (const m of [BIRD_MAT, BANANA_MAT, COCONUT_MAT, WEED_MAT, BANANA_POOL_MAT,
    BANANA_STEM_MAT, BANANA_LEAF_MAT, FRUIT_MAT, PALM_TRUNK_MAT, PALM_FROND_MAT, SHRUB_MAT, CANNABIS_MAT, JG.mat,   // растения и лес: их меши появляются уже на ходу
    basic({ transparent: true, fog: false, depthWrite: false, side: THREE.DoubleSide }),              // огонь взрыва
    basic({ transparent: true, depthWrite: false, polygonOffset: true }),                             // подпалина
    lambert({ vertexColors: true }), lambert({ vertexColors: true, side: THREE.DoubleSide }),         // сводные меши построек
    lambert({ vertexColors: true, emissive: 0x1c1c1c }), lambert({ vertexColors: true, side: THREE.DoubleSide, emissive: 0x1c1c1c })]) warm.add(new THREE.Mesh(tri, m));
  warm.add(new THREE.Sprite(BANANA_HALO_MAT));
  warm.visible = false;
  scene.add(warm);
  renderer.setRenderTarget(lowRT);
  renderer.compile(scene, camera);
  renderer.setRenderTarget(null);
}

// ---------- Цикл ----------
mergeSetup();
let last = performance.now();
radioInit();
updateSky(0, 0);
updateCamera(0, true);
// Звуковые данные — после первого кадра (теги script type="text/later" в начале страницы), строго по порядку: записи
// моторов, потом sound_data.js — когда он есть, всё для мотора, шин и моря на месте. Если человек уже нажимал клавишу
// или касался экрана, пока данные качались, звук запускается сам; птицы и фон подключаются, как только пришли их записи.
function loadLaterScripts() {
  for (const tag of document.querySelectorAll('script[type="text/later"]')) {
    const s = document.createElement('script'), src = tag.dataset.src;
    s.src = src; s.async = false;
    s.onload = () => {
      if (src === 'sound_data.js' && navigator.userActivation && navigator.userActivation.hasBeenActive) soundStart();
      if (SOUND.ready && src === 'birds_data.js' && !SOUND.busBirds && typeof birdsStart === 'function') birdsStart();
      if (SOUND.ready && src === 'ambience_data.js' && !SOUND.busAmb && typeof ambienceStart === 'function') ambienceStart();
    };
    s.onerror = () => console.warn('звук: не загрузился ' + src);
    document.body.appendChild(s);
  }
}
function frame(now) {
  if (++STILL.frame === 2) { const l = document.getElementById('loading'); if (l) l.remove(); loadLaterScripts(); }
  fpsTick(now);
  liveAnalyse();
  // не меньше нуля: отметка первого кадра бывает раньше конца загрузки, а шаг назад во времени ломает физику
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  update(dt);
  updateSky(dt, now / 1000);
  updateCamera(dt, false);
  updateBananas(dt, now / 1000);
  updateBirds(dt, now / 1000);
  // Подгрузка (растения, лес, рельеф, отложенные постройки, сводные меши): вместе — не больше 7 мс, считая отсюда, а не от
  // начала кадра. Если время уже вышло, каждая часть всё равно делает хотя бы один шаг — иначе на медленном устройстве,
  // где физика и небо сами съедают 7 мс, мир вокруг перестал бы достраиваться совсем.
  STILL.until = performance.now() + 7;
  updateVegChunks();
  updateJungle();
  updatePiers(now / 1000);
  updateTerrainFar();
  lazyRun();
  mergeUpdate();
  updateSea(now / 1000);
  vegWind.value = (now / 1000) % (200 * Math.PI);   // период кратен всем частотам ветра (шаг 0.01 рад/с) — на стыке нет рывка
  if (soundSpeakers) {                     // саунд-система подпрыгивает под бочку — на ту же высоту, что жук
    const mp = musicPose(musicNow());
    soundSpeakers.position.y = PLINTH_H + mp.y / SOUND_SCALE;
  }
  renderFrame();
  drawFlare(dt);
  drawBlinders();
  drawHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
